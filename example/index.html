<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Interrogatory &amp; Motion Drafter Demo</title>
<link rel="icon" href="../favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../favicon-16x16.png">
<link rel="icon" type="image/png" sizes="192x192" href="../android-chrome-192x192.png">
<link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">
<style>
/* Black and white with greys, Times New Roman throughout.
   Color marks status only: green approved, blue checked, amber needs recheck, red needs information.
   Bracketed capitals such as [PLAINTIFF NAME] are blanks to fill in, shaded grey. */
:root{
  color-scheme:light;
  --ink:#141414;
  --muted:#6B6B6B;
  --faint:#9B9B9B;
  --line:#E7E7E7;
  --line-strong:#D3D3D3;
  --bg:#F6F6F6;
  --surface:#FFFFFF;
  --hover:#F3F3F3;
  --sel:#EDEDED;
  --black:#111111;
  --white:#FFFFFF;
  --desk:#ECECEC;
  --grey-bg:#F0F0F0;
  --f:"Times New Roman",Times,"Liberation Serif",serif;
  --mono:Consolas,Menlo,"Courier New",monospace;
  --r:6px;
  --green:#1E7F4F; --green-bg:#E6F4EC; --green-line:#A9D8BE;
  --blue:#2557B5;  --blue-bg:#E9EFFA;  --blue-line:#B9CBEE;
  --amber:#9A5A00; --amber-bg:#FDF2DA; --amber-line:#EDCB86;
  --red:#B42318;   --red-bg:#FCECEB;   --red-line:#F0B7B2;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ink);text-underline-offset:2px;text-decoration-color:var(--line-strong)}
:focus-visible{outline:2px solid var(--black);outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}

/* top bar */
.bar{background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:6px 22px;padding:12px 20px;min-height:52px}
.app{font-size:18px;font-weight:bold;white-space:nowrap}
.demo{margin-left:6px;font-size:12.5px;font-weight:normal;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line-strong);border-radius:999px;padding:0 9px;vertical-align:2px}
.mat{flex:1 1 320px;min-width:0;display:flex;flex-wrap:wrap;gap:0 10px;align-items:baseline;color:var(--muted);font-size:15px}
.mat b{font-weight:normal;color:var(--ink);overflow-wrap:anywhere}
.mat span{font-variant-numeric:tabular-nums}
.due{font-size:14px;padding:3px 11px;border-radius:999px;background:var(--grey-bg);color:var(--muted);white-space:nowrap}
.due.ok{background:var(--green-bg);color:var(--green)}
.due.soon{background:var(--amber-bg);color:var(--amber);font-weight:bold}
.due.late{background:var(--red-bg);color:var(--red);font-weight:bold}
.notice{background:var(--blue-bg);color:#1B3F84;border-bottom:1px solid var(--blue-line);font-size:14.5px}
.notice div{padding:6px 20px}
@media (max-width:640px){.due{white-space:normal}}

/* frame */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr)}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:14px 10px 40px;position:sticky;top:0;align-self:start;height:100vh;overflow:auto}
.rail h4{font-size:12.5px;font-weight:normal;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:16px 10px 6px}
.rail h4:first-child{margin-top:2px}
.step{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;border:0;background:none;padding:6px 10px;border-radius:var(--r);cursor:pointer;color:var(--ink)}
.step:hover{background:var(--hover)}
.step.on{background:var(--sel)}
.step.on .t b{font-weight:bold}
.step .num{min-width:1.1em;color:var(--faint);font-variant-numeric:tabular-nums}
.step .t{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.step .t b{font-weight:normal;font-size:15.5px}
.step .t i{font-style:normal;font-size:13.5px;color:var(--muted)}
.step .t i.warn{color:var(--red)}
.step .t i.ok{color:var(--green)}
main{padding-block:26px 120px;padding-inline:32px;min-width:0;max-width:1240px}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px 10px}
  .rail h4,.step .t i{display:none}
  .step{width:auto;flex:none;align-items:center}
  .top-in{padding:10px 16px}
  .notice div{padding:6px 16px}
  main{padding-block:18px 90px;padding-inline:16px}
}

/* page heading, panels, fields */
.ph{margin-bottom:22px}
.ph .stepno{display:block;font-size:13.5px;color:var(--faint);letter-spacing:.04em;margin-bottom:2px}
.ph h1{margin:0;font-size:27px;line-height:1.2;text-wrap:balance}
.ph p{margin:6px 0 0;max-width:70ch;color:var(--muted)}
.group,.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:18px;min-width:0}
.group>header,.card>header{padding:14px 18px 0;display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline;justify-content:space-between}
.group h3,.card h3{margin:0;font-size:18px}
.note{margin:3px 0 0;font-size:14.5px;color:var(--muted);max-width:76ch;flex-basis:100%}
.group>header>.note,.card>header>.note{max-width:none}
.gbody{padding:14px 18px 18px}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:14px 20px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f>label,.f .lab{font-weight:bold;font-size:15px}
.hint{font-size:13.5px;color:var(--faint)}
.needfor{font-size:13.5px;color:var(--red)}
.f.need>input,.f.need>select,.f.need>textarea{border-color:var(--red-line);background:#FFFCFB}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line-strong);border-radius:4px;padding:6px 9px;min-height:36px;font-size:16px}
textarea{min-height:72px;resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--black);box-shadow:0 0 0 3px rgba(0,0,0,.07)}
input[type=radio],input[type=checkbox]{accent-color:var(--black);width:16px;height:16px;margin:0;flex:none}
.yn{display:flex;gap:22px;padding:6px 2px}
.yn label{display:inline-flex;gap:7px;align-items:center;cursor:pointer}
.flash{animation:flash 1.8s ease;border-radius:4px}
@keyframes flash{0%,55%{box-shadow:0 0 0 4px var(--amber-line)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.flash{animation:none;box-shadow:0 0 0 3px var(--amber-line)}}
.items{display:flex;flex-direction:column;gap:12px}
.item{border:1px solid var(--line);border-radius:var(--r);background:#FCFCFC}
.item>header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px 0}
.item>header b{font-weight:normal;font-size:14.5px;color:var(--muted)}
.item>header .btn{border-color:transparent;background:transparent;color:var(--red)}
.item>header .btn:hover{background:var(--red-bg)}
.item>.fields{padding:10px 12px 14px}
.empty-list{margin:0;color:var(--faint)}
.nextbar{position:sticky;bottom:0;z-index:5;display:flex;justify-content:flex-end;padding:12px 0;background:linear-gradient(rgba(246,246,246,0),var(--bg) 35%)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:4px;padding:5px 14px;font-size:15px;cursor:pointer;min-height:34px;color:var(--ink);text-align:center;text-decoration:none}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--black);border-color:var(--black);color:var(--white)}
.btn.pri:hover{background:#333333}
.btn.check{background:var(--blue);border-color:var(--blue);color:var(--white)}
.btn.check:hover{background:#1D4794}
.btn.approve{background:var(--green);border-color:var(--green);color:var(--white)}
.btn.approve:hover{background:#17673F}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted)}
.btn.quiet:hover{background:var(--hover);color:var(--ink)}
.btn.sm{padding:2px 10px;min-height:30px;font-size:14px}
.btn.armed{background:var(--red);border-color:var(--red);color:var(--white)}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* status */
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;line-height:1.5;padding:1px 9px;border-radius:999px;background:var(--grey-bg);color:var(--muted);white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.st-approved{background:var(--green-bg);color:var(--green)}
.st-checked{background:var(--blue-bg);color:var(--blue)}
.st-recheck{background:var(--amber-bg);color:var(--amber)}
.st-missing,.st-blank{background:var(--red-bg);color:var(--red)}
.st-edited{background:var(--grey-bg);color:var(--ink)}

.callout{border-radius:var(--r);padding:10px 14px;font-size:15px;margin-bottom:14px;background:var(--grey-bg)}
.callout.amber{background:var(--amber-bg);color:#6B4000}
.callout.green{background:var(--green-bg);color:#145A37}
.callout.red{background:var(--red-bg);color:#7E1A12}
.callout.blue{background:var(--blue-bg);color:#1B3F84}
.banner{border-radius:var(--r);padding:10px 14px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:8px 12px;justify-content:space-between;align-items:center;font-size:15px;background:var(--amber-bg);color:#6B4000}

/* Form A answers */
.rv{display:grid;grid-template-columns:minmax(270px,330px) minmax(0,1fr);gap:18px;align-items:start}
.rv-index{position:sticky;top:16px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;margin:0;overflow:hidden}
.rv-index .scroll{overflow:auto;min-height:0;border-top:1px solid var(--line)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:14.5px;padding:12px 16px 10px}
.stats b{font-variant-numeric:tabular-nums}
.stats .c-green b{color:var(--green)}
.stats .c-blue b{color:var(--blue)}
.stats .c-amber b{color:var(--amber)}
.stats .c-red b{color:var(--red)}
.filters{display:flex;flex-wrap:wrap;gap:4px;padding:0 12px 10px}
.filters button{border:0;background:none;font-size:14px;padding:2px 10px;border-radius:999px;color:var(--muted);cursor:pointer}
.filters button:hover{background:var(--hover)}
.filters button.on{background:var(--black);color:var(--white)}
.qindex{width:100%;border-collapse:collapse;font-size:15px}
.qindex th{position:sticky;top:0;background:var(--surface);text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:normal;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);z-index:1}
.qindex td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.qindex td:first-child{text-align:right;font-variant-numeric:tabular-nums;width:2.6em;color:var(--faint)}
.qindex tr{cursor:pointer}
.qindex tr:hover td{background:var(--hover)}
.qindex tr.sel td{background:var(--sel)}
.qindex tr.sel td:first-child{color:var(--ink);font-weight:bold}
.qbtn{border:0;background:none;padding:0;text-align:left;cursor:pointer;color:inherit}
@media (max-width:1100px){.rv{grid-template-columns:minmax(0,1fr)}.rv-index{position:static;max-height:none}.rv-index .scroll{max-height:300px}}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.qhead{padding:16px 18px 0;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;justify-content:space-between}
.qhead h2{margin:0;font-size:22px}
.qsrc{font-size:14.5px;color:var(--muted)}
.qtext{margin:12px 18px 0;padding:12px 14px;background:#FAFAFA;border:1px solid var(--line);border-radius:var(--r);max-width:92ch}
.qtext .lab{display:block;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);margin-bottom:2px}
.ans{padding:16px 18px}
.ans-view{white-space:pre-wrap;overflow-wrap:anywhere;font-size:17px;line-height:1.55;padding:2px 0;max-width:86ch}
#ans-edit{font-size:17px;min-height:260px;max-width:86ch}
mark.miss{background:var(--red-bg);color:var(--red);font-weight:bold;padding:0 5px;border-radius:3px;font-size:.9em}
mark.atty{background:var(--blue-bg);color:var(--blue);padding:0 5px;border-radius:3px;font-style:italic;font-size:.92em}
mark.blank{background:var(--grey-bg);color:var(--ink);padding:0 4px;border-radius:3px;box-shadow:inset 0 -1px 0 var(--line-strong)}
.desig{margin:10px 0 0;font-style:italic;color:var(--muted);max-width:86ch;font-size:15px}
.needs{margin-top:14px;padding:10px 14px;border-radius:var(--r);background:var(--red-bg);color:#7E1A12;max-width:86ch}
.needs ul{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.needs li{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center}
.needs .muted{color:#9C5048}
.needs .btn{border-color:var(--red-line)}
.tools{margin-top:14px}
.tools select,.pick select{width:auto;max-width:100%}
.qfoot{border-top:1px solid var(--line);padding:12px 18px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.signoff{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* supplemental */
.supp .gbody{display:flex;flex-direction:column;gap:12px}
.supp .callout{margin:0}
.sugg{font-size:15px}

/* tables and checklists */
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.tbl thead th{font-weight:normal;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
.tbl tbody th{font-weight:normal;width:56%}
.tbl tr:last-child th,.tbl tr:last-child td{border-bottom:0}
.tbl small{display:block;color:var(--muted);font-size:13.5px}
.tbl td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.scrollx{overflow-x:auto}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px;margin-bottom:18px}
.grid2>.card,.grid2>.stack>.card{margin:0}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.checks{margin:0;padding:0;list-style:none}
.checks li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line)}
.checks li:first-child{border-top:0}
.checks input{margin-top:4px}
.checks label{cursor:pointer;min-width:0}
.checks small{display:block;color:var(--muted);font-size:13.5px}
.ready{display:flex;flex-direction:column;gap:8px}
.ready>div{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 10px;align-items:center}

/* documents */
.docbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin:6px 0 12px}
.docbar h2{margin:0;font-size:19px}
.paper-wrap{overflow-x:auto;background:var(--desk);border-radius:var(--r);padding:22px}
.paper{background:#FFFFFF;color:#000000;box-shadow:0 1px 3px rgba(0,0,0,.12),0 6px 24px rgba(0,0,0,.06);width:8.5in;min-height:11in;margin:0 auto;padding:1in;font-family:var(--f);font-size:12pt;line-height:1.45}
@media (max-width:980px){.paper{width:100%;min-height:0;padding:26px 20px;font-size:11pt}.paper-wrap{padding:10px}}
.tabs{display:flex;flex-wrap:wrap;gap:20px;border-bottom:1px solid var(--line)}
.tab{border:0;border-bottom:2px solid transparent;background:none;padding:6px 0;margin-bottom:-1px;cursor:pointer;font-size:15px;color:var(--muted)}
.tab.on{border-color:var(--black);color:var(--ink);font-weight:bold}
.mlist2{list-style:none;margin:0;padding:6px}
.mlist2 label{display:flex;gap:10px;padding:9px 12px;cursor:pointer;align-items:flex-start;border-radius:var(--r)}
.mlist2 label:hover{background:var(--hover)}
.mlist2 input{margin-top:4px}
.mlist2 li.on label{background:var(--sel)}
.mlist2 small{display:block;color:var(--muted);font-size:14px}
.clauses{list-style:none;margin:0;padding:0}
.clauses li{padding:10px 0;border-top:1px solid var(--line)}
.clauses li:first-child{border-top:0;padding-top:0}
.clauses p{margin:4px 0 6px;max-width:84ch}

/* forms library */
.libq{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:6px}
.libq summary{cursor:pointer;padding:8px 14px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.libq summary b{min-width:3.6em}
.libq .in{padding:10px 14px 16px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)}
.code{font-family:var(--mono)!important;font-size:13.5px!important}
.tpl-prev{white-space:pre-wrap;border-radius:var(--r);padding:10px 12px;background:#FAFAFA;border:1px solid var(--line);overflow-wrap:anywhere}
.help code{font-family:var(--mono);font-size:13px;background:var(--grey-bg);padding:0 4px;border-radius:3px}
.help table{min-width:480px}

.returnbar{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--blue-bg);color:#1B3F84;border:1px solid var(--blue-line);border-radius:var(--r);padding:6px 6px 6px 14px;box-shadow:0 6px 20px rgba(0,0,0,.12);max-width:calc(100% - 32px)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--black);color:var(--white);padding:8px 16px;border-radius:var(--r);z-index:60;max-width:calc(100% - 32px);font-size:15px}

@media print{
  @page{size:8.5in 11in;margin:1in}
  body{background:#FFFFFF}
  #topbar,.rail,.returnbar,.toast,main>*:not(.print-root){display:none!important}
  main{padding:0}
  .print-root>*:not(.paper-wrap){display:none!important}
  .paper-wrap{overflow:visible;padding:0;border:0;background:none}
  .paper{box-shadow:none;width:auto;min-height:0;padding:0}
}
.green-text{color:var(--green)}
.amber-text{color:var(--amber)}
.red-text{color:var(--red)}
</style>

<header id="topbar"></header>
<div class="shell">
  <nav class="rail" id="rail" aria-label="Tasks"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<noscript><p style="padding:20px">This tool needs JavaScript turned on in the browser.</p></noscript>

<script>
(() => {
'use strict';

/* ======================================================================
   Interrogatory & Motion Drafter
   Plain HTML, CSS and JavaScript. No server, no AI service, no libraries.
   Matters are kept in this browser on the office computer and can be
   saved as files in the case folder.
   ====================================================================== */

const LOCAL = true;  // this copy offers Word downloads, printing and file saving wherever it is opened
const KEY = 'imd.';
const store = {
  get(k){ try{ const v = localStorage.getItem(KEY + k); return v ? JSON.parse(v) : null; }catch(e){ return null; } },
  set(k, v){ try{ localStorage.setItem(KEY + k, JSON.stringify(v)); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem(KEY + k); }catch(e){} }
};
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function getPath(o, p){ return p.split('.').reduce((a, k) => a == null ? undefined : a[k], o); }
function setPath(o, p, v){
  const ks = p.split('.'); let a = o;
  for(let i = 0; i < ks.length - 1; i++){
    const k = ks[i];
    if(a[k] == null || typeof a[k] !== 'object') a[k] = /^\d+$/.test(ks[i + 1]) ? [] : {};
    a = a[k];
  }
  a[ks[ks.length - 1]] = v;
}
const isEmpty = v => v == null || (typeof v === 'string' && v.trim() === '') || (Array.isArray(v) && v.length === 0);
const num = v => { const s = String(v ?? '').replace(/[$,\s]/g, ''); if(s === '') return null; const n = Number(s); return isFinite(n) ? n : null; };

/* ---------- dates (calendar days, computed in UTC to avoid time-zone drift) ---------- */
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function pd(s){ const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])) : null; }
function iso(d){ return d.toISOString().slice(0, 10); }
function addDays(s, n){ const d = pd(s); if(!d) return ''; d.setUTCDate(d.getUTCDate() + n); return iso(d); }
function rollFwd(s){ const d = pd(s); if(!d) return ''; while(d.getUTCDay() === 0 || d.getUTCDay() === 6) d.setUTCDate(d.getUTCDate() + 1); return iso(d); }
function isWeekend(s){ const d = pd(s); return d ? (d.getUTCDay() === 0 || d.getUTCDay() === 6) : false; }
function fDate(s){ const d = pd(s); return d ? `${MONTHS[d.getUTCMonth()]} ${d.getUTCDate()}, ${d.getUTCFullYear()}` : s; }
function fDay(s){ const d = pd(s); return d ? `${DOW[d.getUTCDay()]}, ${fDate(s)}` : ''; }
function fShort(s){ const d = pd(s); return d ? `${MONTHS[d.getUTCMonth()].slice(0, 3)}. ${d.getUTCDate()}` : ''; }
function todayISO(){ const t = new Date(); return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`; }
function daysUntil(s){ const a = pd(todayISO()), b = pd(s); return (a && b) ? Math.round((b - a) / 86400000) : null; }
function fTime(s){ const m = /^(\d{1,2}):(\d{2})/.exec(s || ''); if(!m) return s; let h = +m[1]; const ap = h >= 12 ? 'p.m.' : 'a.m.'; h = h % 12 || 12; return `${h}:${m[2]} ${ap}`; }
function fMoney(v){ const n = num(v); return n == null ? String(v) : '$' + n.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}); }

/* index of every field path, used to label and locate missing information */
const FIELD_INDEX = {};
const INTAKE = ['matter','police','medical','client','attorney'];
INTAKE.forEach(step => SCHEMA[step].forEach(g => g.fields.forEach(f => {
  FIELD_INDEX[f.k] = {l: f.l, step, t: f.t || 'text', list: f.t === 'list', item: f.item};
  if(f.t === 'list') f.fields.forEach(sf => { FIELD_INDEX[`${f.k}.*.${sf.k}`] = {l: sf.l, step, t: sf.t || 'text'}; });
})));
Object.assign(FIELD_INDEX, {
  'calc.ssnText': {jump: 'client.ssnLast4'},
  'medical.providers.*.owed': {jump: '.billed'},
  'calc.totalBilled': {jump: 'medical.providers'},
  'served.date': {l: 'Date Form A answers were served', step: 'finish', t: 'date'}
});
const norm = p => p.replace(/\.\d+(?=\.|$)/g, '.*');
function missRecord(path){
  let meta = FIELD_INDEX[norm(path)];
  if(meta && meta.jump){
    path = meta.jump.startsWith('.') ? path.replace(/\.[^.]+$/, meta.jump) : meta.jump;
    meta = FIELD_INDEX[norm(path)];
  }
  let label = meta ? meta.l : path;
  const m = /^(.*)\.(\d+)\.[^.]+$/.exec(path);
  if(m){ const lm = FIELD_INDEX[norm(m[1])]; if(lm && lm.item) label = `${lm.item} ${+m[2] + 1}: ${meta ? meta.l : ''}`; }
  else if(meta && meta.list) label = `${meta.l} (add at least one)`;
  return {path, label, step: meta ? meta.step : null};
}

/* ======================================================================
   TEMPLATE ENGINE
   {{path}}  {{path|date}}  {{#if path}}..{{else}}..{{/if}}
   {{#if path == value}}  {{#each list}}{{.field}} {{@a}} {{/each}}  {{need path}}
   A blank value prints [MISSING: label] and is listed for staff to fill.
   ====================================================================== */
const TPL_CACHE = new Map();
function parseTpl(src){
  if(TPL_CACHE.has(src)) return TPL_CACHE.get(src);
  const re = /\{\{\s*(#each|#if|\/each|\/if|else|need)?\s*([^}]*?)\s*\}\}/g;
  const root = {kids: []}; const stack = [root]; let last = 0, m;
  const cur = () => { const n = stack[stack.length - 1]; return n.inElse ? n.alt : n.kids; };
  while((m = re.exec(src))){
    if(m.index > last) cur().push({t: 'text', v: src.slice(last, m.index)});
    const kw = m[1], arg = m[2];
    if(kw === '#each' || kw === '#if'){ const node = {t: kw.slice(1), arg, kids: [], alt: [], inElse: false}; cur().push(node); stack.push(node); }
    else if(kw === 'else'){ if(stack.length > 1) stack[stack.length - 1].inElse = true; }
    else if(kw === '/each' || kw === '/if'){ if(stack.length > 1) stack.pop(); }
    else if(kw === 'need') cur().push({t: 'need', v: arg});
    else cur().push({t: 'var', v: arg});
    last = re.lastIndex;
  }
  if(last < src.length) cur().push({t: 'text', v: src.slice(last)});
  TPL_CACHE.set(src, root.kids);
  if(TPL_CACHE.size > 400) TPL_CACHE.clear();
  return root.kids;
}
const FILTERS = {
  date: v => fDate(String(v)), time: v => fTime(String(v)), money: v => fMoney(v),
  lower: v => String(v).toLowerCase(), upper: v => String(v).toUpperCase()
};
function resolve(path, sc){
  if(path === '.') return {v: sc.item, p: sc.itemPath};
  if(path === '@n') return {v: sc.idx + 1};
  if(path === '@a') return {v: String.fromCharCode(97 + (sc.idx % 26))};
  if(path.startsWith('.')){ const k = path.slice(1); return {v: sc.item != null ? getPath(sc.item, k) : undefined, p: `${sc.itemPath}.${k}`}; }
  return {v: getPath(sc.root, path), p: path};
}
function runTpl(nodes, sc, missing){
  let s = '';
  const miss = p => {
    const r = missRecord(p || '');
    if(!missing.some(x => x.label === r.label)) missing.push(r);
    return `[MISSING: ${r.label}]`;
  };
  for(const n of nodes){
    if(n.t === 'text') s += n.v;
    else if(n.t === 'var'){
      const [path, ...filters] = n.v.split('|').map(x => x.trim());
      const r = resolve(path, sc);
      if(isEmpty(r.v)) s += miss(r.p);
      else s += filters.reduce((v, f) => FILTERS[f] ? FILTERS[f](v) : v, r.v);
    }
    else if(n.t === 'need') s += miss(resolve(n.v.trim(), sc).p);
    else if(n.t === 'if'){
      const cmp = /^(\S+)\s*(==|!=)\s*(\S+)$/.exec(n.arg.trim());
      if(cmp){
        const r = resolve(cmp[1], sc);
        if(isEmpty(r.v)){ s += miss(r.p); continue; }
        const eq = String(r.v) === cmp[3];
        s += runTpl((cmp[2] === '==' ? eq : !eq) ? n.kids : n.alt, sc, missing);
      } else {
        const r = resolve(n.arg.trim(), sc);
        const truthy = !isEmpty(r.v) && r.v !== false && r.v !== 'no';
        s += runTpl(truthy ? n.kids : n.alt, sc, missing);
      }
    }
    else if(n.t === 'each'){
      const r = resolve(n.arg.trim(), sc);
      (Array.isArray(r.v) ? r.v : []).forEach((it, i) => {
        s += runTpl(n.kids, {root: sc.root, item: it, idx: i, itemPath: (it && it.__path) || `${r.p}.${i}`}, missing);
      });
    }
  }
  return s;
}
const tidy = s => s.replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').replace(/ {2,}/g, ' ').trim();
function renderTpl(src, ctx){
  const missing = [];
  let text = '';
  try{ text = tidy(runTpl(parseTpl(src || ''), {root: ctx, item: null, idx: -1, itemPath: ''}, missing)); }
  catch(e){ text = '[TEMPLATE ERROR: check this template in the Forms library]'; }
  return {text, missing};
}

function computeCalc(M, F){
  const c = {};
  const isAuto = M.caption?.caseType === 'auto';
  c.isAuto = isAuto;
  c.hasSupp = (M.supp?.items || []).length > 0;
  c.incidentNoun = isAuto ? 'a motor vehicle collision' : 'an incident';
  const last4 = String(M.client?.ssnLast4 || '').replace(/\D/g, '');
  c.ssnText = F.ssnMode === 'separate' ? 'Provided to counsel for defendants under separate confidential cover.' : (last4.length === 4 ? `XXX-XX-${last4}` : '');
  const provs = (M.medical?.providers || []).map((p, i) => {
    const b = num(p.billed), pd_ = num(p.paid);
    return {...p, __path: `medical.providers.${i}`, owed: b == null ? '' : b - (pd_ || 0),
      paidText: pd_ == null ? 'none recorded to date' : fMoney(pd_) + (p.payer ? ` by ${p.payer}` : '')};
  }).sort((a, b) => (a.first || '9999').localeCompare(b.first || '9999'));
  c.providers = provs;
  c.admissions = provs.filter(p => p.kind === 'Hospital admission');
  c.er = provs.filter(p => p.kind === 'Emergency department');
  c.current = provs.filter(p => p.ongoing === 'yes');
  const billed = provs.map(p => num(p.billed)).filter(v => v != null);
  c.totalBilled = billed.length ? billed.reduce((a, b) => a + b, 0) : '';
  const seen = new Set(); c.eyewitnesses = [];
  const addW = (arr, base) => (arr || []).forEach((w, i) => {
    const key = (w.name || '').trim().toLowerCase();
    if(key && seen.has(key)) return; if(key) seen.add(key);
    c.eyewitnesses.push({...w, __path: `${base}.${i}`, relationship: w.relationship || 'None', interest: w.interest || 'None known'});
  });
  addW(M.police?.witnesses, 'police.witnesses'); addW(M.client?.witnesses, 'client.witnesses');
  const docs = [];
  if(M.police?.reportNo) docs.push(`${M.police.agency || 'Police'} Crash Investigation Report No. ${M.police.reportNo}`);
  if(provs.length) docs.push('Records, reports and bills of the health care providers identified in the answer to Interrogatory No. 7');
  if((M.medical?.tests || []).length) docs.push('Diagnostic test results identified in the answer to Interrogatory No. 6');
  if((M.client?.photos || []).length) docs.push('Photographs identified in the answer to Interrogatory No. 18');
  if(M.client?.employed === 'yes') docs.push('Employment and wage records (to be supplied)');
  if(isAuto && M.client?.pip === 'yes'){ docs.push('Automobile insurance declaration sheet'); docs.push('PIP payout ledger (to be supplied upon receipt)'); }
  if(M.client?.medicare === 'yes') docs.push("Copy of plaintiff's Medicare card");
  (M.attorney?.documentsExtra || '').split('\n').map(s => s.trim()).filter(Boolean).forEach(s => docs.push(s));
  c.documents = docs;
  const att = [];
  if(M.client?.medicare === 'yes') att.push(['medicare', 'Copy of Medicare card', 'Question 1']);
  if((M.medical?.tests || []).length) att.push(['tests', 'Diagnostic test results', 'Question 6']);
  if(provs.some(p => p.report === 'yes')) att.push(['reports', 'Written reports of treating providers who may testify', 'Question 7']);
  if(docs.length) att.push(['docs', 'Documents identified', 'Question 15']);
  if((M.client?.photos || []).length) att.push(['photos', 'Copies of photographs', 'Question 18']);
  if(M.attorney?.statementsYN === 'yes') att.push(['stmts', 'Written non-party statements', 'Question 21']);
  if((M.attorney?.experts || []).length) att.push(['experts', 'Expert resumes and reports', 'Question 23']);
  if(isAuto && M.client?.malfunction === 'yes') att.push(['repair', 'Repair bills', 'Question 28']);
  if(isAuto && M.client?.pip === 'yes') att.push(['dec', 'Insurance declaration sheet', 'Question 37']);
  att.push(['cert', 'Certification signed and dated by plaintiff', 'Certification']);
  c.attachments = att;
  c.hipaa = provs.filter(p => p.name);
  const as = M.caption?.answerServed;
  if(as){ c.dueRaw = addDays(as, 30); c.due = rollFwd(c.dueRaw); c.thresholdDue = rollFwd(addDays(as, 60)); }
  if(M.caption?.discoveryEnd) c.amendBy = addDays(M.caption.discoveryEnd, -20);
  return c;
}
function activeQs(M){ const auto = M.caption?.caseType === 'auto'; return lib().qs.filter(q => auto || q.n <= 24); }
function computeSupp(){
  const L = lib();
  return (cur.supp?.items || []).map((it, i) => {
    const q = it.q || '', a = it.a || '';
    const markers = (a.match(/\[MISSING: [^\]]+\]/g) || []).length;
    const missing = (it.miss || []).filter(mi => a.includes(`[MISSING: ${mi.label}]`));
    const lq = q.toLowerCase();
    const sugg = L.supp.map((e, k) => ({k, t: e.t, score: (e.k || []).filter(w => w && lq.includes(String(w).toLowerCase())).length}))
      .filter(x => x.score > 0).sort((x, y) => y.score - x.score).slice(0, 3);
    const empty = !a.trim();
    const nMiss = Math.max(missing.length, markers);
    const paraOK = !!it.paraOK && it.paraText === a;
    const attyOK = !!it.reviewed && it.reviewedText === a;
    const signedBefore = !!(it.paraOK || it.reviewed);
    const status = empty ? 'blank' : nMiss ? 'missing' : attyOK ? 'approved' : paraOK ? 'checked' : signedBefore ? 'recheck' : 'draft';
    return {i, n: i + 1, q, a, missing, nMiss: nMiss + (empty ? 1 : 0), over: i >= 10,
      subparts: (q.match(/\(\s*(?:[a-h]|i{1,3}|iv|v)\s*\)/gi) || []).length >= 2, sugg, status, paraOK, attyOK, it};
  });
}
function compute(){
  const F = firm();
  CTX = {...cur, firm: F, clause: CLAUSE_MAP};
  CTX.calc = computeCalc(cur, F);
  A = activeQs(cur).map(q => {
    const auto = renderTpl(q.tpl, CTX);
    const saved = (cur.answers || {})[q.n] || {};
    const edited = typeof saved.text === 'string';
    const final = edited ? saved.text : auto.text;
    const missing = edited ? auto.missing.filter(mi => final.includes(`[MISSING: ${mi.label}]`)) : auto.missing.slice();
    let desig = '';
    if(F.desig === 'answer'){
      const parts = q.src.filter(s => DESIG[s]).map(s => renderTpl(DESIG[s], CTX));
      desig = parts.map(p => p.text).join(' ');
      parts.forEach(p => p.missing.forEach(mi => { if(!missing.some(x => x.label === mi.label)) missing.push(mi); }));
    }
    const markers = (final.match(/\[MISSING: [^\]]+\]/g) || []).length;
    const nMiss = Math.max(missing.length, markers);
    const paraOK = !!saved.paraOK && saved.paraText === final;
    const attyOK = !!saved.reviewed && saved.reviewedText === final;
    const signedBefore = !!(saved.paraOK || saved.reviewed);  // signed off once, wording changed since
    const status = nMiss ? 'missing' : attyOK ? 'approved' : paraOK ? 'checked' : signedBefore ? 'recheck' : edited ? 'edited' : 'draft';
    const stale = edited && saved.base != null && saved.base !== auto.text;
    return {q, auto, saved, edited, final, missing, nMiss, desig, paraOK, attyOK, status, stale};
  });
  SUPP = computeSupp();
  NEED = new Map();
  const add = (path, tag) => { const arr = NEED.get(path) || []; if(!arr.includes(tag)) arr.push(tag); NEED.set(path, arr); };
  A.forEach(a => a.missing.forEach(mi => add(mi.path, `No. ${a.q.n}`)));
  SUPP.forEach(s => s.missing.forEach(mi => add(mi.path, `Supplemental No. ${s.n}`)));
}

/* fill [MISSING] markers in supplemental answers once the field has been filled in */
function fillSuppMarkers(){
  let changed = false;
  (cur.supp?.items || []).forEach(it => {
    (it.miss || []).forEach(mi => {
      const marker = `[MISSING: ${mi.label}]`;
      if(!it.a || !it.a.includes(marker)) return;
      const meta = FIELD_INDEX[norm(mi.path)];
      const t = meta ? meta.t : 'text';
      if(t === 'yn' || t === 'list' || t === 'select') return;
      const v = getPath(cur, mi.path);
      if(isEmpty(v)) return;
      it.a = it.a.split(marker).join(t === 'date' ? fDate(v) : t === 'money' ? fMoney(v) : String(v));
      changed = true;
    });
  });
  if(changed) saveMatter();
  return changed;
}

function download(name, content, type){
  try{
    const blob = new Blob(type === 'application/msword' ? ['﻿', content] : [content], {type});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);

  }catch(e){ toast('The browser blocked the download.'); }

async function copyDoc(html, text, node){
  try{
    if(window.ClipboardItem && navigator.clipboard?.write){
      await navigator.clipboard.write([new ClipboardItem({'text/html': new Blob([html], {type: 'text/html'}), 'text/plain': new Blob([text], {type: 'text/plain'})})]);
      return toast('Copied. Paste into the firm\'s Word pleading template.');
    }
  }catch(e){}
  try{
    const sel = getSelection(); const r = document.createRange(); r.selectNodeContents(node); sel.removeAllRanges(); sel.addRange(r);
    const ok = document.execCommand('copy');
    if(ok){ sel.removeAllRanges(); return toast('Copied. Paste into the firm\'s Word pleading template.'); }
  }catch(e){}
  try{ await navigator.clipboard.writeText(text); return toast('Copied as plain text.'); }catch(e){}
  try{ const sel = getSelection(); const r = document.createRange(); r.selectNodeContents(node); sel.removeAllRanges(); sel.addRange(r); }catch(e){}
  toast('Copying was blocked here. The document is selected; press Ctrl+C.');
}

function splitQuestions(raw){
  const lines = raw.replace(/\r/g, '').split('\n');
  const out = []; let curQ = null;
  const re = /^\s*(?:supplemental\s+(?:interrogatory|question)\s*)?(?:no\.?\s*)?(\d{1,2})\s*[.):]\s+(.*)$/i;
  lines.forEach(line => {
    const m = re.exec(line);
    if(m){ if(curQ != null) out.push(curQ); curQ = m[2]; }
    else if(curQ != null){ curQ += line.trim() ? ' ' + line.trim() : ''; }
  });
  if(curQ != null) out.push(curQ);
  if(!out.length && raw.trim()) out.push(raw.trim());
  return out.map(s => s.replace(/\s+/g, ' ').trim()).filter(Boolean);
}

/* client questionnaire */
function questDoc(){
  const isAuto = cur.caption?.caseType === 'auto', pre = state.qMode === 'prefill', F = CTX.firm;
  const allFields = Object.values(SCHEMA).flat().flatMap(g => g.fields);
  const valOf = k => {
    const v = getPath(cur, k);
    const meta = allFields.find(f => f.k === k);
    if(Array.isArray(v)) return v.map(it => Object.values(it).filter(x => typeof x === 'string' && x).join(', ')).filter(Boolean).join('\n');
    if(v === 'yes') return 'Yes'; if(v === 'no') return 'No';
    if(meta?.t === 'date' && v) return fDate(v);
    if(meta?.t === 'money' && v) return fMoney(v);
    if(meta?.o && v){ const o = meta.o.find(x => Array.isArray(x) && x[0] === v); if(o) return o[1]; }
    return v || '';
  };
  const line = '<div style="margin:0 0 2pt 0.4in;border-bottom:1px solid #777;height:20pt"></div>';
  let n = 0;
  let h = `<div style="${DOC_FONT}"><p style="text-align:center;font-weight:bold;margin:0 0 4pt;font-size:13pt">CLIENT INFORMATION QUESTIONNAIRE</p><p style="text-align:center;margin:0 0 14pt">${esc(F.name)}, ${esc(F.phone)}</p>`;
  h += `<p style="margin:0 0 6pt">Re: ${esc(matterTitle(cur))}${cur.caption?.docket ? `, Docket No. ${esc(cur.caption.docket)}` : ''}</p>`;
  h += `<p style="margin:0 0 14pt;line-height:1.5">${pre ? 'We filled in what we already know. Please read each answer, correct anything that is wrong, and fill in anything left blank.' : 'The court requires written answers to a standard set of questions in your case, called interrogatories. Please answer as completely as you can.'} If you do not know an answer, write "I don't know." Call our office with any questions.</p>`;
  SCHEMA.client.forEach(g => {
    if(g.auto && !isAuto) return;
    const asks = g.fields.filter(f => f.ask && (!f.auto || isAuto));
    if(!asks.length) return;
    h += `<p style="margin:16pt 0 6pt;font-weight:bold">${esc(g.title.replace("in the client's words", 'in your words').replace('Background the defense often asks about', 'Background'))}</p>`;
    asks.forEach(f => {
      n++;
      h += `<p style="margin:8pt 0 4pt"><b>${n}.</b> ${esc(f.ask)}</p>`;
      if(pre){
        const vals = [f.k, ...(f.askWith || [])].map(valOf).filter(Boolean).join('\n');
        h += vals ? `<p style="margin:0 0 4pt 0.4in;padding:3pt 8pt;border-left:2px solid #000;line-height:1.45">${esc(vals).replace(/\n/g, '<br>')}</p><p style="margin:0 0 4pt 0.4in;font-size:10.5pt">Correct? ____ Yes ____ No. Changes: ________________________________</p>` : line + line;
      } else {
        const k = f.t === 'area' || f.t === 'list' || (f.askWith || []).length ? 4 : 1;
        for(let i = 0; i < k; i++) h += line;
      }
    });
  });
  return h + `<p style="margin:22pt 0 0">Signature: ______________________________ &nbsp;&nbsp; Date: ______________</p></div>`;
}
function viewQuestionnaire(){
  return head('Client questionnaire', 'Plain-language questions built from the Client screen. Send it blank, or filled in so the client only confirms or corrects. Staff then type the answers into the Client screen.', 4)
  + `<div class="print-root"><div class="docbar"><div class="row"><label for="qmode-sel"><b>Version</b></label><select id="qmode-sel" style="width:auto"><option value="blank"${state.qMode === 'blank' ? ' selected' : ''}>Blank</option><option value="prefill"${state.qMode === 'prefill' ? ' selected' : ''}>Filled in for the client to confirm</option></select></div>

/* motion papers */
function motionData(def){
  cur.motions = cur.motions || {};
  const stored = cur.motions[def.id] || {};
  const d = def.defaults(cur);
  const m = {...stored};
  Object.keys(d).forEach(k => { if(!(k in stored)) m[k] = d[k]; });
  return m;
}
function motionCalc(def, m){
  const c = {};
  if(def.id === 'mov4235' && m.defAnswerServed) c.formCDue = addDays(m.defAnswerServed, 60);
  if(def.id === 'movExt' && m.discoveryEnd) c.newEnd = addDays(m.discoveryEnd, num(m.days) || 60);
  if(def.id === 'opp4235') c.pn = m.withdrawRequest ? 5 : 4;
  if(def.id === 'oppSJ'){ const k = Math.min(80, Math.max(1, num(m.paraCount) || 1)); c.rsmf = Array.from({length: k}, (_, i) => i + 1); }
  return c;
}
function motionCtx(def){
  const m = motionData(def);
  def.fields.forEach(f => { FIELD_INDEX['m.' + f.k] = {l: f.l, step: 'motions', t: f.t || 'text'}; });
  return {...CTX, m, calc: {...CTX.calc, ...motionCalc(def, m)}};
}
function motionDoc(def, doc, mctx){
  const r = renderTpl(doc.tpl, mctx);
  return {html: `<div style="${DOC_FONT}">` + captionHTML(cur, mctx.firm, doc.heading) + bodyHTML(r.text) + sigHTML(doc.sig, mctx.m, mctx.firm) + '</div>', text: r.text, missing: r.missing};
}
function motionDeadlinesHTML(def, mctx){
  const m = mctx.m, rd = m.returnDate, rows = [], warns = [];
  if(!rd) return '<p class="muted" style="margin:0">Enter the return date to calculate the filing deadlines.</p>';
  const row = (label, sub, d) => {
    const left = daysUntil(d);
    const rel = left < 0 ? '<span class="red-text">Passed</span>' : left === 0 ? '<span class="red-text">Today</span>' : left <= 3 ? `<span class="amber-text">In ${left} day${left === 1 ? '' : 's'}</span>` : `In ${left} days`;
    return `<tr><th>${label}<small>${sub}${isWeekend(d) ? '. Falls on a weekend; file the business day before.' : ''}</small></th><td class="num">${fDay(d)}<small>${rel}</small></td></tr>`;
  };
  rows.push(`<tr><th>Return date</th><td class="num">${fDay(rd)}</td></tr>`);
  if(def.ours){
    rows.push(row('File and serve the motion', `${def.fileDays} days before, ${def.fileRule}`, addDays(rd, -def.fileDays)));
    rows.push(row('Opposition due from defense', `${def.oppDays} days before`, addDays(rd, -def.oppDays)));
    rows.push(row('Reply papers', '4 days before, R. 1:6-3(a)', addDays(rd, -4)));
  } else {
    rows.push(row('Opposition due', `${def.oppDays} days before, ${def.oppRule}`, addDays(rd, -def.oppDays)));
    rows.push(row('Movant reply due', '4 days before', addDays(rd, -4)));
  }
  if(def.id === 'mov4235'){
    if(mctx.calc.formCDue && daysUntil(mctx.calc.formCDue) > 0) warns.push(`Defendant's Form C answers are not overdue until ${fDate(mctx.calc.formCDue)}. A motion filed earlier is premature.`);
    if(!cur.served?.date) warns.push("Plaintiff's own Form A answers are not marked served. R. 4:23-5(a)(3) requires certifying that plaintiff is not in default.");
  }
  if(def.id === 'movExt' && m.discoveryEnd && rd > m.discoveryEnd) warns.push('The return date falls after the current discovery end date. Under R. 4:24-1(c) the motion should be returnable before discovery closes; check the rule and the return date.');
  if(def.id === 'opp4235' && !m.answersServed) warns.push('This opposition depends on serving the Form A answers first. Record the service date on the Finish screen or in the details.');
  return `<table class="tbl"><tbody>${rows.join('')}</tbody></table>${warns.map(w => `<div class="callout amber" style="margin:10px 0 0">${esc(w)}</div>`).join('')}<p class="note" style="margin-top:8px">Calendar days counted back from the return date. Confirm against the court's motion calendar.</p>`;
}
function motionLive(def){
  const mctx = motionCtx(def);
  const doc = def.docs[Math.min(state.motionDoc, def.docs.length - 1)];
  const out = motionDoc(def, doc, mctx);
  return {dead: motionDeadlinesHTML(def, mctx), paper: out.html, missing: out.missing, doc};
}
function missNote(missing){
  if(!missing.length) return '';
  return `<div class="callout red"><b>${missing.length} detail${missing.length === 1 ? '' : 's'} missing:</b> ${missing.map(mi => `${esc(mi.label)} <button class="btn sm" data-act="jump" data-path="${esc(mi.path)}">Fill in</button>`).join(' ')}</div>`;
}

  <div class="print-root"><div class="docbar"><div class="tabs" role="tablist">${def.docs.map((d, i) => `<button class="tab${i === di ? ' on' : ''}" role="tab" aria-selected="${i === di}" data-act="mdoc" data-i="${i}">${esc(d.title)}</button>`).join('')}</div>
    <div class="row"><button class="btn pri" data-act="copy-motion">Copy for Word</button>${LOCAL ? '<button class="btn" data-act="dl-motion">Download Word file</button><button class="btn" data-act="print">Print</button>' : ''}</div></div>
    <div id="mo-miss">${missNote(live.missing)}</div>
    <div class="paper-wrap"><div class="paper" id="motion-paper">${live.paper}</div></div></div>
  <section class="card" style="margin-top:16px"><header><h3>Starter clauses</h3><p class="note">Standard passages used in these papers. The attorney confirms every citation before filing.</p></header><div class="gbody">
    <ul class="clauses">${MCLAUSES.map(c => `<li><b>${esc(c.t)}</b> <span class="muted small">${esc(c.cite)}</span><p>${esc(c.x)}</p><button class="btn sm" data-act="copy-clause" data-id="${c.id}">Copy</button></li>`).join('')}</ul></div></section>`;
}
let liveTimer = null;
function refreshMotionLive(){

}

    $('#topbar').innerHTML = topHTML();
    $('#rail').innerHTML = railHTML();
    if(INTAKE.includes(state.view)) updateNeed();
    if(state.view === 'review'){
      const st = $('#rv-stats'); if(st) st.innerHTML = statsHTML();
      const a = A.find(x => x.q.n === state.q), p = $('#qpill');
      if(p && a) p.innerHTML = stHTML(a.status);
      const ib = $('#ix-body'); if(ib) ib.innerHTML = indexRows(state.q);
    }
    if(state.view === 'supplemental'){
      SUPP.forEach(s => {
        const st = $('#ss-' + s.i); if(st) st.innerHTML = stHTML(s.status);
        const so = $('#so2-' + s.i); if(so) so.innerHTML = signoffHTML(s.paraOK, s.attyOK, s.nMiss > 0, `data-supp="${s.i}"`);
        if(state.sxDirty.has(s.i)){ const sx = $('#sx-' + s.i); if(sx) sx.innerHTML = suppFlagsHTML(s); }
      });
      state.sxDirty.clear();
    }
  }, 160);
}
function go(view, opts = {}){
  state.view = view; state.editing = false;
  if(opts.q) state.q = opts.q;
  if(state.returnTo && view === state.returnTo.view && !opts.fromBack) state.returnTo = null;
  render();
  if(!opts.keepScroll) window.scrollTo({top: 0});
}
function jumpTo(path){
  if(path.startsWith('m.')){
    const el = document.getElementById(fid(path)); if(el){ el.scrollIntoView({block: 'center'}); el.focus({preventScroll: true}); flash(el.closest('.f') || el); }
    return;
  }
  const meta = FIELD_INDEX[norm(path)] || {};
  const step = meta.step || 'matter';
  if(step !== state.view){ state.view = step; state.editing = false; render(); }
  requestAnimationFrame(() => {
    let el = document.getElementById(fid(path)) || document.getElementById('add-' + fid(path));
    if(!el){ const m = /^(.*)\.\d+\.[^.]+$/.exec(path); if(m) el = document.getElementById('add-' + fid(m[1])); }
    if(el){
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      el.scrollIntoView({block: 'center', behavior: reduce ? 'auto' : 'smooth'});
      el.focus({preventScroll: true});
      flash(el.closest('.f') || el);
    }
  });
}
function flash(el){ el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
function ensureAns(n){ cur.answers = cur.answers || {}; return cur.answers[n] = cur.answers[n] || {}; }
function curAnswer(){ return A.find(a => a.q.n === state.q); }
function suppItem(i){ cur.supp = cur.supp || {items: []}; return cur.supp.items[i]; }
function suppInsert(i, text, missing, atStart){
  const it = suppItem(i); if(!it) return;
  const a = (it.a || '').trim();
  it.a = atStart ? text + (a ? '\n\n' + a : '') : (a ? a + '\n\n' : '') + text;
  it.miss = it.miss || [];
  (missing || []).forEach(mi => { if(!it.miss.some(x => x.label === mi.label)) it.miss.push(mi); });
}
function keepScrollRender(){ const y = scrollY; render(); window.scrollTo({top: y}); }
function advanceAfterSignoff(){
  compute();
  const {next} = navTargets();
  if(next){ state.q = next.q.n; state.editing = false; }
}

/* ======================================================================
   ACTIONS
   ====================================================================== */
const ACT = {
  go: b => go(b.dataset.view),
  'go-filter': b => { state.filter = b.dataset.f; compute(); const first = A.find(inFilter); go('review', {q: first ? first.q.n : state.q}); },
  q: b => { state.q = +b.dataset.q; state.editing = false; render(); if(innerWidth < 1100) $('#qcard')?.scrollIntoView({block: 'start'}); },
  prev: () => { const {prev} = navTargets(); if(prev){ state.q = prev.q.n; state.editing = false; render(); } },
  next: () => { const {next} = navTargets(); if(next){ state.q = next.q.n; state.editing = false; render(); } },
  edit: () => {
    const a = curAnswer(); if(!a) return;
    state.editing = !state.editing; state.editBase = a.auto.text; render();
    if(state.editing){ const t = $('#ans-edit'); if(t){ t.focus(); t.setSelectionRange(t.value.length, t.value.length); } }
  },
  revert: () => { const s = ensureAns(state.q); delete s.text; delete s.base; state.editing = false; saveMatter(); render(); toast('Returned to the automatic draft.'); },
  keep: () => { const a = curAnswer(); const s = ensureAns(state.q); s.base = a.auto.text; saveMatter(); render(); },
  para: b => {
    const on = b.dataset.v === '1';
    if(b.dataset.supp != null && b.dataset.supp !== ''){ const it = suppItem(+b.dataset.supp); it.paraOK = on; it.paraText = it.a || ''; if(!on) it.reviewed = false; saveMatter(); keepScrollRender(); if(on) toast(`Supplemental No. ${+b.dataset.supp + 1} checked.`); return; }
    const a = curAnswer(); if(!a) return;
    const s = ensureAns(a.q.n); s.paraOK = on; s.paraText = a.final; if(!on) s.reviewed = false; saveMatter();
    if(on){ toast(`No. ${a.q.n} checked.`); advanceAfterSignoff(); }
    render();
  },
  atty: b => {
    const on = b.dataset.v === '1';
    if(b.dataset.supp != null && b.dataset.supp !== ''){ const it = suppItem(+b.dataset.supp); it.reviewed = on; it.reviewedText = it.a || ''; saveMatter(); keepScrollRender(); if(on) toast(`Supplemental No. ${+b.dataset.supp + 1} approved.`); return; }
    const a = curAnswer(); if(!a) return;
    const s = ensureAns(a.q.n); s.reviewed = on; s.reviewedText = a.final; saveMatter();
    if(on){ toast(`No. ${a.q.n} approved.`); advanceAfterSignoff(); }
    render();
  },
  filter: b => {
    state.filter = b.dataset.f; compute();
    const a = curAnswer(); if(a && !inFilter(a)){ const f = A.find(inFilter); if(f) state.q = f.q.n; }
    state.editing = false; render();
  },
  jump: b => {
    if(state.view === 'review') state.returnTo = {view: 'review', q: state.q, note: `Filling in for Interrogatory No. ${state.q}`, label: `Back to No. ${state.q}`};
    else if(state.view === 'supplemental'){ const n = +b.dataset.i + 1; state.returnTo = {view: 'supplemental', anchor: 'supp-' + b.dataset.i, note: `Filling in for Supplemental No. ${n}`, label: 'Back to supplemental questions'}; }
    jumpTo(b.dataset.path);
  },
  back: () => {
    const r = state.returnTo; if(!r) return; state.returnTo = null;
    go(r.view, {q: r.q, fromBack: true, keepScroll: !!r.anchor});
    if(r.anchor){ const el = document.getElementById(r.anchor); if(el) el.scrollIntoView({block: 'start'}); }
  },
  add: b => {
    const arr = getPath(cur, b.dataset.path) || []; arr.push({}); setPath(cur, b.dataset.path, arr); saveMatter(); keepScrollRender();
    const first = Object.values(SCHEMA).flat().flatMap(g => g.fields).find(f => f.k === b.dataset.path)?.fields[0].k || 'name';
    const el = document.getElementById(fid(`${b.dataset.path}.${arr.length - 1}.${first}`));
    if(el){ el.focus(); el.scrollIntoView({block: 'center'}); }
  },
  rm: b => armThen(b, () => { const arr = getPath(cur, b.dataset.path) || []; arr.splice(+b.dataset.i, 1); saveMatter(); keepScrollRender(); }),
  'supp-split': () => {
    const raw = $('#supp-paste')?.value || ''; const qs = splitQuestions(raw);
    if(!qs.length){ toast('Paste the questions first.'); return; }
    cur.supp = cur.supp || {items: []}; qs.forEach(q => cur.supp.items.push({q, a: ''})); saveMatter(); keepScrollRender();
    toast(`Added ${qs.length} question${qs.length === 1 ? '' : 's'}.`);
  },
  'supp-add': () => { cur.supp = cur.supp || {items: []}; cur.supp.items.push({q: '', a: ''}); saveMatter(); keepScrollRender(); const el = $(`#sq-${cur.supp.items.length - 1}`); if(el){ el.focus(); el.scrollIntoView({block: 'center'}); } },
  'supp-use': b => { const e = lib().supp[+b.dataset.k]; if(!e) return; const r = renderTpl(e.tpl, CTX); suppInsert(+b.dataset.i, r.text, r.missing, false); saveMatter(); keepScrollRender(); toast(`Inserted: ${e.t}`); },
  'supp-obj': b => { const c = lib().clauses.find(x => x.id === b.dataset.o) || CLAUSES_DEFAULT.find(x => x.id === b.dataset.o); if(!c) return; suppInsert(+b.dataset.i, c.x, [], true); saveMatter(); keepScrollRender(); toast(`Inserted objection: ${c.t}`); },
  'supp-rm': b => armThen(b, () => { cur.supp.items.splice(+b.dataset.i, 1); saveMatter(); keepScrollRender(); }),
  'new-matter': () => { saveMatter(true); cur = blankMatter(); saveMatter(true); state.q = 1; state.returnTo = null; go('matter'); toast('New matter started.'); },
  sample: () => { saveMatter(true); cur = exampleMatter(); compute(); seedExample(); saveMatter(true); go('review', {q: 1}); toast('Fill-in-the-blank example loaded.'); },
  'open-matter': b => { saveMatter(true); const m = store.get('m.' + b.dataset.id); if(m){ cur = m; store.set('current', m.id); state.returnTo = null; go('matter'); } else toast('That matter could not be found on this computer.'); },
  'export-matter': () => download(`${fileBase()}.json`, JSON.stringify(cur, null, 2), 'application/json'),
  'import-matter': () => $('#import-matter')?.click(),
  'del-matter': b => armThen(b, () => {
    store.del('m.' + cur.id);
    const idx = (store.get('index') || []).filter(x => x.id !== cur.id); store.set('index', idx);
    const nextM = idx.length ? store.get('m.' + idx[0].id) : null;
    cur = nextM || blankMatter(); saveMatter(true); go('matter'); toast('Matter deleted from this computer.');
  }, 'Confirm delete'),
  'copy-answers': () => copyDoc(answersDocHTML(), answersText(), $('#doc-paper')),
  'dl-answers': () => download(`${fileBase()} Interrogatory Answers.doc`, wordFile(answersDocHTML(), 'Interrogatory Answers'), 'application/msword'),
  print: () => window.print(),
  'copy-quest': () => copyDoc(questDoc(), $('#quest-paper')?.innerText || '', $('#quest-paper')),
  'dl-quest': () => download(`${fileBase()} Client Questionnaire.doc`, wordFile(questDoc(), 'Client Questionnaire'), 'application/msword'),
  motion: b => { state.motion = b.dataset.id; state.motionDoc = 0; keepScrollRender(); },
  mdoc: b => { state.motionDoc = +b.dataset.i; keepScrollRender(); },
  'copy-motion': () => { const def = MOTIONS.find(x => x.id === state.motion); const live = motionLive(def); copyDoc(live.paper, $('#motion-paper')?.innerText || '', $('#motion-paper')); },
  'dl-motion': () => { const def = MOTIONS.find(x => x.id === state.motion); const live = motionLive(def); download(`${fileBase()} ${live.doc.title}.doc`, wordFile(live.paper, live.doc.title), 'application/msword'); },
  'copy-clause': async b => { const c = MCLAUSES.find(x => x.id === b.dataset.id); try{ await navigator.clipboard.writeText(c.x); toast('Clause copied.'); }catch(e){ toast('Copying was blocked here. Select the text and press Ctrl+C.'); } },
  'lib-restore': b => { libSave(o => { if(o.qs) delete o.qs[b.dataset.n]; }); keepScrollRender(); toast(`No. ${b.dataset.n} restored.`); },
  'lib-export': () => download('drafter-library.json', JSON.stringify(store.get('lib') || {}, null, 2), 'application/json'),
  'lib-import': () => $('#lib-file')?.click(),
  'slib-add': () => { libSave(o => { o.supp = (o.supp || SUPP_DEFAULT.map(e => ({...e}))); o.supp.push({t: 'New standard answer', k: [], tpl: ''}); }); keepScrollRender(); },
  'slib-rm': b => armThen(b, () => { libSave(o => { o.supp = (o.supp || SUPP_DEFAULT.map(e => ({...e}))); o.supp.splice(+b.dataset.i, 1); }); keepScrollRender(); }),
  'clause-add': () => { libSave(o => { o.clauses = (o.clauses || CLAUSES_DEFAULT.map(c => ({...c}))); o.clauses.push({c: 'answer', t: 'New standard language', x: ''}); }); keepScrollRender(); },
  'clause-rm': b => armThen(b, () => { libSave(o => { o.clauses = (o.clauses || CLAUSES_DEFAULT.map(c => ({...c}))); o.clauses.splice(+b.dataset.i, 1); }); keepScrollRender(); }),
  'firm-reset': b => armThen(b, () => { store.del('firm'); render(); toast('Firm settings restored.'); }, 'Confirm restore')
};
function armThen(b, fn, label){
  if(b.dataset.armed === '1'){ fn(); return; }
  const orig = b.textContent; b.dataset.armed = '1'; b.classList.add('armed'); b.textContent = label || 'Confirm remove';
  setTimeout(() => { if(b.isConnected){ b.dataset.armed = ''; b.classList.remove('armed'); b.textContent = orig; } }, 3500);
}
/* Sign-offs on the example, so each status color appears once it opens:
   a few answers approved (green), a few checked (blue), one changed after sign-off (amber).
   Anything still marked missing stays red; the rest wait for the paralegal (grey). */
function seedExample(){
  const ready = A.filter(a => a.status !== 'missing');
  ready.forEach((a, k) => {
    const s = ensureAns(a.q.n);
    if(k < 4){ s.paraOK = true; s.paraText = a.final; s.reviewed = true; s.reviewedText = a.final; }
    else if(k < 8){ s.paraOK = true; s.paraText = a.final; }
    else if(k === 8){ s.paraOK = true; s.paraText = a.final + ' (wording before a later change)'; }
  });
  SUPP.forEach(s => { if(s.i === 3 || s.i === 5) return; const g = s.sugg[0]; if(!g) return; const r = renderTpl(lib().supp[g.k].tpl, CTX); suppInsert(s.i, r.text, r.missing, false); });
  const first = suppItem(0); if(first){ first.paraOK = true; first.paraText = first.a; first.reviewed = true; first.reviewedText = first.a; }
  const second = suppItem(1); if(second){ second.paraOK = true; second.paraText = second.a; }
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if(!b || b.tagName === 'SELECT' || b.tagName === 'TBODY') return;
  const fn = ACT[b.dataset.act]; if(fn) fn(b, e);
});

main.addEventListener('input', e => {
  const t = e.target;
  if(t.dataset.path && t.type !== 'radio' && t.type !== 'checkbox' && t.tagName !== 'SELECT'){
    setPath(cur, t.dataset.path, t.value); saveMatter();
    if(state.view === 'finish') return;
    refreshChrome();
  } else if(t.dataset.ans){
    const s = ensureAns(+t.dataset.ans);
    if(typeof s.text !== 'string') s.base = state.editBase;
    s.text = t.value; saveMatter(); refreshChrome();
  } else if(t.dataset.note){
    ensureAns(+t.dataset.note).note = t.value; saveMatter();
  } else if(t.dataset.sq != null && t.dataset.sq !== ''){
    const it = suppItem(+t.dataset.sq); if(it){ it.q = t.value; state.sxDirty.add(+t.dataset.sq); saveMatter(); refreshChrome(); }
  } else if(t.dataset.sa != null && t.dataset.sa !== ''){
    const it = suppItem(+t.dataset.sa); if(it){ it.a = t.value; saveMatter(); refreshChrome(); }
  } else if(t.dataset.mpath && t.type !== 'radio' && t.tagName !== 'SELECT'){
    cur.motions = cur.motions || {}; const id = state.motion;
    cur.motions[id] = cur.motions[id] || {};
    cur.motions[id][t.dataset.mpath.slice(2)] = t.value; saveMatter(); refreshMotionLive();
  } else if(t.dataset.firm && t.tagName !== 'SELECT'){
    const o = store.get('firm') || {}; o[t.dataset.firm] = t.value; store.set('firm', o); refreshChrome();
  } else if(t.dataset.libq){
    const n = t.dataset.libq, f = t.dataset.libf;
    libSave(o => { o.qs = o.qs || {}; o.qs[n] = {...(o.qs[n] || {}), [f]: t.value}; });
    if(f === 'tpl'){ const p = $('#lp-' + n); if(p){ compute(); p.innerHTML = hl(renderTpl(t.value, CTX).text); } }
  } else if(t.dataset.slib != null && t.dataset.slib !== ''){
    const k = +t.dataset.slib, f = t.dataset.sf;
    const val = f === 'k' ? t.value.split(',').map(s => s.trim()).filter(Boolean) : t.value;
    libSave(o => { o.supp = (o.supp || SUPP_DEFAULT.map(e => ({...e}))); o.supp[k] = {...o.supp[k], [f]: val}; });
  } else if(t.dataset.clause != null && t.dataset.clause !== '' && t.tagName !== 'SELECT'){
    const i = +t.dataset.clause, f = t.dataset.cf;
    libSave(o => { o.clauses = (o.clauses || CLAUSES_DEFAULT.map(c => ({...c}))); o.clauses[i] = {...o.clauses[i], [f]: t.value}; });
  }
});
main.addEventListener('change', e => {
  const t = e.target;
  if(t.id === 'clause-pick'){
    const c = lib().clauses[+t.value]; if(!c) return;
    const a = curAnswer(); const s = ensureAns(a.q.n);
    if(typeof s.text !== 'string'){ s.base = a.auto.text; s.text = a.final; }
    s.text = c.c === 'objection' ? c.x + (s.text.trim() ? '\n\n' + s.text : '') : s.text.replace(/\s+$/, '') + (s.text.trim() ? '\n\n' : '') + c.x;
    state.editing = true; saveMatter(); keepScrollRender(); toast(`Inserted: ${c.t}`);
    return;
  }
  if(t.id === 'rv-filter'){
    state.filter = t.value; compute();
    const a = curAnswer(); if(a && !inFilter(a)){ const f = A.find(inFilter); if(f) state.q = f.q.n; }
    state.editing = false; render(); return;
  }
  if(t.id === 'qmode-sel'){ state.qMode = t.value; keepScrollRender(); return; }
  if(t.dataset.suppPick != null && t.dataset.suppPick !== ''){
    const e2 = lib().supp[+t.value]; if(!e2) return;
    const r = renderTpl(e2.tpl, CTX); suppInsert(+t.dataset.suppPick, r.text, r.missing, false); saveMatter(); keepScrollRender(); toast(`Inserted: ${e2.t}`); return;
  }
  if(t.dataset.suppObj != null && t.dataset.suppObj !== ''){
    const c = lib().clauses[+t.value]; if(!c) return;
    suppInsert(+t.dataset.suppObj, c.x, [], true); saveMatter(); keepScrollRender(); toast(`Inserted objection: ${c.t}`); return;
  }
  if(t.id === 'import-matter' || t.id === 'lib-file'){
    const file = t.files && t.files[0]; if(!file) return;
    const rd = new FileReader();
    rd.onload = () => {
      try{
        const data = JSON.parse(String(rd.result).replace(/^﻿/, ''));
        if(t.id === 'import-matter'){
          if(!data || typeof data !== 'object' || !data.caption) throw new Error('not a matter');
          saveMatter(true); data.id = data.id || uid(); cur = data; saveMatter(true); go('matter'); toast(`Opened ${matterTitle(cur)}.`);
        } else {
          if(!data || typeof data !== 'object') throw new Error('not a library');
          store.set('lib', data); LIB = null; render(); toast('Library loaded.');
        }
      }catch(err){ toast(t.id === 'import-matter' ? 'That file is not a matter file from this tool.' : 'That file is not a library file from this tool.'); }
    };
    rd.readAsText(file);
    t.value = '';
    return;
  }
  if(t.dataset.check){
    cur.checklist = cur.checklist || {}; cur.checklist[t.dataset.check] = t.checked; saveMatter(); keepScrollRender(); return;
  }
  if(t.dataset.pk != null && t.dataset.pk !== ''){
    cur.motions = cur.motions || {}; const id = state.motion;
    cur.motions[id] = cur.motions[id] || {}; cur.motions[id].packet = cur.motions[id].packet || {};
    cur.motions[id].packet[t.dataset.pk] = t.checked; saveMatter(); return;
  }
  if(t.dataset.path){
    setPath(cur, t.dataset.path, t.value); saveMatter();
    const structural = t.tagName === 'SELECT' || t.type === 'radio' || state.view === 'finish';
    if(structural) keepScrollRender();
    else { compute(); updateNeed(); refreshChrome(); }
    return;
  }
  if(t.dataset.mpath && (t.type === 'radio' || t.tagName === 'SELECT')){
    cur.motions = cur.motions || {}; const id = state.motion;
    cur.motions[id] = cur.motions[id] || {};
    cur.motions[id][t.dataset.mpath.slice(2)] = t.value; saveMatter(); refreshMotionLive(); return;
  }
  if(t.dataset.firm && t.tagName === 'SELECT'){
    const o = store.get('firm') || {}; o[t.dataset.firm] = t.value; store.set('firm', o); refreshChrome(); toast('Saved.'); return;
  }
  if(t.dataset.clause != null && t.dataset.clause !== '' && t.tagName === 'SELECT'){
    const i = +t.dataset.clause; libSave(o => { o.clauses = (o.clauses || CLAUSES_DEFAULT.map(c => ({...c}))); o.clauses[i] = {...o.clauses[i], c: t.value}; }); keepScrollRender(); return;
  }
  if(t.dataset.libq || (t.dataset.slib != null && t.dataset.slib !== '') || (t.dataset.clause != null && t.dataset.clause !== '') || t.dataset.ans || t.dataset.sa || t.dataset.sq) refreshChrome();
});

/* ======================================================================
   START
   ====================================================================== */
function init(){
  const cid = store.get('current');
  cur = cid ? store.get('m.' + cid) : null;
  if(!cur){ cur = exampleMatter(); compute(); seedExample(); saveMatter(true); }
  cur.supp = cur.supp || {items: []};
  render();
}
init();
})();
</script>

<script type="application/json" id="program">{"dates.py": "\"\"\"Date and money formatting, and the deadline arithmetic.\n\nDates are stored the way the browser's date picker sends them: YYYY-MM-DD.\nDeadlines are counted in calendar days. Court holidays are not handled yet,\nonly weekends.\n\"\"\"\n\nfrom datetime import date, datetime, timedelta\n\nMONTHS = [\"January\", \"February\", \"March\", \"April\", \"May\", \"June\", \"July\",\n          \"August\", \"September\", \"October\", \"November\", \"December\"]\nWEEKDAYS = [\"Monday\", \"Tuesday\", \"Wednesday\", \"Thursday\", \"Friday\", \"Saturday\", \"Sunday\"]\n\n\ndef parse(value):\n    if not value:\n        return None\n    try:\n        return datetime.strptime(value, \"%Y-%m-%d\").date()\n    except (TypeError, ValueError):\n        return None\n\n\ndef long_date(value):\n    d = parse(value)\n    if not d:\n        return value or \"\"\n    return f\"{MONTHS[d.month - 1]} {d.day}, {d.year}\"\n\n\ndef with_weekday(value):\n    d = parse(value)\n    return f\"{WEEKDAYS[d.weekday()]}, {long_date(value)}\" if d else \"\"\n\n\ndef short_date(value):\n    d = parse(value)\n    return f\"{MONTHS[d.month - 1][:3]}. {d.day}\" if d else \"\"\n\n\ndef add_days(value, n):\n    d = parse(value)\n    return (d + timedelta(days=n)).isoformat() if d else \"\"\n\n\ndef next_business_day(value):\n    \"\"\"Rolls a Saturday or Sunday forward to Monday (R. 1:3-1).\"\"\"\n    d = parse(value)\n    if not d:\n        return \"\"\n    while d.weekday() >= 5:\n        d += timedelta(days=1)\n    return d.isoformat()\n\n\ndef is_weekend(value):\n    d = parse(value)\n    return bool(d and d.weekday() >= 5)\n\n\ndef days_until(value, today=None):\n    d = parse(value)\n    if not d:\n        return None\n    return (d - (today or date.today())).days\n\n\ndef clock(value):\n    \"\"\"'16:40' -> '4:40 p.m.'\"\"\"\n    try:\n        hour, minute = value.split(\":\")[:2]\n        hour = int(hour)\n    except (AttributeError, ValueError):\n        return value or \"\"\n    suffix = \"p.m.\" if hour >= 12 else \"a.m.\"\n    hour = hour % 12 or 12\n    return f\"{hour}:{minute} {suffix}\"\n\n\ndef to_number(value):\n    if value is None or value == \"\":\n        return None\n    if isinstance(value, (int, float)):\n        return float(value)\n    cleaned = str(value).replace(\"$\", \"\").replace(\",\", \"\").strip()\n    if not cleaned:\n        return None\n    try:\n        return float(cleaned)\n    except ValueError:\n        return None\n\n\ndef money(value):\n    n = to_number(value)\n    if n is None:\n        return str(value)\n    return f\"${n:,.2f}\"\n", "intake.py": "\"\"\"The intake screens: every fact the answers draw on.\n\nA field is a small dict:\n  k      where the value is kept in the matter file, e.g. \"police.date\"\n  l      label shown on the screen\n  t      text (default), area, date, time, select, yn, money, number or list\n  o      choices for a select: plain strings, or (value, label) pairs\n  h      hint shown under the field\n  full   True gives the field a whole row\n  auto   True means motor vehicle cases only\n  ask    plain-language version of the question for the client questionnaire\n  ask_with  other fields whose answers belong under the same question\n\nA list field (t=\"list\") holds repeating rows. It has \"item\" (what one row is\ncalled, e.g. \"Provider\") and its own \"fields\".\n\nTo add a field: add it here, then use it in an answer template in the\nForms library, e.g. {{client.newField}}.\n\"\"\"\n\nimport re\n\n\ndef field(k, label, t=\"text\", **extra):\n    f = {\"k\": k, \"l\": label, \"t\": t}\n    f.update(extra)\n    return f\n\n\nCOUNTIES = [\"Atlantic\", \"Bergen\", \"Burlington\", \"Camden\", \"Cape May\", \"Cumberland\", \"Essex\",\n            \"Gloucester\", \"Hudson\", \"Hunterdon\", \"Mercer\", \"Middlesex\", \"Monmouth\", \"Morris\",\n            \"Ocean\", \"Passaic\", \"Salem\", \"Somerset\", \"Sussex\", \"Union\", \"Warren\"]\nDIRECTIONS = [(\"north\", \"North\"), (\"south\", \"South\"), (\"east\", \"East\"), (\"west\", \"West\")]\n\nSTEPS = [\n    (\"matter\", \"Matter\", \"Caption, case type, and the dates every deadline runs from.\"),\n    (\"police\", \"Police report\", \"Facts transferred from the crash or incident report.\"),\n    (\"medical\", \"Medical records\", \"Diagnoses, providers, tests and bills from the records.\"),\n    (\"client\", \"Client\", \"Facts only the client can supply. Send the questionnaire to collect them before calling.\"),\n    (\"attorney\", \"Attorney decisions\", \"Calls the attorney makes before the answers go out.\"),\n    (\"answers\", \"Form A answers\", \"Each answer is drafted from the intake screens. The paralegal checks it, then the attorney approves it.\"),\n    (\"supplemental\", \"Supplemental questions\", \"The defense's added questions. Paste them in, use the firm's standard answers where they fit, and object where needed.\"),\n    (\"finish\", \"Finish and serve\", \"Deadlines, attachments, HIPAA authorizations, and the finished document.\"),\n]\nINTAKE_STEPS = [\"matter\", \"police\", \"medical\", \"client\", \"attorney\"]\n\nSCREENS = {\n    \"matter\": [\n        {\"title\": \"Caption\", \"note\": \"Enter the parties exactly as they appear on the Complaint.\", \"fields\": [\n            field(\"caption.plaintiff\", \"Plaintiff\", full=True),\n            field(\"caption.defendants\", \"Defendants\", \"area\", full=True,\n                  h=\"One per line, as captioned. Include fictitious parties if they are named.\"),\n            field(\"caption.county\", \"Venue county\", \"select\", o=COUNTIES),\n            field(\"caption.docket\", \"Docket number\", h=\"Example: MID-L-004812-26\"),\n            field(\"caption.caseType\", \"Case type\", \"select\",\n                  o=[(\"auto\", \"Motor vehicle accident\"), (\"other\", \"Other personal injury\")],\n                  h=\"Motor vehicle cases also answer Questions 25 to 37.\"),\n        ]},\n        {\"title\": \"Key dates\", \"note\": \"Deadlines are calculated from these dates.\", \"fields\": [\n            field(\"caption.answerServed\", \"Date defendant's Answer was served\", \"date\",\n                  h=\"Form A is deemed served on plaintiff that day. R. 4:17-1(b)(2).\"),\n            field(\"caption.discoveryEnd\", \"Discovery end date\", \"date\",\n                  h=\"Optional. Sets the cutoff for amended answers under R. 4:17-7.\"),\n        ]},\n    ],\n\n    \"police\": [\n        {\"title\": \"Report\", \"note\": \"Copy these from the NJTR-1 crash report, or from the incident report in a non-vehicle case.\", \"fields\": [\n            field(\"police.reportNo\", \"Report number\"),\n            field(\"police.agency\", \"Police department\"),\n            field(\"police.officer\", \"Investigating officer\", h=\"Name and badge number\"),\n            field(\"police.date\", \"Accident date\", \"date\"),\n            field(\"police.time\", \"Time\", \"time\"),\n            field(\"police.municipality\", \"Municipality\"),\n            field(\"police.location\", \"Location\", full=True, h=\"Road and nearest cross street\"),\n        ]},\n        {\"title\": \"Conditions\", \"fields\": [\n            field(\"police.weather\", \"Weather\", \"select\", o=[\"Clear\", \"Cloudy\", \"Rain\", \"Snow\", \"Fog\", \"Sleet or hail\"]),\n            field(\"police.light\", \"Light\", \"select\",\n                  o=[\"Daylight\", \"Dawn\", \"Dusk\", \"Dark, street lights on\", \"Dark, no street lights\"]),\n            field(\"police.surface\", \"Road surface\", \"select\", o=[\"Dry\", \"Wet\", \"Snowy\", \"Icy\", \"Slush\"]),\n        ]},\n        {\"title\": \"Vehicles and movement\", \"auto\": True, \"fields\": [\n            field(\"police.plaintiffVehicle\", \"Plaintiff's vehicle\", h=\"Year, make and model\"),\n            field(\"police.defendantVehicle\", \"Defendant's vehicle\"),\n            field(\"police.plaintiffRoad\", \"Road plaintiff was on\", h=\"Name the kind of road: Route 35, a state highway\"),\n            field(\"police.plaintiffDirection\", \"Direction of travel\", \"select\", o=DIRECTIONS),\n            field(\"police.intersection\", \"Intersection\", \"select\",\n                  o=[(\"none\", \"Not at an intersection\"), (\"controlled\", \"Controlled intersection\"),\n                     (\"uncontrolled\", \"Uncontrolled intersection\")]),\n            field(\"police.trafficControls\", \"Traffic controls\", \"area\", full=True,\n                  h=\"Signals, signs or officers, and where each was\"),\n            field(\"police.pointOfImpact\", \"Point of impact\", \"area\", full=True),\n            field(\"police.contactPoints\", \"Parts of the vehicles that made contact\", \"area\", full=True),\n            field(\"police.restPositions\", \"Where each vehicle came to rest\", \"area\", full=True,\n                  h=\"Include distances in feet if the report gives them\"),\n        ]},\n        {\"title\": \"Charges and witnesses\", \"fields\": [\n            field(\"police.defendantSummons\", \"Summons issued to defendant\", full=True,\n                  h=\"Statute and description, for example N.J.S.A. 39:4-97 (careless driving). Leave blank if none.\"),\n            field(\"police.plaintiffCharged\", \"Was plaintiff charged?\", \"yn\", auto=True),\n            field(\"police.plaintiffChargeDetails\", \"Charge, plea and disposition\", full=True,\n                  h=\"Only if plaintiff was charged\"),\n            field(\"police.witnesses\", \"Witnesses listed in the report\", \"list\", item=\"Witness\", fields=[\n                field(\"name\", \"Name\"),\n                field(\"address\", \"Address\"),\n                field(\"relationship\", \"Relationship to plaintiff\", h=\"Usually none\"),\n            ]),\n        ]},\n    ],\n\n    \"medical\": [\n        {\"title\": \"Diagnoses\", \"note\": \"Use the diagnoses as the records state them.\", \"fields\": [\n            field(\"medical.injuries\", \"Injuries diagnosed\", \"area\", full=True),\n            field(\"medical.permanent\", \"Injuries claimed to be permanent\", \"area\", full=True,\n                  h=\"From the treating physician's records or certification of permanency\"),\n        ]},\n        {\"title\": \"Treating providers\",\n         \"note\": \"One entry per provider. This list feeds Questions 5, 7, 8 and 13 and the HIPAA authorization checklist.\",\n         \"fields\": [\n             field(\"medical.providers\", \"Providers\", \"list\", item=\"Provider\", fields=[\n                 field(\"name\", \"Provider name\", full=True),\n                 field(\"address\", \"Address\", full=True),\n                 field(\"kind\", \"Type\", \"select\",\n                       o=[\"Emergency department\", \"Hospital admission\", \"Primary care\", \"Orthopedics\", \"Neurology\",\n                          \"Physical therapy\", \"Chiropractic\", \"Pain management\", \"Imaging\", \"Other\"]),\n                 field(\"first\", \"First visit\", \"date\"),\n                 field(\"ongoing\", \"Still treating?\", \"yn\"),\n                 field(\"last\", \"Last visit\", \"date\", h=\"If treatment has ended\"),\n                 field(\"frequency\", \"How often\", h=\"If still treating, for example twice weekly\"),\n                 field(\"admit\", \"Admitted\", \"date\", h=\"Hospital admissions only\"),\n                 field(\"discharge\", \"Discharged\", \"date\", h=\"Hospital admissions only\"),\n                 field(\"treatment\", \"Nature of treatment\", full=True),\n                 field(\"billed\", \"Amount billed\", \"money\"),\n                 field(\"paid\", \"Amount paid\", \"money\"),\n                 field(\"payer\", \"Paid by\", h=\"PIP, health insurer, plaintiff\"),\n                 field(\"report\", \"Written report on file?\", \"yn\"),\n             ]),\n         ]},\n        {\"title\": \"Diagnostic tests\", \"fields\": [\n            field(\"medical.tests\", \"Tests\", \"list\", item=\"Test\", fields=[\n                field(\"type\", \"Test\", full=True),\n                field(\"facility\", \"Where performed\"),\n                field(\"address\", \"Address\"),\n                field(\"date\", \"Date\", \"date\"),\n                field(\"result\", \"What it showed\", \"area\", full=True),\n            ]),\n        ]},\n        {\"title\": \"Pre-existing conditions\",\n         \"note\": \"Fill in only if the attorney is claiming aggravation (Attorney decisions screen).\",\n         \"fields\": [\n             field(\"medical.priors\", \"Conditions claimed aggravated\", \"list\", item=\"Condition\", fields=[\n                 field(\"condition\", \"Condition\", full=True),\n                 field(\"provider\", \"Treating provider\"),\n                 field(\"address\", \"Address\"),\n             ]),\n         ]},\n    ],\n\n    \"client\": [\n        {\"title\": \"Identity\", \"fields\": [\n            field(\"client.fullName\", \"Full legal name\",\n                  ask=\"Your full legal name, and any other names you have used\"),\n            field(\"client.dob\", \"Date of birth\", \"date\", ask=\"Your date of birth\"),\n            field(\"client.address\", \"Present address\", full=True, ask=\"Your current home address\"),\n            field(\"client.ssnLast4\", \"SSN, last four digits\", h=\"Only the last four digits are kept.\",\n                  ask=\"The last four digits of your Social Security number\"),\n            field(\"client.medicare\", \"Medicare beneficiary?\", \"yn\",\n                  ask=\"Are you on Medicare? If yes, please send us a copy of your Medicare card.\"),\n            field(\"client.medicareNo\", \"Medicare number\", h=\"Only if on Medicare\"),\n        ]},\n        {\"title\": \"The accident, in the client's words\", \"fields\": [\n            field(\"client.role\", \"Plaintiff was\", \"select\", auto=True,\n                  o=[(\"the operator of\", \"The driver\"), (\"the owner and operator of\", \"The owner and driver\"),\n                     (\"a passenger in\", \"A passenger\")],\n                  ask=\"Were you the driver or a passenger? Do you own the vehicle?\"),\n            field(\"client.version\", \"Client's account of how it happened\", \"area\", full=True, rows=5,\n                  h=\"Write it in the third person, for example: Plaintiff was stopped at a red light...\",\n                  ask=\"In your own words, describe how the accident happened.\"),\n            field(\"client.presentComplaints\", \"Present complaints\", \"area\", full=True,\n                  h=\"Symptoms the client has today\",\n                  ask=\"What pain or problems from the accident do you still have today?\"),\n        ]},\n        {\"title\": \"Employment at the time of the accident\", \"fields\": [\n            field(\"client.employed\", \"Employed at the time?\", \"yn\",\n                  ask=\"Were you working when the accident happened? If yes, give your employer's name and \"\n                      \"address, your job and duties, your average weekly pay, the dates you missed work, \"\n                      \"and the pay you lost.\",\n                  ask_with=[\"client.employer\", \"client.employerAddress\", \"client.position\", \"client.avgWeekly\",\n                            \"client.timeLost\", \"client.wagesLost\"]),\n            field(\"client.employer\", \"Employer\", h=\"Only if employed\"),\n            field(\"client.employerAddress\", \"Employer address\"),\n            field(\"client.position\", \"Position and duties\", full=True),\n            field(\"client.avgWeekly\", \"Average weekly wage\", \"money\"),\n            field(\"client.timeLost\", \"Time lost from work\", h=\"Dates, for example March 16, 2026 through April 27, 2026\"),\n            field(\"client.wagesLost\", \"Wages lost\", \"money\"),\n        ]},\n        {\"title\": \"Return to work and other losses\", \"fields\": [\n            field(\"client.returned\", \"Returned to work?\", \"yn\",\n                  ask=\"Have you gone back to work? If yes, give the employer, your job, and your current weekly pay.\",\n                  ask_with=[\"client.presentEmployer\", \"client.presentPosition\", \"client.presentWages\"]),\n            field(\"client.presentEmployer\", \"Present employer\", h=\"Only if returned to work\"),\n            field(\"client.presentEmployerAddress\", \"Present employer address\"),\n            field(\"client.presentPosition\", \"Present position and duties\", full=True),\n            field(\"client.presentWages\", \"Present weekly wage\", \"money\"),\n            field(\"client.otherIncomeLoss\", \"Other income loss\", \"area\", full=True, h=\"Leave blank if none\",\n                  ask=\"Did you lose any other income, such as business or side work? Describe it and give amounts.\"),\n            field(\"client.otherExpenses\", \"Other losses or expenses\", \"area\", full=True, h=\"Leave blank if none\",\n                  ask=\"List any other expenses from the accident, such as co-pays, prescriptions, travel to \"\n                      \"doctors, or help at home.\"),\n        ]},\n        {\"title\": \"Witnesses and evidence\", \"fields\": [\n            field(\"client.witnesses\", \"Eyewitnesses the client knows of\", \"list\", item=\"Eyewitness\",\n                  h=\"Witnesses already entered from the police report are included automatically.\",\n                  ask=\"Did anyone see the accident? Give each person's name, address, and how you know them.\",\n                  fields=[field(\"name\", \"Name\"), field(\"address\", \"Address\"),\n                          field(\"relationship\", \"Relationship to plaintiff\"),\n                          field(\"interest\", \"Interest in the lawsuit\")]),\n            field(\"client.others\", \"Other people with knowledge\", \"list\", item=\"Person\",\n                  ask=\"Who else knows about the accident or your injuries, such as family or coworkers?\",\n                  fields=[field(\"name\", \"Name\"), field(\"address\", \"Address\"),\n                          field(\"knowledge\", \"What they know\", full=True)]),\n            field(\"client.photos\", \"Photographs and recordings\", \"list\", item=\"Set\",\n                  ask=\"Do you have photos or videos of the vehicles, the scene, or your injuries? \"\n                      \"Who took them, and when?\",\n                  fields=[field(\"count\", \"How many\"), field(\"shows\", \"What they show\", full=True),\n                          field(\"date\", \"Date taken\", \"date\"), field(\"by\", \"Taken by\"),\n                          field(\"possession\", \"Who has them now\")]),\n        ]},\n        {\"title\": \"Statements and history\", \"fields\": [\n            field(\"client.admissionsYN\", \"Did the defendant say anything about the accident?\", \"yn\",\n                  ask=\"Did the other driver, or anyone for the defendant, say anything about what happened or \"\n                      \"who was at fault? What was said, when, where, and who heard it?\",\n                  ask_with=[\"client.admissions\"]),\n            field(\"client.admissions\", \"What was said, when, where, and who was present\", \"area\", full=True,\n                  h=\"Only if yes\"),\n            field(\"client.commsYN\", \"Any other conversations with the defendant?\", \"yn\",\n                  ask=\"Have you spoken with the defendant about the accident since it happened?\",\n                  ask_with=[\"client.comms\"]),\n            field(\"client.comms\", \"Date, people present, and a summary\", \"area\", full=True, h=\"Only if yes\"),\n            field(\"client.convicted\", \"Ever convicted of a crime?\", \"yn\",\n                  ask=\"Have you ever been convicted of a crime? If yes, give the date, place, and what it was for.\",\n                  ask_with=[\"client.convictionDetails\"]),\n            field(\"client.convictionDetails\", \"Date, place and nature\", full=True, h=\"Only if yes\"),\n        ]},\n        {\"title\": \"Driving details\", \"auto\": True, \"fields\": [\n            field(\"client.sawBefore\", \"Saw the other vehicle before impact?\", \"yn\",\n                  ask=\"Did you see the other vehicle before the crash? If yes, about how many seconds before?\",\n                  ask_with=[\"client.sawElapsed\"]),\n            field(\"client.sawElapsed\", \"Time between first seeing it and impact\", h=\"Only if yes. For example, two seconds\"),\n            field(\"client.speedImpact\", \"Plaintiff's speed at impact\",\n                  ask=\"How fast were you going at the moment of impact? How fast was the other vehicle going?\",\n                  ask_with=[\"client.otherSpeedImpact\"]),\n            field(\"client.otherSpeedImpact\", \"Defendant's speed at impact\", h=\"Write Unknown if the client cannot say\"),\n            field(\"client.speedsDistances\", \"Speeds and distances when first observed (Question 30)\", \"area\", full=True,\n                  ask=\"When you first saw the other vehicle, how fast was each vehicle going, and how far apart were you?\"),\n            field(\"client.malfunction\", \"Claiming a vehicle malfunction?\", \"yn\"),\n            field(\"client.malfunctionDetails\", \"Malfunction details (Question 28, items a to g)\", \"area\", full=True,\n                  h=\"Only if claiming a malfunction\"),\n            field(\"client.uncontrolledDetails\", \"Uncontrolled intersection details (Question 29)\", \"area\", full=True,\n                  h=\"Only for an uncontrolled intersection: who entered first, whether plaintiff stopped, speed entering\"),\n        ]},\n        {\"title\": \"Insurance\", \"auto\": True, \"fields\": [\n            field(\"client.pip\", \"Auto insurance with PIP?\", \"yn\",\n                  ask=\"What company insured your car, and what is the policy number? Please send us the declaration page.\",\n                  ask_with=[\"client.insCarrier\", \"client.policyNo\"]),\n            field(\"client.insCarrier\", \"Insurance carrier\"),\n            field(\"client.insAddress\", \"Carrier address\"),\n            field(\"client.policyNo\", \"Policy number\"),\n            field(\"client.namedInsured\", \"Named insured\"),\n            field(\"client.propertyDamage\", \"Also claiming property damage to the vehicle?\", \"yn\",\n                  h=\"If yes, Form B Questions 1 to 18 must also be answered.\"),\n        ]},\n        {\"title\": \"Background the defense often asks about\",\n         \"note\": \"These feed the standard answers on the Supplemental questions screen. Collecting them on the \"\n                 \"questionnaire saves a call to the client.\",\n         \"fields\": [\n             field(\"client.trip\", \"Where plaintiff was coming from and going\", full=True, auto=True,\n                   ask=\"Where were you coming from, and where were you going, when the accident happened?\"),\n             field(\"client.phoneUse\", \"Using a phone or other device at the time?\", \"yn\",\n                   ask=\"Were you using a cell phone or any other device at the time of the accident? If yes, how?\",\n                   ask_with=[\"client.phoneDetails\"]),\n             field(\"client.phoneDetails\", \"How the phone or device was being used\", full=True, h=\"Only if yes\"),\n             field(\"client.substances\", \"Alcohol, drugs or medication within 24 hours before?\", \"yn\",\n                   ask=\"In the 24 hours before the accident, did you have any alcohol, drugs, or medication? \"\n                       \"If yes, what, how much, and when?\",\n                   ask_with=[\"client.substanceDetails\"]),\n             field(\"client.substanceDetails\", \"What, how much, and when\", full=True, h=\"Only if yes\"),\n             field(\"client.licenseRestrictions\", \"Driver's license restrictions or corrective lenses\", full=True,\n                   auto=True,\n                   ask=\"Does your license require glasses or contacts, or have any other restriction? \"\n                       \"Were you wearing them?\"),\n             field(\"client.priorAccidents\", \"Prior accidents or injuries, last ten years\", \"area\", full=True,\n                   h=\"Write None if there were none\",\n                   ask=\"In the ten years before this accident, were you in any other accident or injured in any way? \"\n                       \"Describe each.\"),\n             field(\"client.priorClaims\", \"Prior claims or lawsuits\", \"area\", full=True,\n                   h=\"Include workers' compensation. Write None if there were none\",\n                   ask=\"Have you ever made an injury claim or filed a lawsuit, including a workers' compensation \"\n                       \"claim? Describe each.\"),\n             field(\"client.pcp\", \"Primary care physician, last ten years\", full=True,\n                   ask=\"Who has been your primary care doctor over the last ten years? Give names and addresses.\"),\n             field(\"client.pharmacy\", \"Pharmacies used\", full=True,\n                   ask=\"Which pharmacies have you used in the last ten years?\"),\n             field(\"client.healthInsurer\", \"Health insurer\", ask=\"Who is your health insurance company?\"),\n             field(\"client.socialMedia\", \"Social media accounts\", \"area\", full=True,\n                   h=\"Platform and user name for each\",\n                   ask=\"Which social media accounts do you have (Facebook, Instagram, TikTok, X, or others)? \"\n                       \"Give the user name for each. Please do not delete or change anything on them.\"),\n             field(\"client.employmentHistory\", \"Employment history, last ten years\", \"area\", full=True,\n                   ask=\"List your employers for the last ten years, with dates and your job at each.\"),\n         ]},\n    ],\n\n    \"attorney\": [\n        {\"title\": \"Claims\", \"fields\": [\n            field(\"attorney.aggravation\", \"Claiming aggravation of a pre-existing condition?\", \"yn\",\n                  h=\"If yes, list the conditions on the Medical records screen.\"),\n            field(\"attorney.threshold\", \"Lawsuit threshold\", \"select\", auto=True,\n                  o=[(\"limitation\", \"Limitation on lawsuit (verbal threshold)\"),\n                     (\"none\", \"No limitation on lawsuit\"), (\"unknown\", \"Not yet determined\")],\n                  h=\"Controls the physician certification reminder. N.J.S.A. 39:6A-8(a).\"),\n            field(\"attorney.statutes\", \"Additional statutes or ordinances (Question 22)\", \"area\", full=True,\n                  h=\"The summons from the police report is included automatically.\"),\n            field(\"attorney.statementsYN\", \"Statements obtained from non-parties? (Question 21)\", \"yn\"),\n            field(\"attorney.statements\", \"Statement details (Question 21, items a to g)\", \"area\", full=True,\n                  h=\"Only if yes\"),\n            field(\"attorney.documentsExtra\", \"Additional documents to identify (Question 15)\", \"area\", full=True,\n                  h=\"One per line. The police report, records, photographs and declaration sheet are listed automatically.\"),\n        ]},\n        {\"title\": \"Expert witnesses\",\n         \"note\": \"Treating physicians are described in Question 23 automatically. Add retained experts here.\",\n         \"fields\": [\n             field(\"attorney.experts\", \"Experts\", \"list\", item=\"Expert\", fields=[\n                 field(\"name\", \"Name\"), field(\"address\", \"Address\"),\n                 field(\"specialty\", \"Area of expertise\"), field(\"report\", \"Report date\", \"date\"),\n             ]),\n         ]},\n    ],\n}\n\n\ndef index_key(path):\n    \"\"\"'medical.providers.3.billed' -> 'medical.providers.*.billed'\"\"\"\n    return re.sub(r\"\\.\\d+(?=\\.|$)\", \".*\", path)\n\n\ndef _build_index():\n    index = {}\n    for step, groups in SCREENS.items():\n        for group in groups:\n            for f in group[\"fields\"]:\n                index[f[\"k\"]] = {\"label\": f[\"l\"], \"step\": step, \"t\": f[\"t\"], \"item\": f.get(\"item\")}\n                for sub in f.get(\"fields\", []):\n                    index[f\"{f['k']}.*.{sub['k']}\"] = {\"label\": sub[\"l\"], \"step\": step, \"t\": sub[\"t\"]}\n    # values that are worked out from other fields point back to the field to fill in\n    index[\"calc.ssnText\"] = {\"jump\": \"client.ssnLast4\"}\n    index[\"medical.providers.*.owed\"] = {\"jump\": \".billed\"}\n    index[\"calc.totalBilled\"] = {\"jump\": \"medical.providers\"}\n    index[\"served.date\"] = {\"label\": \"Date Form A answers were served\", \"step\": \"finish\", \"t\": \"date\"}\n    return index\n\n\nFIELD_INDEX = _build_index()\n\n\ndef all_fields():\n    for groups in SCREENS.values():\n        for group in groups:\n            yield from group[\"fields\"]\n\n\ndef find_field(path):\n    for f in all_fields():\n        if f[\"k\"] == path:\n            return f\n    return None\n", "form_a.py": "\"\"\"Form A uniform interrogatories (R. Appendix II, text effective September 1, 2020).\n\nThe question wording is court-prescribed. It can be changed from the Forms\nlibrary screen when the rule is amended; edits are saved to data/library.json\nand these defaults stay as they are.\n\nEach entry:\n  n        question number\n  subject  short name used in lists\n  src      where the answer comes from (police, medical, client, attorney, file)\n  text     the question as served\n  tpl      the answer template (see drafting.py for the template codes)\n\"\"\"\n\nFORM_A = [\n    {\"n\": 1, \"subject\": \"Identity, birth date, SSN, Medicare\", \"src\": [\"client\"],\n     \"text\": \"Full name, present address, date of birth, Social Security number, and Medicare number, if applicable. \"\n             \"If Medicare number is applicable, attach a copy of the Medicare card.\",\n     \"tpl\": \"\"\"{{client.fullName}}\n{{client.address}}\nDate of birth: {{client.dob|date}}\nSocial Security number: {{calc.ssnText}}\n{{#if client.medicare == yes}}Plaintiff is a Medicare beneficiary. Medicare number: {{client.medicareNo}}. A copy of plaintiff's Medicare card is annexed hereto.{{else}}Plaintiff is not a Medicare beneficiary.{{/if}}\"\"\"},\n\n    {\"n\": 2, \"subject\": \"How the accident happened\", \"src\": [\"police\", \"client\"],\n     \"text\": \"Describe in detail your version of the accident or occurrence setting forth the date, location, time and weather.\",\n     \"tpl\": \"\"\"On {{police.date|date}}, at approximately {{police.time|time}}, plaintiff was involved in {{calc.incidentNoun}} at or near {{police.location}}, {{police.municipality}}, New Jersey.{{#if calc.isAuto}} Plaintiff was {{client.role}} a {{police.plaintiffVehicle}} proceeding {{police.plaintiffDirection}}bound on {{police.plaintiffRoad}}.{{/if}} The weather was {{police.weather|lower}}.\n\n{{client.version}}\"\"\"},\n\n    {\"n\": 3, \"subject\": \"Injuries\", \"src\": [\"medical\"],\n     \"text\": \"Detailed description of nature, extent and duration of any and all injuries.\",\n     \"tpl\": \"\"\"As a result of the accident, plaintiff sustained the following injuries: {{medical.injuries}}\n\nThe nature, extent and duration of these injuries are more fully described in the records and reports of plaintiff's treating health care providers, which are annexed hereto or will be supplied upon receipt.{{#if calc.current}} Plaintiff remains under active treatment, and the full duration of the injuries is not yet known.{{/if}}\"\"\"},\n\n    {\"n\": 4, \"subject\": \"Permanent injuries, present complaints\", \"src\": [\"medical\", \"client\"],\n     \"text\": \"Detailed description of injury or condition claimed to be permanent together with all present complaints.\",\n     \"tpl\": \"\"\"{{medical.permanent}}\n\nPresent complaints: {{client.presentComplaints}}\n\nPlaintiff will rely upon the records, reports and testimony of plaintiff's treating physicians and any expert witnesses regarding permanency. Reports will be supplied in accordance with the Rules of Court.\"\"\"},\n\n    {\"n\": 5, \"subject\": \"Hospital confinement\", \"src\": [\"medical\"],\n     \"text\": \"If confined to a hospital, state its name and address, and dates of admission and discharge.\",\n     \"tpl\": \"\"\"{{#if calc.admissions}}{{#each calc.admissions}}{{.name}}, {{.address}}. Admitted {{.admit|date}}; discharged {{.discharge|date}}.\n{{/each}}{{else}}Plaintiff was not confined to a hospital.{{#each calc.er}} Plaintiff was treated and released from {{.name}}, {{.address}}, on {{.first|date}}.{{/each}}{{/if}}\"\"\"},\n\n    {\"n\": 6, \"subject\": \"Diagnostic tests\", \"src\": [\"medical\"],\n     \"text\": \"If any diagnostic tests were performed, state the type of test performed, name and address of place where \"\n             \"performed, date each test was performed and what each test disclosed. Attach a copy of the test results.\",\n     \"tpl\": \"\"\"{{#if medical.tests}}{{#each medical.tests}}({{@a}}) {{.type}}, performed on {{.date|date}} at {{.facility}}, {{.address}}. Result: {{.result}}\n{{/each}}\nCopies of the test results are annexed hereto.{{else}}No diagnostic tests have been performed to date.{{/if}}\"\"\"},\n\n    {\"n\": 7, \"subject\": \"Health care providers\", \"src\": [\"medical\"],\n     \"text\": \"If treated by any health care provider, state the name and present address of each health care provider, \"\n             \"the dates and places where treatments were received and the date of last treatment. Attach true copies of \"\n             \"all written reports provided to you by any such health care provider whom you propose to have testify in \"\n             \"your behalf.\",\n     \"tpl\": \"\"\"{{#if calc.providers}}{{#each calc.providers}}({{@a}}) {{.name}}, {{.address}}\nDates of treatment: {{.first|date}} through {{#if .ongoing == yes}}the present (treatment is ongoing){{else}}{{.last|date}} (date of last treatment){{/if}}. Treatment: {{.treatment}}.\n\n{{/each}}Copies of all written reports provided by any health care provider whom plaintiff proposes to have testify are annexed hereto. Any reports received hereafter will be served promptly upon receipt.{{else}}{{need medical.providers}}{{/if}}\"\"\"},\n\n    {\"n\": 8, \"subject\": \"Current treatment\", \"src\": [\"medical\"],\n     \"text\": \"If still being treated, the name and address of each doctor or health care provider rendering treatment, \"\n             \"where and how often treatment is received and the nature of the treatment.\",\n     \"tpl\": \"\"\"{{#if calc.current}}Plaintiff is presently treating with the following providers:\n{{#each calc.current}}({{@a}}) {{.name}}, {{.address}}. Frequency: {{.frequency}}. Nature of treatment: {{.treatment}}.\n{{/each}}{{else}}Plaintiff is not presently treating.{{/if}}\"\"\"},\n\n    {\"n\": 9, \"subject\": \"Aggravation of a prior condition\", \"src\": [\"medical\", \"attorney\"],\n     \"text\": \"If a previous injury, disease, illness or condition is claimed to have been aggravated, accelerated or \"\n             \"exacerbated, specify in detail the nature of each and the name and present address of each health care \"\n             \"provider, if any, whoever provided treatment for the condition.\",\n     \"tpl\": \"\"\"{{#if attorney.aggravation == yes}}Plaintiff claims aggravation of the following pre-existing conditions:\n{{#each medical.priors}}({{@a}}) {{.condition}}. Treating provider: {{.provider}}, {{.address}}.\n{{/each}}{{#if medical.priors}}{{else}}{{need medical.priors}}{{/if}}{{else}}Not applicable. Plaintiff does not presently claim that any previous injury, disease, illness or condition was aggravated, accelerated or exacerbated. Plaintiff reserves the right to amend this answer pursuant to R. 4:17-7.{{/if}}\"\"\"},\n\n    {\"n\": 10, \"subject\": \"Employment at the time\", \"src\": [\"client\"],\n     \"text\": \"If employed at the time of the accident, state: (a) name and address of employer; (b) position held and \"\n             \"nature of work performed; (c) average weekly wages for past year; (d) period of time lost from employment, \"\n             \"giving dates; and (e) amount of wages lost, if any.\",\n     \"tpl\": \"\"\"{{#if client.employed == yes}}(a) {{client.employer}}, {{client.employerAddress}}\n(b) {{client.position}}\n(c) Approximately {{client.avgWeekly|money}} per week\n(d) {{client.timeLost}}\n(e) {{client.wagesLost|money}}, to be supplemented with wage documentation{{else}}Not applicable. Plaintiff was not employed at the time of the accident.{{/if}}\"\"\"},\n\n    {\"n\": 11, \"subject\": \"Return to employment\", \"src\": [\"client\"],\n     \"text\": \"If there has been a return to employment or occupation, state: (a) name and address of present employer; \"\n             \"(b) position held and nature of work performed; and (c) present weekly wages, earning, income or profit.\",\n     \"tpl\": \"\"\"{{#if client.employed == no}}Not applicable.{{else}}{{#if client.returned == yes}}(a) {{client.presentEmployer}}, {{client.presentEmployerAddress}}\n(b) {{client.presentPosition}}\n(c) Approximately {{client.presentWages|money}} per week{{else}}Plaintiff has not returned to employment.{{/if}}{{/if}}\"\"\"},\n\n    {\"n\": 12, \"subject\": \"Other income loss\", \"src\": [\"client\"],\n     \"text\": \"If other loss of income, profit or earnings is claimed: (a) state total amount of the loss; (b) give a \"\n             \"complete detailed computation of the loss; and (c) state the nature and source of the loss of income, \"\n             \"profit and earnings, and the dates of the deprivation.\",\n     \"tpl\": \"\"\"{{#if client.otherIncomeLoss}}{{client.otherIncomeLoss}}{{else}}Plaintiff does not presently claim any loss of income, profit or earnings other than as set forth in the answer to Interrogatory No. 10.{{/if}}\"\"\"},\n\n    {\"n\": 13, \"subject\": \"Medical expenses\", \"src\": [\"medical\", \"client\"],\n     \"text\": \"Itemize in complete detail any and all moneys expended or expenses incurred for hospitals, doctors, nurses, \"\n             \"diagnostic tests or health care providers, x-rays, medicines, care and appliances and state the name and \"\n             \"address of each payee and the amount paid and owed each payee.\",\n     \"tpl\": \"\"\"{{#if calc.providers}}{{#each calc.providers}}({{@a}}) {{.name}}, {{.address}}: billed {{.billed|money}}; paid {{.paidText}}{{#if .billed}}; balance {{.owed|money}}{{/if}}.\n{{/each}}\nTotal billed to date: {{calc.totalBilled|money}}.{{/if}}{{#if calc.isAuto}} Plaintiff's medical expenses have been submitted to plaintiff's personal injury protection (PIP) carrier, {{client.insCarrier}}. A copy of the PIP payout ledger will be supplied upon receipt.{{/if}} Plaintiff reserves the right to supplement this answer as additional bills are received.\"\"\"},\n\n    {\"n\": 14, \"subject\": \"Other losses and expenses\", \"src\": [\"client\"],\n     \"text\": \"Itemize any and all other losses or expenses incurred not otherwise set forth.\",\n     \"tpl\": \"\"\"{{#if client.otherExpenses}}{{client.otherExpenses}}{{else}}None at this time. Plaintiff reserves the right to supplement this answer.{{/if}}\"\"\"},\n\n    {\"n\": 15, \"subject\": \"Documents\", \"src\": [\"file\", \"attorney\"],\n     \"text\": \"Identify all documents that may relate to this action and attach copies of each such document.\",\n     \"tpl\": \"\"\"Plaintiff identifies the following documents, copies of which are annexed hereto or have been previously exchanged:\n{{#each calc.documents}}({{@a}}) {{.}}\n{{/each}}\nPlaintiff reserves the right to rely upon any document produced by any party or non-party in discovery.\"\"\"},\n\n    {\"n\": 16, \"subject\": \"Eyewitnesses\", \"src\": [\"police\", \"client\"],\n     \"text\": \"State the names and addresses of all eyewitnesses to the accident or occurrence, their relationship to \"\n             \"you and their interest in this lawsuit.\",\n     \"tpl\": \"\"\"{{#if calc.eyewitnesses}}{{#each calc.eyewitnesses}}({{@a}}) {{.name}}, {{.address}}. Relationship to plaintiff: {{.relationship}}. Interest in this lawsuit: {{.interest}}.\n{{/each}}{{else}}Plaintiff is not presently aware of any eyewitnesses other than the parties. Investigation is continuing.{{/if}}\"\"\"},\n\n    {\"n\": 17, \"subject\": \"Persons with knowledge\", \"src\": [\"police\", \"client\"],\n     \"text\": \"State the names and addresses of all persons who have knowledge of any facts relating to the case.\",\n     \"tpl\": \"\"\"Plaintiff, {{client.fullName}}, {{client.address}}.\nThe defendants named in the caption, through their counsel.\n{{#if police.officer}}{{police.officer}}, {{police.agency}}, investigating officer.\n{{/if}}{{#each calc.eyewitnesses}}{{.name}}, {{.address}}, eyewitness.\n{{/each}}{{#each client.others}}{{.name}}, {{.address}}. {{.knowledge}}\n{{/each}}Plaintiff's treating health care providers, identified in the answer to Interrogatory No. 7.\"\"\"},\n\n    {\"n\": 18, \"subject\": \"Photographs and recordings\", \"src\": [\"client\"],\n     \"text\": \"If any photographs, videotapes, audio tapes or other forms of electronic recording, sketches, \"\n             \"reproductions, charts or maps were made with respect to anything that is relevant to the subject matter \"\n             \"of the complaint, describe: (a) the number of each; (b) what each shows or contains; (c) the date taken \"\n             \"or made; (d) the names and addresses of the persons who made them; (e) in whose possession they are at \"\n             \"present; and (f) if in your possession, attach a copy, or if not subject to convenient copying, state \"\n             \"the location where inspection and copying may take place.\",\n     \"tpl\": \"\"\"{{#if client.photos}}{{#each client.photos}}({{@a}}) Number: {{.count}}. Contents: {{.shows}}. Date taken: {{.date|date}}. Taken by: {{.by}}. Present possession: {{.possession}}.\n{{/each}}\nCopies are annexed hereto.{{else}}Plaintiff is not presently aware of any photographs, recordings, sketches, charts or maps other than any contained in the police report. Investigation is continuing.{{/if}}\"\"\"},\n\n    {\"n\": 19, \"subject\": \"Admissions by defendant\", \"src\": [\"client\"],\n     \"text\": \"If you claim that the defendant made any admissions as to the subject matter of this lawsuit, state: \"\n             \"(a) the date made; (b) the name of the person by whom made; (c) the name and address of the person to \"\n             \"whom made; (d) where made; (e) the name and address of each person present at the time the admission \"\n             \"was made; (f) the contents of the admission; and (g) if in writing, attach a copy.\",\n     \"tpl\": \"\"\"{{#if client.admissionsYN == yes}}{{client.admissions}}{{else}}None known at this time.{{/if}}\"\"\"},\n\n    {\"n\": 20, \"subject\": \"Communications with defendant\", \"src\": [\"client\"],\n     \"text\": \"If you or your representative and the defendant have had any oral communication concerning the subject \"\n             \"matter of this lawsuit, state: (a) the date of the communication; (b) the name and address of each \"\n             \"participant; (c) the name and address of each person present at the time of such communication; \"\n             \"(d) where such communication took place; and (e) a summary of what was said by each party participating \"\n             \"in the communication.\",\n     \"tpl\": \"\"\"{{#if client.commsYN == yes}}{{client.comms}}{{else}}{{#if client.admissionsYN == yes}}Other than as set forth in the answer to Interrogatory No. 19, none.{{else}}None.{{/if}}{{/if}}\"\"\"},\n\n    {\"n\": 21, \"subject\": \"Non-party statements\", \"src\": [\"attorney\"],\n     \"text\": \"If you have obtained a statement from any person not a party to this action, state: (a) the name and \"\n             \"present address of the person who gave the statement; (b) whether the statement was oral or in writing \"\n             \"and if in writing, attach a copy; (c) the date the statement was obtained; (d) if such statement was \"\n             \"oral, whether a recording was made, and if so, the nature of the recording and the name and present \"\n             \"address of the person who has custody of it; (e) if the statement was written, whether it was signed by \"\n             \"the person making it; (f) the name and address of the person who obtained the statement; and (g) if the \"\n             \"statement was oral, a detailed summary of its contents.\",\n     \"tpl\": \"\"\"{{#if attorney.statementsYN == yes}}{{attorney.statements}}{{else}}None at this time.{{/if}}\"\"\"},\n\n    {\"n\": 22, \"subject\": \"Statutes and ordinances\", \"src\": [\"police\", \"attorney\"],\n     \"text\": \"If you claim that the violation of any statute, rule, regulation or ordinance is a factor in this \"\n             \"litigation, state the exact title and section.\",\n     \"tpl\": \"\"\"{{#if police.defendantSummons}}Plaintiff contends that defendant violated {{police.defendantSummons}}, for which defendant was issued a summons by the {{police.agency}}. {{/if}}{{#if attorney.statutes}}{{attorney.statutes}} {{/if}}{{#if calc.isAuto}}Plaintiff further relies upon the applicable provisions of Title 39 of the New Jersey Statutes, N.J.S.A. 39:1-1 et seq.{{/if}} Plaintiff reserves the right to rely upon any additional statute, rule, regulation or ordinance identified in discovery.\"\"\"},\n\n    {\"n\": 23, \"subject\": \"Expert witnesses\", \"src\": [\"attorney\"],\n     \"text\": \"State the names and addresses of any and all proposed expert witnesses. Set forth in detail the \"\n             \"qualifications of each expert named and attach a copy of each expert's current resume. Also attach true \"\n             \"copies of all written reports provided to you by any such proposed expert witnesses.\\n\\n\"\n             \"With respect to all expert witnesses, including treating physicians, who are expected to testify at \"\n             \"trial and with respect to any person who has conducted an examination pursuant to Rule 4:19, who may \"\n             \"testify, state each such witness's name, address and area of expertise and attach a true copy of all \"\n             \"written reports provided to you.\\n\\n\"\n             \"State the subject matter on which your experts are expected to testify.\\n\\n\"\n             \"State the substance of the facts and opinions to which your experts are expected to testify and a \"\n             \"summary of the grounds for each opinion.\",\n     \"tpl\": \"\"\"{{#if attorney.experts}}{{#each attorney.experts}}({{@a}}) {{.name}}, {{.address}}. Area of expertise: {{.specialty}}.{{#if .report}} Report dated {{.report|date}} annexed hereto.{{/if}}\n{{/each}}\nThe qualifications of each expert are set forth in the annexed curricula vitae. The subject matter, the substance of the facts and opinions, and the grounds for each opinion are set forth in the annexed reports.\n\n{{/if}}Plaintiff's treating physicians, identified in the answer to Interrogatory No. 7, may testify at trial regarding their treatment of plaintiff, diagnosis, prognosis, permanency and causation, consistent with their records and reports. Plaintiff will supply the names, qualifications and reports of any additional expert witnesses in accordance with the Rules of Court and any applicable case management order.\"\"\"},\n\n    {\"n\": 24, \"subject\": \"Criminal convictions\", \"src\": [\"client\"],\n     \"text\": \"State whether you have ever been convicted of a crime. If the answer is \\\"yes\\\", state: (a) date; \"\n             \"(b) place; and (c) nature.\",\n     \"tpl\": \"\"\"{{#if client.convicted == yes}}Yes. {{client.convictionDetails}}{{else}}No.{{/if}}\"\"\"},\n\n    # 25 to 37 are answered only in automobile accident cases\n    {\"n\": 25, \"subject\": \"Road and direction\", \"src\": [\"police\"],\n     \"text\": \"State on what street, highway, road or other place (designate which) and in what general direction \"\n             \"(north, south, east or west) your vehicle was proceeding immediately prior to the collision. (You may \"\n             \"include a sketch for greater clarity.)\",\n     \"tpl\": \"\"\"Plaintiff's vehicle was proceeding {{police.plaintiffDirection}}bound on {{police.plaintiffRoad}}, immediately prior to the collision.\"\"\"},\n\n    {\"n\": 26, \"subject\": \"Point of impact\", \"src\": [\"police\"],\n     \"text\": \"With respect to fixed objects at the location of the collision, state as nearly as possible the point of \"\n             \"impact. If you included a sketch, place an X thereon to denote the point of impact.\\n\\n\"\n             \"(Note: The term \\\"point of impact\\\" as used in this and other questions has reference to the exact point \"\n             \"on the street, highway, road or other place where the vehicles collided or where any pedestrian was struck.)\",\n     \"tpl\": \"\"\"{{police.pointOfImpact}}\"\"\"},\n\n    {\"n\": 27, \"subject\": \"Traffic controls\", \"src\": [\"police\"],\n     \"text\": \"State whether there were any traffic control devices, signs or police officers at or near the place of \"\n             \"the collision. If there were, describe them (i.e., traffic lights, stop sign, police officers, etc.) and \"\n             \"state the exact location of each.\",\n     \"tpl\": \"\"\"{{police.trafficControls}}\"\"\"},\n\n    {\"n\": 28, \"subject\": \"Vehicle malfunction\", \"src\": [\"client\"],\n     \"text\": \"If you contend that there was a malfunction of a motor vehicle or equipment, state: (a) make, model and \"\n             \"year of the motor vehicle and whether or not that vehicle was equipped with power brakes and steering; \"\n             \"(b) the nature of the malfunction; (c) the date the motor vehicle was purchased and the name and address \"\n             \"of the person from whom the motor vehicle was purchased; (d) the date that that portion of the motor \"\n             \"vehicle in which the malfunction occurred was last inspected and the name and address of the person \"\n             \"inspecting same; (e) the last date prior to the accident that that portion of the motor vehicle was \"\n             \"repaired or replaced, the nature and extent of the repairs, the name and address of the person repairing \"\n             \"or replacing same; (f) if the motor vehicle was repaired after the accident, state the name and address \"\n             \"of the person repairing same and the nature of the repairs; and (g) attach a copy of any repair bills.\",\n     \"tpl\": \"\"\"{{#if client.malfunction == yes}}{{client.malfunctionDetails}}{{else}}Plaintiff does not contend that there was a malfunction of a motor vehicle or equipment.{{/if}}\"\"\"},\n\n    {\"n\": 29, \"subject\": \"Uncontrolled intersection\", \"src\": [\"police\", \"client\"],\n     \"text\": \"If the collision occurred at an uncontrolled intersection, state: (a) which vehicle entered the \"\n             \"intersection first; (b) whether your vehicle came to a full stop before entering the intersection; and \"\n             \"(c) if your vehicle did not come to a full stop before entering the intersection, state the speed of \"\n             \"your vehicle when it entered the intersection.\",\n     \"tpl\": \"\"\"{{#if police.intersection == uncontrolled}}{{client.uncontrolledDetails}}{{else}}Not applicable. The collision did not occur at an uncontrolled intersection.{{/if}}\"\"\"},\n\n    {\"n\": 30, \"subject\": \"Speeds and distances\", \"src\": [\"client\"],\n     \"text\": \"For each other vehicle or pedestrian collided with, state, at the time you first observed the other \"\n             \"vehicle or pedestrian, (a) your speed and (b) the speed of the other vehicle or the movement, if any, of \"\n             \"the pedestrian, and the distance in feet between (c) the front of your vehicle and the point of impact; \"\n             \"(d) the front of the other vehicle or pedestrian and the point of impact, and (e) the front of your \"\n             \"vehicle and the other vehicle or pedestrian.\",\n     \"tpl\": \"\"\"{{client.speedsDistances}}\"\"\"},\n\n    {\"n\": 31, \"subject\": \"Rest positions\", \"src\": [\"police\"],\n     \"text\": \"State where each vehicle came to rest after the impact. Include the distance in terms of feet from the \"\n             \"point of impact to the point where each vehicle came to rest.\",\n     \"tpl\": \"\"\"{{police.restPositions}}\"\"\"},\n\n    {\"n\": 32, \"subject\": \"Points of contact\", \"src\": [\"police\"],\n     \"text\": \"For each other vehicle or pedestrian involved, state (a) which part of your vehicle; and (b) which part \"\n             \"of the other vehicle or pedestrian came into contact.\",\n     \"tpl\": \"\"\"{{police.contactPoints}}\"\"\"},\n\n    {\"n\": 33, \"subject\": \"Time, weather, visibility, roadway\", \"src\": [\"police\"],\n     \"text\": \"State the following facts with respect to the collision: (a) time; (b) condition of weather; \"\n             \"(c) condition of visibility; and (d) condition of roadway.\",\n     \"tpl\": \"\"\"(a) Approximately {{police.time|time}}; (b) {{police.weather|lower}}; (c) {{police.light|lower}}; (d) {{police.surface|lower}}.\"\"\"},\n\n    {\"n\": 34, \"subject\": \"Observation before impact\", \"src\": [\"client\"],\n     \"text\": \"For each other vehicle or pedestrian involved, state whether you observed the vehicle or pedestrian \"\n             \"prior to the accident? If the answer is \\\"yes,\\\" set forth the time that elapsed from the time you first \"\n             \"saw the vehicle or pedestrian until the impact occurred.\",\n     \"tpl\": \"\"\"{{#if client.sawBefore == yes}}Yes. Approximately {{client.sawElapsed}} elapsed between the time plaintiff first observed defendant's vehicle and the impact.{{else}}No.{{/if}}\"\"\"},\n\n    {\"n\": 35, \"subject\": \"Speeds at impact\", \"src\": [\"client\"],\n     \"text\": \"At the time of the impact, state the speeds of all vehicles involved in the collision.\",\n     \"tpl\": \"\"\"Plaintiff's vehicle: {{client.speedImpact}}. Defendant's vehicle: {{client.otherSpeedImpact}}.\"\"\"},\n\n    {\"n\": 36, \"subject\": \"Motor vehicle charges\", \"src\": [\"police\"],\n     \"text\": \"Were you charged with a motor vehicle violation as a result of the collision? If the answer is \\\"yes\\\", \"\n             \"state: (a) charge; (b) plea; and (c) disposition.\",\n     \"tpl\": \"\"\"{{#if police.plaintiffCharged == yes}}Yes. {{police.plaintiffChargeDetails}}{{else}}No.{{/if}}\"\"\"},\n\n    {\"n\": 37, \"subject\": \"Insurance and PIP\", \"src\": [\"client\"],\n     \"text\": \"Do you have insurance coverage and/or PIP benefits under an applicable policy or policies of automobile \"\n             \"insurance? As to each such policy provide the name and address of the insurance carrier, policy number, \"\n             \"the named insured and attach a copy of the declaration sheet.\\n\\n\"\n             \"If you are making a claim for property damage to a motor vehicle, provide answers to the uniform \"\n             \"interrogatories contained in Form B, questions 1 through 18.\",\n     \"tpl\": \"\"\"{{#if client.pip == yes}}Yes. Insurance carrier: {{client.insCarrier}}, {{client.insAddress}}. Policy number: {{client.policyNo}}. Named insured: {{client.namedInsured}}. A copy of the declaration sheet is annexed hereto.{{else}}No.{{/if}}{{#if client.propertyDamage == yes}}\n\nPlaintiff's answers to Form B Uniform Interrogatories, Questions 1 through 18, concerning the claim for property damage to plaintiff's motor vehicle, are served herewith.{{/if}}\"\"\"},\n]\n\n# R. 4:17-4(a): the person answering designates information not within personal knowledge\nSOURCE_LINES = {\n    \"police\": \"Information concerning the accident that is not within plaintiff's personal knowledge was obtained \"\n              \"from {{police.agency}} Crash Investigation Report No. {{police.reportNo}}, a copy of which is \"\n              \"maintained at the office of plaintiff's counsel.\",\n    \"medical\": \"Medical information that is not within plaintiff's personal knowledge was obtained from the records \"\n               \"of the health care providers identified in the answer to Interrogatory No. 7, which are maintained \"\n               \"at the office of plaintiff's counsel.\",\n}\n\nOPENING_PARAGRAPH = (\n    \"Plaintiff {{client.fullName}} answers the Form A Uniform Interrogatories deemed served pursuant to \"\n    \"R. 4:17-1(b)(2){{#if calc.isAuto}}, including Questions 25 through 37 applicable to automobile accident \"\n    \"cases{{/if}}{{#if calc.hasSupp}}, and the supplemental interrogatories served by defendant{{/if}}.\"\n    \"{{#if firm.desig == answer}} Where information is not within plaintiff's personal knowledge, its source is \"\n    \"designated as required by R. 4:17-4(a).{{/if}} Discovery is continuing, and plaintiff reserves the right to \"\n    \"amend these answers in accordance with R. 4:17-7.\"\n)\n\nCERTIFICATION = (\n    \"I hereby certify that the foregoing answers to interrogatories are true. I am aware that if any of the \"\n    \"foregoing statements made by me are willfully false, I am subject to punishment.\\n\\n\"\n    \"I hereby certify that the copies of the reports annexed hereto provided by either treating physicians or \"\n    \"proposed expert witnesses are exact copies of the entire report or reports provided by them; that the existence \"\n    \"of other reports of said doctors or experts are unknown to me, and if such become later known or available, \"\n    \"I shall serve them promptly on the propounding party.\"\n)\n", "standard_text.py": "\"\"\"The firm's standard wording. All of it can be edited from the Forms library.\n\nCLAUSES are the insertable paragraphs on every answer. Kind \"answer\" is\nordinary wording; kind \"objection\" goes in front of the answer.\n\nSUPPLEMENTAL_ANSWERS are ready answers for the supplemental questions the\ndefense tends to send. When a question contains one of the match words, the\nanswer is offered for that question.\n\"\"\"\n\nCLAUSES = [\n    {\"kind\": \"answer\", \"name\": \"Reserve the right to amend\",\n     \"text\": \"Plaintiff reserves the right to amend or supplement this answer in accordance with R. 4:17-7 as discovery continues.\"},\n    {\"kind\": \"answer\", \"name\": \"Refer to medical records\",\n     \"text\": \"Plaintiff refers to the records and reports of plaintiff's treating health care providers, which are annexed hereto and incorporated herein by reference.\"},\n    {\"kind\": \"answer\", \"name\": \"To be supplied\",\n     \"text\": \"This information will be supplied upon receipt.\"},\n    {\"kind\": \"answer\", \"name\": \"Unknown at this time\",\n     \"text\": \"Unknown at this time. Investigation is continuing.\"},\n    {\"kind\": \"answer\", \"name\": \"Not applicable\",\n     \"text\": \"Not applicable.\"},\n    {\"kind\": \"answer\", \"name\": \"Experts to be supplied\",\n     \"text\": \"Plaintiff will supply the names, qualifications and reports of any expert witnesses in accordance with the Rules of Court and any applicable case management order.\"},\n    {\"kind\": \"objection\", \"id\": \"ten\", \"name\": \"Exceeds ten supplemental questions\",\n     \"text\": \"Plaintiff objects to this interrogatory because it exceeds the ten supplemental questions that may be served without leave of court under R. 4:17-1(b)(1).\"},\n    {\"kind\": \"objection\", \"id\": \"subparts\", \"name\": \"Contains subparts\",\n     \"text\": \"Plaintiff objects to this interrogatory because it contains subparts, and supplemental questions served without leave of court must be without subparts under R. 4:17-1(b)(1). Without waiving that objection, plaintiff answers as follows:\"},\n    {\"kind\": \"objection\", \"name\": \"Overly broad, not relevant\",\n     \"text\": \"Plaintiff objects to this interrogatory as overly broad and unduly burdensome, including as to the time period covered, and as seeking information that is not relevant to the subject matter of this action. See R. 4:10-2(a). Without waiving that objection, plaintiff answers as follows:\"},\n    {\"kind\": \"objection\", \"name\": \"Unrelated medical history\",\n     \"text\": \"Plaintiff objects to this interrogatory to the extent that it seeks medical information unrelated to the injuries claimed in this action. Without waiving that objection, plaintiff answers as follows:\"},\n    {\"kind\": \"objection\", \"name\": \"Privilege\",\n     \"text\": \"Plaintiff objects to this interrogatory to the extent that it seeks information protected by the attorney-client privilege or the work product doctrine, and asserts that claim pursuant to R. 4:10-2(e) and R. 4:17-1(b)(3). Without waiving that objection, plaintiff answers as follows:\"},\n]\n\nSUPPLEMENTAL_ANSWERS = [\n    {\"name\": \"Social media accounts\",\n     \"words\": [\"social media\", \"facebook\", \"instagram\", \"tiktok\", \"twitter\", \"snapchat\", \"linkedin\", \"youtube\"],\n     \"tpl\": \"Plaintiff objects to this interrogatory to the extent it seeks the content of, or access to, plaintiff's accounts, as overly broad and not relevant to the subject matter of this action. See R. 4:10-2(a). Without waiving that objection, plaintiff identifies the following accounts: {{client.socialMedia}}\"},\n    {\"name\": \"Phone use at the time\",\n     \"words\": [\"cell phone\", \"cellular\", \"mobile phone\", \"telephone\", \"texting\", \"text message\", \"electronic device\"],\n     \"tpl\": \"{{#if client.phoneUse == yes}}{{client.phoneDetails}}{{else}}No. Plaintiff was not using a cellular telephone or any other electronic device at the time of the accident.{{/if}}\"},\n    {\"name\": \"Prior accidents and injuries\",\n     \"words\": [\"prior accident\", \"previous accident\", \"other accident\", \"any accident\", \"prior injur\", \"previous injur\", \"injured before\", \"injured prior\"],\n     \"tpl\": \"{{client.priorAccidents}}\"},\n    {\"name\": \"Prior claims and lawsuits\",\n     \"words\": [\"lawsuit\", \"prior claim\", \"other claim\", \"any claim\", \"workers\", \"sued\"],\n     \"tpl\": \"{{client.priorClaims}}\"},\n    {\"name\": \"Alcohol, drugs or medication\",\n     \"words\": [\"alcohol\", \"alcoholic\", \"drink\", \"drug\", \"medication\", \"intoxicat\", \"marijuana\", \"cannabis\"],\n     \"tpl\": \"{{#if client.substances == yes}}{{client.substanceDetails}}{{else}}No. Plaintiff did not consume any alcoholic beverage, drug or medication in the 24 hours before the accident.{{/if}}\"},\n    {\"name\": \"Primary care physician\",\n     \"words\": [\"primary care\", \"family physician\", \"family doctor\", \"primary physician\"],\n     \"tpl\": \"{{client.pcp}}\"},\n    {\"name\": \"Pharmacies\",\n     \"words\": [\"pharmacy\", \"pharmacies\", \"prescription\"],\n     \"tpl\": \"{{client.pharmacy}}\"},\n    {\"name\": \"Health insurance and liens\",\n     \"words\": [\"health insurance\", \"health insurer\", \"medicare\", \"medicaid\", \"lien\", \"collateral\"],\n     \"tpl\": \"Health insurer: {{client.healthInsurer}}. {{#if client.medicare == yes}}Plaintiff is a Medicare beneficiary.{{else}}Plaintiff is not a Medicare beneficiary.{{/if}}{{#if calc.isAuto}} Plaintiff's accident-related medical expenses have been submitted to plaintiff's PIP carrier, {{client.insCarrier}}.{{/if}}\"},\n    {\"name\": \"Driver's license and corrective lenses\",\n     \"words\": [\"license\", \"licence\", \"corrective lens\", \"glasses\", \"eyeglasses\", \"contact lens\", \"restriction\"],\n     \"tpl\": \"{{client.licenseRestrictions}}\"},\n    {\"name\": \"Purpose and route of the trip\",\n     \"words\": [\"coming from\", \"going to\", \"destination\", \"purpose of\", \"origin\", \"where you were going\"],\n     \"tpl\": \"{{client.trip}}\"},\n    {\"name\": \"Employment history\",\n     \"words\": [\"employment history\", \"employer\", \"employers\", \"employed\", \"occupation\"],\n     \"tpl\": \"{{client.employmentHistory}}\"},\n]\n\n# Passages used inside the motion papers. The attorney checks every citation before filing.\nMOTION_CLAUSES = [\n    {\"id\": \"sj\", \"name\": \"Summary judgment standard\",\n     \"cite\": \"R. 4:46-2(c); Brill v. Guardian Life Ins. Co. of Am., 142 N.J. 520 (1995)\",\n     \"text\": \"Summary judgment may be granted only when the motion record shows no genuine issue as to any material fact challenged and the moving party is entitled to judgment as a matter of law. R. 4:46-2(c). The court must decide whether the competent evidential materials, viewed in the light most favorable to the non-moving party, would permit a rational factfinder to resolve the disputed issue in that party's favor. Brill v. Guardian Life Ins. Co. of Am., 142 N.J. 520, 540 (1995).\"},\n    {\"id\": \"verbal\", \"name\": \"Limitation-on-lawsuit threshold\",\n     \"cite\": \"N.J.S.A. 39:6A-8(a); DiProspero v. Penn, 183 N.J. 477 (2005)\",\n     \"text\": \"Where the limitation-on-lawsuit option applies, plaintiff must prove an injury that falls within one of the categories listed in N.J.S.A. 39:6A-8(a), established by objective clinical evidence. Plaintiff is not also required to prove that the injury had a serious impact on plaintiff's life. DiProspero v. Penn, 183 N.J. 477 (2005).\"},\n    {\"id\": \"rsmf\", \"name\": \"Responding statement of material facts\", \"cite\": \"R. 4:46-2(b)\",\n     \"text\": \"Pursuant to R. 4:46-2(b), plaintiff has responded to each paragraph of the movant's statement of material facts, admitting or disputing it with citations to the motion record, and has set forth additional material facts that are in dispute.\"},\n    {\"id\": \"cured\", \"name\": \"Discovery served after a R. 4:23-5 motion\", \"cite\": \"R. 4:23-5(a)(1)\",\n     \"text\": \"The dismissal procedure of R. 4:23-5(a)(1) exists to secure discovery. Because plaintiff has now served the discovery in question, that purpose has been met and dismissal is unwarranted.\"},\n    {\"id\": \"goodfaith\", \"name\": \"Good-faith attempt to resolve\", \"cite\": \"R. 1:6-2(c)\",\n     \"text\": \"In compliance with R. 1:6-2(c), counsel advised the opposing attorney by letter, after the default occurred, that continued non-compliance with the discovery obligation would result in a motion without further attempt to resolve the matter.\"},\n    {\"id\": \"ext\", \"name\": \"Extension of discovery\", \"cite\": \"R. 4:24-1(c)\",\n     \"text\": \"Under R. 4:24-1(c), the discovery period may be extended on motion for good cause shown. Where an arbitration or trial date has been fixed, the movant must show exceptional circumstances.\"},\n]\n\nCERT_ENDING = (\"I certify that the foregoing statements made by me are true. I am aware that if any of the foregoing \"\n               \"statements made by me are willfully false, I am subject to punishment.\")\n", "motions.py": "\"\"\"Routine motion papers built from the matter.\n\nEach motion lists the details staff fill in, the papers in the packet, and the\ndocuments the tool can draft. Places where the attorney has to write argument\nare marked [ATTORNEY: ...] in the text.\n\nTemplate text uses the same codes as the answer templates, plus {{m.field}}\nfor this motion's details and {{clause.id}} for a passage from\nstandard_text.MOTION_CLAUSES.\n\"\"\"\n\nimport dates\nfrom standard_text import CERT_ENDING\n\n\ndef first_defendant(matter):\n    lines = [s.strip() for s in (matter.get(\"caption\", {}).get(\"defendants\") or \"\").split(\"\\n\") if s.strip()]\n    return lines[0] if lines else \"\"\n\n\nSERVICE_CERT = {\n    \"id\": \"svc\", \"title\": \"Certification of service\", \"heading\": \"CERTIFICATION OF SERVICE\", \"sig\": \"cert\",\n    \"tpl\": \"{{firm.attorney}}, of full age, hereby certifies as follows:\\n\\n\"\n           \"1. I am an attorney with {{firm.name}}, attorneys for plaintiff in this matter.\\n\\n\"\n           \"2. On {{m.serviceDate|date}}, I caused the foregoing papers to be filed with the Clerk of the Superior \"\n           \"Court, Law Division, {{caption.county}} County, through the Judiciary's eCourts system, which provides \"\n           \"electronic service upon all counsel of record.\\n\\n\" + CERT_ENDING,\n}\n\nNOTICE_ENDING = (\n    \"PLEASE TAKE FURTHER NOTICE that plaintiff shall rely upon the Certification of Counsel submitted herewith. \"\n    \"A proposed form of Order is also submitted.\\n\\n\"\n    \"PLEASE TAKE FURTHER NOTICE that plaintiff requests oral argument only if timely opposition is filed.\"\n)\n\nMOTIONS = [\n    {\n        \"id\": \"opp4235\", \"title\": \"Motion to dismiss for unanswered Form A\", \"rule\": \"R. 4:23-5(a)(1)\",\n        \"ours\": False, \"opp_days\": 8, \"opp_rule\": \"R. 1:6-3(a)\",\n        \"summary\": \"Defense moved to dismiss because the Form A answers were late. Once the answers are served, \"\n                   \"this opposition shows the motion is moot.\",\n        \"fields\": [\n            {\"k\": \"movant\", \"l\": \"Moving defendant\"},\n            {\"k\": \"defCounsel\", \"l\": \"Movant's counsel (firm)\"},\n            {\"k\": \"judge\", \"l\": \"Motion judge (last name)\"},\n            {\"k\": \"returnDate\", \"l\": \"Return date\", \"t\": \"date\"},\n            {\"k\": \"answersServed\", \"l\": \"Date Form A answers were served\", \"t\": \"date\",\n             \"h\": \"Filled in from the Finish screen once recorded there\"},\n            {\"k\": \"hipaa\", \"l\": \"HIPAA authorizations served with them?\", \"t\": \"yn\"},\n            {\"k\": \"withdrawRequest\", \"l\": \"Date you asked defense to withdraw\", \"t\": \"date\", \"h\": \"Optional\"},\n            {\"k\": \"serviceDate\", \"l\": \"Date this opposition is filed\", \"t\": \"date\"},\n        ],\n        \"defaults\": lambda m: {\"movant\": first_defendant(m), \"answersServed\": m.get(\"served\", {}).get(\"date\", \"\"),\n                               \"hipaa\": \"yes\"},\n        \"packet\": [\"Certification of counsel in opposition\",\n                   \"Exhibit A: transmittal letter serving the Form A answers\",\n                   \"Certification of service\"],\n        \"docs\": [\n            {\"id\": \"cert\", \"title\": \"Certification in opposition\",\n             \"heading\": \"CERTIFICATION OF COUNSEL IN OPPOSITION TO MOTION TO DISMISS\", \"sig\": \"cert\",\n             \"tpl\": \"{{firm.attorney}}, of full age, hereby certifies as follows:\\n\\n\"\n                    \"1. I am an attorney at law of the State of New Jersey and a member of {{firm.name}}, attorneys for \"\n                    \"plaintiff {{caption.plaintiff}}. I am familiar with the facts set forth herein, and I submit this \"\n                    \"certification in opposition to the motion of defendant {{m.movant}} to dismiss plaintiff's \"\n                    \"Complaint without prejudice pursuant to R. 4:23-5(a)(1), returnable {{m.returnDate|date}}.\\n\\n\"\n                    \"2. Defendant served an Answer to the Complaint on {{caption.answerServed|date}}. Pursuant to \"\n                    \"R. 4:17-1(b)(2), plaintiff was deemed served with Form A Uniform Interrogatories on that date.\\n\\n\"\n                    \"3. On {{m.answersServed|date}}, plaintiff served certified answers to Form A Uniform \"\n                    \"Interrogatories upon all counsel{{#if m.hipaa == yes}}, together with executed HIPAA \"\n                    \"authorizations for each health care provider identified in the answers, as required by \"\n                    \"R. 4:17-4{{/if}}. A true copy of the transmittal letter is annexed hereto as Exhibit A.\"\n                    \"{{#if m.withdrawRequest}}\\n\\n4. By letter dated {{m.withdrawRequest|date}}, I asked counsel for \"\n                    \"defendant to withdraw the motion in light of plaintiff's service of the answers. As of this date, \"\n                    \"the motion has not been withdrawn.{{/if}}\\n\\n\"\n                    \"{{calc.pn}}. {{clause.cured}} Plaintiff therefore respectfully submits that the motion is moot \"\n                    \"and should be denied.\\n\\n\" + CERT_ENDING},\n            SERVICE_CERT,\n        ],\n    },\n    {\n        \"id\": \"mov4235\", \"title\": \"Motion to suppress defendant's Answer\", \"rule\": \"R. 4:23-5(a)(1)\",\n        \"ours\": True, \"file_days\": 16, \"file_rule\": \"R. 1:6-3(a)\", \"opp_days\": 8,\n        \"summary\": \"Defendant has not answered the Form C uniform interrogatories. Asks the court to suppress the \"\n                   \"Answer without prejudice.\",\n        \"fields\": [\n            {\"k\": \"target\", \"l\": \"Delinquent defendant\"},\n            {\"k\": \"defCounsel\", \"l\": \"Defendant's counsel (firm)\"},\n            {\"k\": \"judge\", \"l\": \"Motion judge (last name)\"},\n            {\"k\": \"returnDate\", \"l\": \"Return date\", \"t\": \"date\"},\n            {\"k\": \"defAnswerServed\", \"l\": \"Date that defendant's Answer was served\", \"t\": \"date\"},\n            {\"k\": \"deficiencyDate\", \"l\": \"Date of your deficiency letter\", \"t\": \"date\",\n             \"h\": \"Required before filing. R. 1:6-2(c).\"},\n            {\"k\": \"serviceDate\", \"l\": \"Date this motion is filed\", \"t\": \"date\"},\n        ],\n        \"defaults\": lambda m: {\"target\": first_defendant(m),\n                               \"defAnswerServed\": m.get(\"caption\", {}).get(\"answerServed\", \"\")},\n        \"packet\": [\"Notice of motion\",\n                   \"Certification of counsel, with R. 1:6-2(c) and R. 4:23-5(a)(3) statements\",\n                   \"Exhibit A: deficiency letter\",\n                   \"Proposed form of order\",\n                   \"Certification of service\"],\n        \"docs\": [\n            {\"id\": \"notice\", \"title\": \"Notice of motion\",\n             \"heading\": \"NOTICE OF MOTION TO SUPPRESS DEFENDANT'S ANSWER WITHOUT PREJUDICE\", \"sig\": \"attorney\",\n             \"tpl\": \"| TO: {{m.defCounsel}}\\n| Attorneys for Defendant {{m.target}}\\n\\n\"\n                    \"PLEASE TAKE NOTICE that on {{m.returnDate|date}}, at 9:00 a.m. or as soon thereafter as counsel \"\n                    \"may be heard, the undersigned, attorneys for plaintiff, shall move before the Honorable \"\n                    \"{{m.judge}}, J.S.C., Superior Court of New Jersey, Law Division, {{caption.county}} County, for an \"\n                    \"Order suppressing the Answer of defendant {{m.target}} without prejudice pursuant to \"\n                    \"R. 4:23-5(a)(1), for failure to serve answers to the applicable Form C Uniform Interrogatories.\"\n                    \"\\n\\n\" + NOTICE_ENDING},\n            {\"id\": \"cert\", \"title\": \"Certification\", \"heading\": \"CERTIFICATION OF COUNSEL IN SUPPORT OF MOTION\",\n             \"sig\": \"cert\",\n             \"tpl\": \"{{firm.attorney}}, of full age, hereby certifies as follows:\\n\\n\"\n                    \"1. I am an attorney at law of the State of New Jersey and a member of {{firm.name}}, attorneys for \"\n                    \"plaintiff {{caption.plaintiff}}. I submit this certification in support of plaintiff's motion to \"\n                    \"suppress the Answer of defendant {{m.target}} without prejudice pursuant to R. 4:23-5(a)(1).\\n\\n\"\n                    \"2. Defendant {{m.target}} served an Answer to the Complaint on {{m.defAnswerServed|date}}. \"\n                    \"Pursuant to R. 4:17-1(b)(2), defendant was required to serve answers to the appropriate Form C \"\n                    \"Uniform Interrogatories within 60 days thereafter, that is, by {{calc.formCDue|date}}.\\n\\n\"\n                    \"3. On {{m.deficiencyDate|date}}, after the answers became overdue, I advised counsel for \"\n                    \"defendant by letter that continued non-compliance with this discovery obligation would result in \"\n                    \"this motion. A true copy of that letter is annexed hereto as Exhibit A. This statement is made in \"\n                    \"compliance with R. 1:6-2(c).\\n\\n\"\n                    \"4. Plaintiff is not in default of any discovery obligation owed to defendant {{m.target}}. \"\n                    \"Plaintiff served answers to Form A Uniform Interrogatories on {{served.date|date}}. This statement \"\n                    \"is made in accordance with R. 4:23-5(a)(3).\\n\\n\"\n                    \"5. As of the date of this certification, defendant has not served answers to the Form C Uniform \"\n                    \"Interrogatories and has not moved for an extension of time or a protective order.\\n\\n\"\n                    \"6. Plaintiff therefore respectfully requests that the Court enter the proposed form of Order \"\n                    \"submitted herewith.\\n\\n\" + CERT_ENDING},\n            {\"id\": \"order\", \"title\": \"Proposed order\", \"heading\": \"ORDER\", \"sig\": \"order\",\n             \"tpl\": \"THIS MATTER having been opened to the Court by {{firm.name}}, attorneys for plaintiff \"\n                    \"{{caption.plaintiff}}, on notice to {{m.defCounsel}}, attorneys for defendant {{m.target}}, and \"\n                    \"the Court having considered the papers submitted, and for good cause shown;\\n\\n\"\n                    \"IT IS on this ______ day of ____________________, 20____, ORDERED that the Answer of defendant \"\n                    \"{{m.target}} is hereby SUPPRESSED WITHOUT PREJUDICE pursuant to R. 4:23-5(a)(1); and\\n\\n\"\n                    \"IT IS FURTHER ORDERED that a copy of this Order shall be served upon all counsel of record within \"\n                    \"______ days of the date hereof.\"},\n            SERVICE_CERT,\n        ],\n    },\n    {\n        \"id\": \"oppSJ\", \"title\": \"Motion for summary judgment\", \"rule\": \"R. 4:46-2\",\n        \"ours\": False, \"opp_days\": 10, \"opp_rule\": \"R. 4:46-1\",\n        \"summary\": \"Assembles the brief outline and the responding statement of material facts. The argument itself \"\n                   \"is marked for the attorney.\",\n        \"fields\": [\n            {\"k\": \"movant\", \"l\": \"Moving defendant\"},\n            {\"k\": \"judge\", \"l\": \"Motion judge (last name)\"},\n            {\"k\": \"returnDate\", \"l\": \"Return date\", \"t\": \"date\"},\n            {\"k\": \"ground\", \"l\": \"Ground of the motion\", \"t\": \"select\",\n             \"o\": [(\"threshold\", \"Verbal threshold (permanency)\"), (\"liability\", \"Liability\"), (\"other\", \"Other\")]},\n            {\"k\": \"paraCount\", \"l\": \"Paragraphs in movant's statement of facts\", \"t\": \"number\"},\n            {\"k\": \"serviceDate\", \"l\": \"Date the opposition is filed\", \"t\": \"date\"},\n        ],\n        \"defaults\": lambda m: {\"movant\": first_defendant(m), \"paraCount\": \"6\",\n                               \"ground\": \"threshold\" if m.get(\"attorney\", {}).get(\"threshold\") == \"limitation\" else \"\"},\n        \"packet\": [\"Brief in opposition\",\n                   \"Responding statement of material facts, R. 4:46-2(b)\",\n                   \"Certification of counsel attaching the record\",\n                   \"Certification of service\"],\n        \"docs\": [\n            {\"id\": \"brief\", \"title\": \"Brief outline\",\n             \"heading\": \"BRIEF ON BEHALF OF PLAINTIFF IN OPPOSITION TO DEFENDANT'S MOTION FOR SUMMARY JUDGMENT\",\n             \"sig\": \"attorney\",\n             \"tpl\": \"## PRELIMINARY STATEMENT

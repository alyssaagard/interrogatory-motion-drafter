utton>'\n    if next_step and not back:\n        buttons += (f'\u003cbutton class=\"btn\" name=\"action\" value=\"next\">Save and continue to '\n                    f'{esc(STEP_TITLES[next_step])}\u003c/button>')\n    out.append(f'\u003cdiv class=\"save-bar\">{buttons}\u003c/div>\u003c/form>')\n    if step == \"matter\":\n        out.append(f'\u003csection class=\"panel\" style=\"margin-top:28px\">\u003cheader>\u003ch2>Delete this matter\u003c/h2>'\n                   f'\u003cp class=\"note\">The record is moved to the deleted folder, not erased.\u003c/p>\u003c/header>'\n                   f'\u003cdiv class=\"panel-body\">\u003cform method=\"post\" action=\"/m/{matter[\"id\"]}/delete\" class=\"row\">'\n                   f'\u003clabel class=\"row\">\u003cinput type=\"checkbox\" name=\"confirm\" value=\"yes\"> Yes, delete this matter\u003c/label>'\n                   f'\u003cbutton class=\"btn danger\">Delete\u003c/button>\u003c/form>\u003c/div>\u003c/section>')\n    return \"\".join(out)\n\n\n# ---------------------------------------------------------------- Form A answers\n\nFILTERS = [(\"all\", \"All\"), (\"missing\", \"Needs information\"), (\"paralegal\", \"Awaiting paralegal\"),\n           (\"attorney\", \"Awaiting attorney\")]\n\n\ndef in_filter(answer, show):\n    s = answer[\"status\"]\n    if show == \"missing\":\n        return s == \"missing\"\n    if show == \"paralegal\":\n        return s in (\"draft\", \"edited\", \"recheck\")\n    if show == \"attorney\":\n        return s == \"checked\"\n    return True\n\n\ndef answers_page(matter, answers, current, show, settings, clauses):\n    base = f\"/m/{matter['id']}\"\n    count = lambda *names: sum(1 for a in answers if a[\"status\"] in names)\n    counts = (f'\u003cdiv class=\"counts\">\u003cspan class=\"count-green\">\u003cb>{count(\"approved\")}\u003c/b> approved\u003c/span>'\n              f'\u003cspan class=\"count-blue\">\u003cb>{count(\"checked\")}\u003c/b> awaiting attorney\u003c/span>'\n              f'\u003cspan>\u003cb>{count(\"draft\", \"edited\")}\u003c/b> awaiting paralegal\u003c/span>'\n              f'\u003cspan class=\"count-amber\">\u003cb>{count(\"recheck\")}\u003c/b> need recheck\u003c/span>'\n              f'\u003cspan class=\"count-red\">\u003cb>{count(\"missing\")}\u003c/b> need information\u003c/span>\u003c/div>')\n    filters = \"\".join(f'\u003ca class=\"{\"on\" if show == key else \"\"}\" href=\"{base}/answers/{current[\"n\"]}?show={key}&amp;jump=1\">{label}\u003c/a>'\n                      for key, label in FILTERS)\n    rows = []\n    for a in answers:\n        if not in_filter(a, show):\n            continue\n        rows.append(f'\u003ctr class=\"{\"sel\" if a[\"n\"] == current[\"n\"] else \"\"}\">\u003ctd>{a[\"n\"]}\u003c/td>'\n                    f'\u003ctd>\u003ca href=\"{base}/answers/{a[\"n\"]}?show={show}\">{esc(a[\"q\"][\"subject\"])}\u003c/a>\u003c/td>'\n                    f'\u003ctd>{pill(a[\"status\"], short=True)}\u003c/td>\u003c/tr>')\n    table = \"\".join(rows) or '\u003ctr>\u003ctd>\u003c/td>\u003ctd class=\"muted\">No questions match.\u003c/td>\u003ctd>\u003c/td>\u003c/tr>'\n    index = (f'\u003csection class=\"panel index\">{counts}\u003cdiv class=\"filters\">{filters}\u003c/div>'\n             f'\u003cdiv class=\"qlist\">\u003ctable class=\"qtable\">\u003ctbody>{table}\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>')\n    return (page_head(\"Form A answers\", STEPS[5][2], 6)\n            + f'\u003cdiv class=\"review\">{index}{answer_detail(matter, answers, current, show, settings, clauses)}\u003c/div>')\n\n\ndef neighbours(answers, current, show):\n    visible = [a for a in answers if in_filter(a, show) or a[\"n\"] == current[\"n\"]]\n    numbers = [a[\"n\"] for a in visible]\n    i = numbers.index(current[\"n\"])\n    return (numbers[i - 1] if i > 0 else None), (numbers[i + 1] if i + 1 \u003c len(numbers) else None)\n\n\ndef missing_list(matter, missing, back):\n    items = []\n    for m in missing:\n        step = m.get(\"step\")\n        if step in INTAKE_STEPS or step == \"finish\":\n            href = f'/m/{matter[\"id\"]}/{step}?back={quote(back)}#at-{field_id(m[\"path\"])}'\n            items.append(f'\u003cli>{esc(m[\"label\"])}: \u003ca href=\"{esc(href)}\">fill in on {STEP_TITLES.get(step, step)}\u003c/a>\u003c/li>')\n        else:\n            items.append(f\"\u003cli>{esc(m['label'])}\u003c/li>\")\n    return (f'\u003cdiv class=\"needs\">\u003cb>{len(missing)} item{\"\" if len(missing) == 1 else \"s\"} needed before this '\n            f'answer is complete\u003c/b>\u003cul>{\"\".join(items)}\u003c/ul>\u003c/div>')\n\n\ndef clause_options(clauses):\n    groups = []\n    for kind, label in ((\"answer\", \"Standard language\"), (\"objection\", \"Objections\")):\n        opts = \"\".join(f'\u003coption value=\"{i}\">{esc(c[\"name\"])}\u003c/option>' for i, c in enumerate(clauses) if c.get(\"kind\") == kind)\n        if opts:\n            groups.append(f'\u003coptgroup label=\"{label}\">{opts}\u003c/optgroup>')\n    return \"\".join(groups)\n\n\ndef signoff_controls(item, settings, prefix=\"\"):\n    \"\"\"Buttons for the two-step sign-off. prefix is added to action names (used by supplemental items).\"\"\"\n    who = esc(settings.get(\"paralegal\") or \"paralegal\")\n    if item[\"missing_count\"]:\n        return '\u003cspan class=\"muted\">Fill in the missing items before signing off.\u003c/span>'\n    if item[\"atty_ok\"]:\n        return (f'\u003cspan class=\"who\">{pill(\"approved\")}\u003c/span>'\n                f'\u003cbutton class=\"btn small quiet\" name=\"action\" value=\"{prefix}unapprove\">Undo approval\u003c/button>')\n    if item[\"para_ok\"]:\n        return (f'\u003cspan class=\"who\">{pill(\"checked\")}\u003c/span>'\n                f'\u003cspan class=\"row\">\u003cbutton class=\"btn small quiet\" name=\"action\" value=\"{prefix}uncheck\">Undo check\u003c/button>'\n                f'\u003cbutton class=\"btn approve\" name=\"action\" value=\"{prefix}approve\">Approve as attorney\u003c/button>\u003c/span>')\n    return f'\u003cbutton class=\"btn check\" name=\"action\" value=\"{prefix}check\">Mark as checked by {who}\u003c/button>'\n\n\ndef answer_detail(matter, answers, a, show, settings, clauses):\n    base = f\"/m/{matter['id']}\"\n    here = f\"{base}/answers/{a['n']}?show={show}\"\n    prev_n, next_n = neighbours(answers, a, show)\n    banners = \"\"\n    if a[\"stale\"]:\n        banners += ('\u003cdiv class=\"callout amber row between\">\u003cspan>The intake behind this answer changed after the '\n                    'wording was edited.\u003c/span>\u003cspan class=\"row\">'\n                    '\u003cbutton class=\"btn small\" name=\"action\" value=\"revert\">Use the new automatic draft\u003c/button>'\n                    '\u003cbutton class=\"btn small quiet\" name=\"action\" value=\"keep\">Keep the edited wording\u003c/button>\u003c/span>\u003c/div>')\n    if a[\"status\"] == \"recheck\":\n        banners += ('\u003cdiv class=\"callout amber\">This answer changed after it was signed off. '\n                    'It needs to be checked again.\u003c/div>')\n    source = f'\u003cp class=\"source-line\">Source designation under R. 4:17-4(a): {marked(a[\"source_line\"])}\u003c/p>' if a[\"source_line\"] else \"\"\n    needs = missing_list(matter, a[\"missing\"], here) if a[\"missing\"] else \"\"\n    revert = ('\u003cbutton class=\"btn small quiet\" name=\"action\" value=\"revert\">Return to the automatic draft\u003c/button>'\n              if a[\"edited\"] else \"\")\n    nav = (f'\u003ca class=\"btn small quiet\" href=\"{base}/answers/{prev_n}?show={show}\">Previous\u003c/a>' if prev_n else \"\")\n    nav += (f'\u003ca class=\"btn small\" href=\"{base}/answers/{next_n}?show={show}\">Next\u003c/a>' if next_n else \"\")\n    auto_note = \"Edited by staff\" if a[\"edited\"] else \"Drafted from the intake screens\"\n    return f\"\"\"\u003csection class=\"panel\">\n\u003cform method=\"post\" action=\"{here}\">{ENTER_SAVES}\n\u003cdiv class=\"qhead\">\u003cdiv>\u003ch2>Interrogatory No. {a['n']}\u003c/h2>\n\u003cdiv class=\"qsrc\">{esc(a['q']['subject'])}{', automobile cases only' if a['n'] >= 25 else ''}. Source: {', '.join(SOURCES[s] for s in a['q']['src'])}.\u003c/div>\u003c/div>\n{pill(a['status'])}\u003c/div>\n\u003cdiv class=\"question\">\u003cspan class=\"label\">Question as served\u003c/span>{esc(a['q']['text']).replace(chr(10), '\u003cbr>')}\u003c/div>\n\u003cdiv class=\"panel-body\">\n{banners}\n\u003cspan class=\"label-line\">Answer \u003cspan style=\"text-transform:none;letter-spacing:0\">({auto_note})\u003c/span>\u003c/span>\n\u003cdiv class=\"answer-box\">{marked(a['final'])}\u003c/div>\n{source}\n{needs}\n\u003cdetails class=\"edit\">\u003csummary>Edit the wording\u003c/summary>\n\u003ctextarea name=\"text\" aria-label=\"Answer wording\">{esc(a['final'])}\u003c/textarea>\n\u003cdiv class=\"row\" style=\"margin-top:8px\">\u003cbutton class=\"btn primary small\" name=\"action\" value=\"save\">Save wording\u003c/button>{revert}\u003c/div>\n\u003c/details>\n\u003cdiv class=\"row\" style=\"margin-top:14px\">\u003clabel for=\"clause\" class=\"muted small\">Insert\u003c/label>\n\u003cselect id=\"clause\" name=\"clause\" style=\"width:auto;max-width:100%\">{clause_options(clauses)}\u003c/select>\n\u003cbutton class=\"btn small\" name=\"action\" value=\"insert\">Insert\u003c/button>\u003c/div>\n\u003cdiv class=\"field\" style=\"margin-top:16px;max-width:86ch\">\u003clabel for=\"note\">Internal note (not printed)\u003c/label>\n\u003ctextarea id=\"note\" name=\"note\" rows=\"2\" placeholder=\"Questions for the attorney, follow-ups with the client\">{esc(a['saved'].get('note', ''))}\u003c/textarea>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"signoff\">\u003cdiv class=\"row\">{nav}\u003c/div>\u003cdiv class=\"who\">{signoff_controls(a, settings)}\u003c/div>\u003c/div>\n\u003c/form>\u003c/section>\"\"\"\n\n\n# ---------------------------------------------------------------- supplemental questions\n\ndef supplemental_page(matter, items, settings, lib):\n    base = f\"/m/{matter['id']}\"\n    objections = \"\".join(f'\u003coption value=\"{i}\">{esc(c[\"name\"])}\u003c/option>'\n                         for i, c in enumerate(lib[\"clauses\"]) if c.get(\"kind\") == \"objection\")\n    standard = \"\".join(f'\u003coption value=\"{k}\">{esc(e[\"name\"])}\u003c/option>' for k, e in enumerate(lib[\"supplemental\"]))\n    parts = [page_head(\"Supplemental questions\", STEPS[6][2], 7),\n             '\u003cdiv class=\"callout\">Under R. 4:17-1(b)(1), each party may serve ten supplemental questions, without '\n             'subparts, without leave of court. Questions past the tenth, and questions that appear to have subparts, '\n             'are flagged with the matching objection. Standard answers fill in from the Client screen.\u003c/div>',\n             f'\u003cform method=\"post\" action=\"{base}/supplemental\">{ENTER_SAVES}',\n             '\u003csection class=\"panel\">\u003cheader>\u003ch2>Add questions\u003c/h2>\u003cp class=\"note\">Paste the questions as served. '\n             'Numbered questions are split automatically.\u003c/p>\u003c/header>\u003cdiv class=\"panel-body\">'\n             '\u003cdiv class=\"field\">\u003clabel for=\"paste\">Questions to add\u003c/label>'\n             '\u003ctextarea id=\"paste\" name=\"paste\" rows=\"4\" placeholder=\"1. State whether...\">\u003c/textarea>\u003c/div>'\n             '\u003cdiv class=\"row\" style=\"margin-top:10px\">\u003cbutton class=\"btn primary\" name=\"action\" value=\"add_pasted\">'\n             'Add these questions\u003c/button>\u003cbutton class=\"btn\" name=\"action\" value=\"add_blank\">Add one blank question'\n             '\u003c/button>\u003c/div>\u003c/div>\u003c/section>']\n    if items:\n        approved = sum(1 for s in items if s[\"status\"] == \"approved\")\n        blank = sum(1 for s in items if s[\"status\"] == \"blank\")\n        parts.append(f'\u003cp class=\"muted\">{len(items)} question{\"\" if len(items) == 1 else \"s\"}: '\n                     f'{approved} approved, {blank} not yet answered.\u003c/p>')\n    for s in items:\n        i = s[\"i\"]\n        flags = \"\"\n        if s[\"too_many\"]:\n            flags += (f'\u003cdiv class=\"callout amber row between\">\u003cspan>This is question {s[\"n\"]}. Only ten may be '\n                      f'served without leave of court.\u003c/span>\u003cbutton class=\"btn small\" name=\"action\" '\n                      f'value=\"object:{i}:ten\">Insert objection\u003c/button>\u003c/div>')\n        if s[\"subparts\"]:\n            flags += (f'\u003cdiv class=\"callout amber row between\">\u003cspan>This question appears to contain subparts.'\n                      f'\u003c/span>\u003cbutton class=\"btn small\" name=\"action\" value=\"object:{i}:subparts\">Insert objection'\n                      f'\u003c/button>\u003c/div>')\n        suggestions = \"\".join(f'\u003cbutton class=\"btn small\" name=\"action\" value=\"use:{i}:{g[\"k\"]}\">{esc(g[\"name\"])}\u003c/button>'\n                              for g in s[\"suggestions\"]) or '\u003cspan class=\"muted\">none matched\u003c/span>'\n        here = f\"{base}/supplemental#s-{i}\"\n        needs = missing_list(matter, s[\"missing\"], here) if s[\"missing\"] else \"\"\n        parts.append(f\"\"\"\u003csection class=\"panel\" id=\"s-{i}\">\u003cheader class=\"row between\">\u003ch2>Supplemental Interrogatory No. {s['n']}\u003c/h2>{pill(s['status'])}\u003c/header>\n\u003cdiv class=\"panel-body\">\n{flags}\n\u003cdiv class=\"field\">\u003clabel for=\"q-{i}\">Question as served\u003c/label>\u003ctextarea id=\"q-{i}\" name=\"q-{i}\" rows=\"2\">{esc(s['q'])}\u003c/textarea>\u003c/div>\n\u003cdiv class=\"row\" style=\"margin-top:10px\">\u003cspan class=\"muted small\">Standard answers that may fit:\u003c/span>{suggestions}\u003c/div>\n\u003cdiv class=\"row\" style=\"margin-top:8px\">\n\u003cselect name=\"pick-{i}\" aria-label=\"Other standard answers\" style=\"width:auto;max-width:100%\">\u003coption value=\"\">Other standard answers\u003c/option>{standard}\u003c/select>\n\u003cbutton class=\"btn small\" name=\"action\" value=\"pick:{i}\">Use\u003c/button>\n\u003cselect name=\"objection-{i}\" aria-label=\"Objections\" style=\"width:auto;max-width:100%\">\u003coption value=\"\">Objections\u003c/option>{objections}\u003c/select>\n\u003cbutton class=\"btn small\" name=\"action\" value=\"objection:{i}\">Add\u003c/button>\u003c/div>\n\u003cdiv class=\"field\" style=\"margin-top:12px\">\u003clabel for=\"a-{i}\">Answer\u003c/label>\u003ctextarea id=\"a-{i}\" name=\"a-{i}\" rows=\"5\">{esc(s['a'])}\u003c/textarea>\u003c/div>\n{needs}\n\u003c/div>\n\u003cdiv class=\"signoff\">\u003cbutton class=\"btn small quiet danger\" name=\"action\" value=\"remove:{i}\">Remove question\u003c/button>\n\u003cdiv class=\"row\">\u003cbutton class=\"btn small\" name=\"action\" value=\"save\">Save\u003c/button>{signoff_controls(s, settings, prefix=f\"{i}:\")}\u003c/div>\u003c/div>\n\u003c/section>\"\"\")\n    parts.append(f'\u003cdiv class=\"save-bar\">\u003cbutton class=\"btn primary\" name=\"action\" value=\"save\">Save\u003c/button>'\n                 f'\u003ca class=\"btn\" href=\"{base}/finish\">Continue to Finish and serve\u003c/a>\u003c/div>\u003c/form>')\n    return \"\".join(parts)\n\n\n# ---------------------------------------------------------------- finish and serve\n\ndef date_row(label, note, value, done=\"\"):\n    if not value:\n        return f'\u003ctr>\u003cth>{label}\u003csmall>{note}\u003c/small>\u003c/th>\u003ctd class=\"muted\">Enter dates on the Matter screen\u003c/td>\u003c/tr>'\n    left = dates.days_until(value)\n    if done:\n        when = f'\u003csmall class=\"green-text\">{esc(done)}\u003c/small>'\n    elif left \u003c 0:\n        when = f'\u003csmall class=\"red-text\">{-left} day{\"\" if left == -1 else \"s\"} ago\u003c/small>'\n    elif left \u003c= 7:\n        when = f'\u003csmall class=\"amber-text\">{\"Today\" if left == 0 else f\"In {left} day\" + (\"\" if left == 1 else \"s\")}\u003c/small>'\n    else:\n        when = f\"\u003csmall>In {left} days\u003c/small>\"\n    return f\"\u003ctr>\u003cth>{label}\u003csmall>{note}\u003c/small>\u003c/th>\u003ctd>{dates.with_weekday(value)}{when}\u003c/td>\u003c/tr>\"\n\n\ndef finish_page(matter, settings, calc, answers, items, document_html):\n    base = f\"/m/{matter['id']}\"\n    cap = matter.get(\"caption\", {})\n    served = matter.get(\"served\", {}).get(\"date\", \"\")\n    checklist = matter.get(\"checklist\", {})\n    missing = sum(a[\"missing_count\"] for a in answers) + sum(s[\"missing_count\"] for s in items)\n    everything = answers + items\n    approved = sum(1 for x in everything if x[\"status\"] == \"approved\")\n    await_para = sum(1 for x in everything if x[\"status\"] in (\"draft\", \"edited\", \"recheck\"))\n    await_atty = sum(1 for x in everything if x[\"status\"] == \"checked\")\n    attachments = calc[\"attachments\"]\n    hipaa = calc[\"hipaa\"]\n    att_done = sum(1 for key, _, _ in attachments if checklist.get(\"att:\" + key))\n    hipaa_done = sum(1 for p in hipaa if checklist.get(\"hipaa:\" + p[\"name\"]))\n    ready = not missing and approved == len(everything) and att_done == len(attachments) and hipaa_done == len(hipaa)\n\n    rolled = calc.get(\"dueRaw\") and calc.get(\"due\") != calc.get(\"dueRaw\")\n    due_note = \"30 days, R. 4:17-1(b)(2).\"\n    if rolled:\n        due_note += f\" Day 30 ({dates.short_date(calc['dueRaw'])}) is a weekend, so it moves to the next business day, R. 1:3-1.\"\n    rows = [f'\u003ctr>\u003cth>Defendant\\'s Answer served\u003csmall>Form A is deemed served on plaintiff that day\u003c/small>\u003c/th>'\n            f'\u003ctd>{dates.with_weekday(cap.get(\"answerServed\")) or \"\u003cspan class=muted>Not entered\u003c/span>\"}\u003c/td>\u003c/tr>',\n            date_row(\"Form A answers due\", due_note, calc.get(\"due\"), f\"Served {dates.long_date(served)}\" if served else \"\")]\n    if calc[\"isAuto\"] and matter.get(\"attorney\", {}).get(\"threshold\") == \"limitation\":\n        rows.append(date_row(\"Physician certification of permanency\", \"60 days after the Answer, N.J.S.A. 39:6A-8(a)\",\n                             calc.get(\"thresholdDue\")))\n    if calc.get(\"amendBy\"):\n        rows.append(date_row(\"Last day to serve amended answers\", \"20 days before discovery ends, R. 4:17-7\",\n                             calc[\"amendBy\"]))\n\n    def line(number, text, css, link=\"\"):\n        return f'\u003cdiv class=\"row between\" style=\"padding:5px 0\">\u003cspan>\u003cb class=\"{css}\">{number}\u003c/b> {text}\u003c/span>{link}\u003c/div>'\n\n    readiness = \"\".join([\n        line(approved, f\"of {len(everything)} answers approved by the attorney\", \"green-text\"),\n        line(missing, \"items still missing\", \"red-text\" if missing else \"\",\n             f'\u003ca class=\"btn small\" href=\"{base}/answers/1?show=missing&amp;jump=1\">Show\u003c/a>' if missing else \"\"),\n        line(await_para, \"awaiting paralegal check\", \"\", f'\u003ca class=\"btn small\" href=\"{base}/answers/1?show=paralegal&amp;jump=1\">Review\u003c/a>' if await_para else \"\"),\n        line(await_atty, \"awaiting attorney approval\", \"\", f'\u003ca class=\"btn small\" href=\"{base}/answers/1?show=attorney&amp;jump=1\">Review\u003c/a>' if await_atty else \"\"),\n        line(att_done, f\"of {len(attachments)} attachments gathered\", \"\"),\n        line(hipaa_done, f\"of {len(hipaa)} HIPAA authorizations signed\", \"\"),\n    ])\n    if ready:\n        readiness += '\u003cdiv class=\"callout green\" style=\"margin:10px 0 0\">Everything is in place. Serve the answers with the attachments and HIPAA authorizations, then record the date served.\u003c/div>'\n\n    att_list = \"\".join(f'\u003cli>\u003cinput type=\"checkbox\" id=\"att-{key}\" name=\"att:{esc(key)}\"{\" checked\" if checklist.get(\"att:\" + key) else \"\"}>'\n                       f'\u003clabel for=\"att-{key}\">{esc(label)}\u003csmall>{esc(where)}\u003c/small>\u003c/label>\u003c/li>'\n                       for key, label, where in attachments)\n    hipaa_list = \"\".join(f'\u003cli>\u003cinput type=\"checkbox\" id=\"hipaa-{n}\" name=\"hipaa:{esc(p[\"name\"])}\"{\" checked\" if checklist.get(\"hipaa:\" + p[\"name\"]) else \"\"}>'\n                         f'\u003clabel for=\"hipaa-{n}\">{esc(p[\"name\"])}\u003csmall>{esc(p.get(\"address\", \"\"))}\u003c/small>\u003c/label>\u003c/li>'\n                         for n, p in enumerate(hipaa)) or '\u003cli class=\"muted\">No providers entered yet.\u003c/li>'\n    letterhead = \"\"\n    if not (settings.get(\"name\") and settings.get(\"attorney\")):\n        letterhead = '\u003cdiv class=\"callout amber\">The caption needs the firm\\'s name and attorney. Add them under \u003ca href=\"/settings\">Firm settings\u003c/a>.\u003c/div>'\n    marks = (f'\u003cdiv class=\"callout red\">{missing} item{\"\" if missing == 1 else \"s\"} still marked MISSING. They are shaded in the Word file.\u003c/div>'\n             if missing else \"\")\n    return f\"\"\"{page_head(\"Finish and serve\", STEPS[7][2], 8)}\n\u003cform method=\"post\" action=\"{base}/finish\">{ENTER_SAVES}\n\u003cdiv class=\"two-up\">\n\u003csection class=\"panel\">\u003cheader>\u003ch2>Deadlines\u003c/h2>\u003c/header>\u003cdiv class=\"panel-body\">\u003ctable class=\"table\">\u003ctbody>{\"\".join(rows)}\u003c/tbody>\u003c/table>\n\u003cp class=\"note\" style=\"margin-top:8px\">Calendar days, moved off weekends. Court holidays are not built in yet; confirm against the Judiciary calendar.\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"panel\">\u003cheader>\u003ch2>Ready to serve?\u003c/h2>\u003c/header>\u003cdiv class=\"panel-body\">{readiness}\n\u003cdiv class=\"field\" id=\"at-f-served-date\" style=\"margin-top:12px;max-width:260px\">\u003clabel for=\"served\">Date the answers were served\u003c/label>\n\u003cinput type=\"date\" id=\"served\" name=\"served\" value=\"{esc(served)}\">\u003cspan class=\"hint\">The motion papers use this date.\u003c/span>\u003c/div>\u003c/div>\u003c/section>\n\u003c/div>\n\u003cdiv class=\"two-up\">\n\u003csection class=\"panel\">\u003cheader>\u003ch2>Attachments to annex\u003c/h2>\u003cp class=\"note\">Built from the answers. Check each one off as it goes into the packet.\u003c/p>\u003c/header>\n\u003cdiv class=\"panel-body\">\u003cul class=\"checks\">{att_list}\u003c/ul>\u003c/div>\u003c/section>\n\u003csection class=\"panel\">\u003cheader>\u003ch2>HIPAA authorizations\u003c/h2>\u003cp class=\"note\">R. 4:17-4 requires an executed authorization for each health care provider named in the answers, served with them.\u003c/p>\u003c/header>\n\u003cdiv class=\"panel-body\">\u003cul class=\"checks\">{hipaa_list}\u003c/ul>\u003c/div>\u003c/section>\n\u003c/div>\n\u003cdiv class=\"save-bar\" style=\"justify-content:flex-start;position:static;background:none;padding-top:0\">\u003cbutton class=\"btn primary\" name=\"action\" value=\"save\">Save checklist and date\u003c/button>\u003c/div>\n\u003c/form>\n\u003cdiv class=\"doc-bar\">\u003ch2>The answers as they will be served\u003c/h2>\u003cdiv class=\"row\">\n\u003ca class=\"btn primary\" href=\"{base}/download/answers.docx\">Download Word file\u003c/a>\n\u003ca class=\"btn\" href=\"{base}/print/answers\">Print view\u003c/a>\u003c/div>\u003c/div>\n{letterhead}{marks}\n\u003cdiv class=\"desk\">\u003cdiv class=\"sheet\">{document_html}\u003c/div>\u003c/div>\"\"\"\n\n\n# ---------------------------------------------------------------- client questionnaire\n\ndef questionnaire_page(matter, version, document_html):\n    base = f\"/m/{matter['id']}\"\n    tabs = \"\".join(f'\u003ca class=\"{\"on\" if version == key else \"\"}\" href=\"{base}/questionnaire?version={key}\">{label}\u003c/a>'\n                   for key, label in ((\"blank\", \"Blank\"), (\"prefilled\", \"Filled in for the client to confirm\")))\n    return f\"\"\"{page_head(\"Client questionnaire\", \"Plain-language questions built from the Client screen. Send it blank, or filled in so the client only confirms or corrects. Staff then type the answers into the Client screen.\")}\n\u003cdiv class=\"doc-bar\">\u003cnav class=\"tabs\">{tabs}\u003c/nav>\u003cdiv class=\"row\">\n\u003ca class=\"btn primary\" href=\"{base}/download/questionnaire.docx?version={version}\">Download Word file\u003c/a>\n\u003ca class=\"btn\" href=\"{base}/print/questionnaire?version={version}\">Print view\u003c/a>\n\u003ca class=\"btn quiet\" href=\"{base}/client\">Back to Client screen\u003c/a>\u003c/div>\u003c/div>\n\u003cdiv class=\"desk\">\u003cdiv class=\"sheet\">{document_html}\u003c/div>\u003c/div>\"\"\"\n\n\n# ---------------------------------------------------------------- motion papers\n\ndef motions_page(matter, motion, values, doc_index, rows, warnings, document_html, missing):\n    base = f\"/m/{matter['id']}\"\n    chooser = \"\".join(\n        f'\u003cli class=\"{\"on\" if m[\"id\"] == motion[\"id\"] else \"\"}\">\u003ca href=\"{base}/motions?type={m[\"id\"]}\">'\n        f'\u003cb>{\"File\" if m[\"ours\"] else \"Oppose\"}: {esc(m[\"title\"])}\u003c/b>\u003csmall>{esc(m[\"rule\"])}. {esc(m[\"summary\"])}\u003c/small>\u003c/a>\u003c/li>'\n        for m in MOTIONS)\n    fields = \"\".join(_motion_field(f, values) for f in motion[\"fields\"])\n    deadline_html = '\u003cp class=\"muted\">Enter the return date to calculate the filing deadlines.\u003c/p>'\n    if rows:\n        body = [f'\u003ctr>\u003cth>Return date\u003c/th>\u003ctd>{dates.with_weekday(values.get(\"returnDate\"))}\u003c/td>\u003c/tr>']\n        for label, note, value in rows:\n            left = dates.days_until(value)\n            css = \"red-text\" if left \u003c 0 else (\"amber-text\" if left \u003c= 3 else \"\")\n            when = \"Passed\" if left \u003c 0 else (\"Today\" if left == 0 else f\"In {left} day{'' if left == 1 else 's'}\")\n            weekend = \". Falls on a weekend; file the business day before.\" if dates.is_weekend(value) else \"\"\n            body.append(f'\u003ctr>\u003cth>{label}\u003csmall>{note}{weekend}\u003c/small>\u003c/th>\u003ctd>{dates.with_weekday(value)}'\n                        f'\u003csmall class=\"{css}\">{when}\u003c/small>\u003c/td>\u003c/tr>')\n        deadline_html = f'\u003ctable class=\"table\">\u003ctbody>{\"\".join(body)}\u003c/tbody>\u003c/table>'\n    deadline_html += \"\".join(f'\u003cdiv class=\"callout amber\" style=\"margin:10px 0 0\">{esc(w)}\u003c/div>' for w in warnings)\n    packet_done = matter.get(\"motions\", {}).get(motion[\"id\"], {}).get(\"packet\", {})\n    packet = \"\".join(f'\u003cli>\u003cinput type=\"checkbox\" id=\"pk-{n}\" name=\"packet:{n}\"{\" checked\" if packet_done.get(str(n)) else \"\"}>'\n                     f'\u003clabel for=\"pk-{n}\">{esc(item)}\u003c/label>\u003c/li>' for n, item in enumerate(motion[\"packet\"]))\n    tabs = \"\".join(f'\u003ca class=\"{\"on\" if n == doc_index else \"\"}\" href=\"{base}/motions?type={motion[\"id\"]}&doc={n}\">{esc(d[\"title\"])}\u003c/a>'\n                   for n, d in enumerate(motion[\"docs\"]))\n    missing_html = \"\"\n    if missing:\n        listed = \", \".join(esc(m[\"label\"]) for m in missing)\n        missing_html = f'\u003cdiv class=\"callout red\">{len(missing)} detail{\"\" if len(missing) == 1 else \"s\"} missing: {listed}.\u003c/div>'\n    clauses = \"\".join(f'\u003cli style=\"padding:8px 0;border-top:1px solid var(--line)\">\u003cb>{esc(c[\"name\"])}\u003c/b> '\n                      f'\u003cspan class=\"muted small\">{esc(c[\"cite\"])}\u003c/span>\u003cdiv>{esc(c[\"text\"])}\u003c/div>\u003c/li>' for c in MOTION_CLAUSES)\n    query = f\"type={motion['id']}&doc={doc_index}\"\n    return f\"\"\"{page_head(\"Motion papers\", \"Assembles the routine papers from this matter: captions, notices, certifications, orders and deadlines. Legal argument stays with the attorney, and those places are marked.\")}\n\u003csection class=\"panel\">\u003cul class=\"motion-list\">{chooser}\u003c/ul>\u003c/section>\n\u003cform method=\"post\" action=\"{base}/motions?{query}\">{ENTER_SAVES}\n\u003cdiv class=\"two-up\">\n\u003csection class=\"panel\">\u003cheader>\u003ch2>Details for this motion\u003c/h2>\u003c/header>\u003cdiv class=\"panel-body\">\u003cdiv class=\"fields\">{fields}\u003c/div>\u003c/div>\u003c/section>\n\u003cdiv class=\"stack\">\n\u003csection class=\"panel\">\u003cheader>\u003ch2>Deadlines\u003c/h2>\u003c/header>\u003cdiv class=\"panel-body\">{deadline_html}\n\u003cp class=\"note\" style=\"margin-top:8px\">Calendar days counted back from the return date. Confirm against the court's motion calendar.\u003c/p>\u003c/div>\u003c/section>\n\u003csection class=\"panel\">\u003cheader>\u003ch2>Packet\u003c/h2>\u003c/header>\u003cdiv class=\"panel-body\">\u003cul class=\"checks\">{packet}\u003c/ul>\u003c/div>\u003c/section>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"save-bar\" style=\"justify-content:flex-start;position:static;background:none;padding-top:0\">\u003cbutton class=\"btn primary\" name=\"action\" value=\"save\">Save details\u003c/button>\u003c/div>\n\u003c/form>\n\u003cdiv class=\"doc-bar\">\u003cnav class=\"tabs\">{tabs}\u003c/nav>\u003cdiv class=\"row\">\n\u003ca class=\"btn primary\" href=\"{base}/download/motion.docx?{query}\">Download Word file\u003c/a>\n\u003ca class=\"btn\" href=\"{base}/print/motion?{query}\">Print view\u003c/a>\u003c/div>\u003c/div>\n{missing_html}\n\u003cdiv class=\"desk\">\u003cdiv class=\"sheet\">{document_html}\u003c/div>\u003c/div>\n\u003csection class=\"panel\" style=\"margin-top:22px\">\u003cheader>\u003ch2>Starter clauses\u003c/h2>\u003cp class=\"note\">Passages used in these papers. The attorney confirms every citation before filing.\u003c/p>\u003c/header>\n\u003cdiv class=\"panel-body\">\u003cul style=\"list-style:none;margin:0;padding:0\">{clauses}\u003c/ul>\u003c/div>\u003c/section>\"\"\"\n\n\ndef _motion_field(f, values):\n    name = \"m.\" + f[\"k\"]\n    fid = field_id(name)\n    if f.get(\"t\") == \"yn\":\n        label = f'\u003cspan class=\"label\" id=\"{fid}-label\">{esc(f[\"l\"])}\u003c/span>'\n    else:\n        label = f'\u003clabel for=\"{fid}\">{esc(f[\"l\"])}\u003c/label>'\n    hint = f'\u003cspan class=\"hint\">{esc(f[\"h\"])}\u003c/span>' if f.get(\"h\") else \"\"\n    return (f'\u003cdiv class=\"field{\" full\" if f.get(\"full\") else \"\"}\" id=\"at-{fid}\">{label}'\n            f'{control(f, name, values.get(f[\"k\"]))}{hint}\u003c/div>')\n\n\n# ---------------------------------------------------------------- forms library\n\ndef library_page(lib):\n    changed = '\u003cspan class=\"st st-edited\">Changed\u003c/span>'\n    questions = \"\".join(\n        f'\u003ctr>\u003ctd>{q[\"n\"]}\u003c/td>\u003ctd>\u003ca href=\"/library/q/{q[\"n\"]}\">{esc(q[\"subject\"])}\u003c/a>\u003c/td>'\n        f'\u003ctd class=\"muted\">{\", \".join(SOURCES[s] for s in q[\"src\"])}\u003c/td>'\n        f'\u003ctd>{changed if q.get(\"changed\") else \"\"}\u003c/td>\u003c/tr>'\n        for q in lib[\"questions\"])\n    standard = \"\".join(f'\u003ctr>\u003ctd>{k + 1}\u003c/td>\u003ctd>\u003ca href=\"/library/standard/{k}\">{esc(e[\"name\"])}\u003c/a>\u003c/td>'\n                       f'\u003ctd class=\"muted\">{esc(\", \".join(e.get(\"words\", [])[:4]))}\u003c/td>\u003c/tr>'\n                       for k, e in enumerate(lib[\"supplemental\"]))\n    return f\"\"\"{page_head(\"Forms library\", \"Question wording, answer templates, standard answers and standard language. Change wording here when the court amends Appendix II or the attorney prefers different language. No programming is needed.\")}\n\u003cdiv class=\"callout\">Form A wording is from R. Appendix II, effective September 1, 2020. Compare it with the current text on njcourts.gov before relying on it. Changes apply to every matter.\u003c/div>\n\u003csection class=\"panel\">\u003cheader>\u003ch2>Form A questions\u003c/h2>\u003c/header>\u003cdiv class=\"panel-body scroll-x\">\u003ctable class=\"table\">\u003ctbody>{questions}\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>\n\u003csection class=\"panel\">\u003cheader class=\"row between\">\u003ch2>Standard answers to supplemental questions\u003c/h2>\u003ca class=\"btn small\" href=\"/library/standard/new\">Add one\u003c/a>\n\u003cp class=\"note\">Offered on the Supplemental questions screen when a question contains one of the match words.\u003c/p>\u003c/header>\n\u003cdiv class=\"panel-body scroll-x\">\u003ctable class=\"table\">\u003ctbody>{standard}\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>\n\u003csection class=\"panel\">\u003cheader class=\"row between\">\u003ch2>Standard language and objections\u003c/h2>\u003ca class=\"btn small\" href=\"/library/clauses\">Edit\u003c/a>\n\u003cp class=\"note\">The paragraphs offered under Insert on every answer.\u003c/p>\u003c/header>\u003c/section>\n{template_help()}\"\"\"\n\n\ndef template_help():\n    return \"\"\"\u003csection class=\"panel\">\u003cheader>\u003ch2>How templates work\u003c/h2>\u003c/header>\u003cdiv class=\"panel-body scroll-x\">\u003ctable class=\"table\">\u003ctbody>\n\u003ctr>\u003ctd>\u003ccode>{{client.fullName}}\u003c/code>\u003c/td>\u003ctd>Inserts a field. If it is blank, the answer shows MISSING and staff are sent to the field.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>{{police.date|date}}\u003c/code>\u003c/td>\u003ctd>Formats a value. Also \u003ccode>|money\u003c/code>, \u003ccode>|time\u003c/code>, \u003ccode>|lower\u003c/code>, \u003ccode>|upper\u003c/code>.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>{{#if client.employed == yes}} ... {{else}} ... {{/if}}\u003c/code>\u003c/td>\u003ctd>Chooses wording based on an answer. A blank yes or no is flagged as missing.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ccode>{{#each calc.providers}}{{.name}}{{/each}}\u003c/code>\u003c/td>\u003ctd>Repeats for each row of a list. \u003ccode>{{@a}}\u003c/code> prints a, b, c.\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>\"\"\"\n\n\ndef library_question_page(q, preview):\n    restore = ('\u003cbutton class=\"btn quiet\" name=\"action\" value=\"restore\">Restore the original wording and template\u003c/button>'\n               if q.get(\"changed\") else \"\")\n    return f\"\"\"{page_head(f\"Question {q['n']}: {q['subject']}\", \"Edit the question as served and the template that drafts the answer.\")}\n\u003cform method=\"post\" action=\"/library/q/{q['n']}\">{ENTER_SAVES}\n\u003csection class=\"panel\">\u003cdiv class=\"panel-body\">\n\u003cdiv class=\"field\">\u003clabel for=\"text\">Question wording\u003c/label>\u003ctextarea id=\"text\" name=\"text\" rows=\"4\">{esc(q['text'])}\u003c/textarea>\u003c/div>\n\u003cdiv class=\"field\" style=\"margin-top:14px\">\u003clabel for=\"tpl\">Answer template\u003c/label>\u003ctextarea class=\"code\" id=\"tpl\" name=\"tpl\" rows=\"10\">{esc(q['tpl'])}\u003c/textarea>\u003c/div>\n{preview}\n\u003c/div>\u003c/section>\n\u003cdiv class=\"save-bar\" style=\"justify-content:space-between\">\u003ca class=\"btn quiet\" href=\"/library\">Back to the library\u003c/a>\u003cspan class=\"row\">{restore}\u003cbutton class=\"btn primary\" name=\"action\" value=\"save\">Save\u003c/button>\u003c/span>\u003c/div>\n\u003c/form>{template_help()}\"\"\"\n\n\ndef library_standard_page(k, entry, preview):\n    title = \"New standard answer\" if k == \"new\" else f\"Standard answer: {entry['name']}\"\n    remove = '' if k == \"new\" else '\u003cbutton class=\"btn quiet danger\" name=\"action\" value=\"remove\">Remove this standard answer\u003c/button>'\n    return f\"\"\"{page_head(title, \"Offered for a supplemental question when the question contains any of the match words.\")}\n\u003cform method=\"post\" action=\"/library/standard/{k}\">{ENTER_SAVES}\n\u003csection class=\"panel\">\u003cdiv class=\"panel-body\">\u003cdiv class=\"fields\">\n\u003cdiv class=\"field\">\u003clabel for=\"name\">Name\u003c/label>\u003cinput type=\"text\" id=\"name\" name=\"name\" value=\"{esc(entry.get('name', ''))}\">\u003c/div>\n\u003cdiv class=\"field full\">\u003clabel for=\"words\">Match words\u003c/label>\u003cinput type=\"text\" id=\"words\" name=\"words\" value=\"{esc(', '.join(entry.get('words', [])))}\">\u003cspan class=\"hint\">Separate with commas.\u003c/span>\u003c/div>\n\u003cdiv class=\"field full\">\u003clabel for=\"tpl\">Answer template\u003c/label>\u003ctextarea class=\"code\" id=\"tpl\" name=\"tpl\" rows=\"6\">{esc(entry.get('tpl', ''))}\u003c/textarea>\u003c/div>\n\u003c/div>{preview}\u003c/div>\u003c/section>\n\u003cdiv class=\"save-bar\" style=\"justify-content:space-between\">\u003ca class=\"btn quiet\" href=\"/library\">Back to the library\u003c/a>\u003cspan class=\"row\">{remove}\u003cbutton class=\"btn primary\" name=\"action\" value=\"save\">Save\u003c/button>\u003c/span>\u003c/div>\n\u003c/form>{template_help()}\"\"\"\n\n\ndef library_clauses_page(clauses):\n    rows = []\n    for i, c in enumerate(clauses):\n        kind = \"\".join(f'\u003coption value=\"{v}\"{\" selected\" if c.get(\"kind\") == v else \"\"}>{label}\u003c/option>'\n                       for v, label in ((\"answer\", \"Standard language\"), (\"objection\", \"Objection\")))\n        rows.append(f\"\"\"\u003cdiv class=\"list-row\">\u003cheader>\u003cb>{i + 1}\u003c/b>\u003cbutton class=\"btn small quiet danger\" name=\"action\" value=\"remove:{i}\">Remove\u003c/button>\u003c/header>\n\u003cdiv class=\"fields\">\u003cdiv class=\"field\">\u003clabel for=\"c-{i}-name\">Name\u003c/label>\u003cinput type=\"text\" id=\"c-{i}-name\" name=\"c-{i}-name\" value=\"{esc(c.get('name', ''))}\">\u003c/div>\n\u003cdiv class=\"field\">\u003clabel for=\"c-{i}-kind\">Kind\u003c/label>\u003cselect id=\"c-{i}-kind\" name=\"c-{i}-kind\">{kind}\u003c/select>\u003c/div>\n\u003cdiv class=\"field full\">\u003clabel for=\"c-{i}-text\">Text\u003c/label>\u003ctextarea id=\"c-{i}-text\" name=\"c-{i}-text\" rows=\"2\">{esc(c.get('text', ''))}\u003c/textarea>\u003c/div>\n\u003cinput type=\"hidden\" name=\"c-{i}-id\" value=\"{esc(c.get('id', ''))}\">\u003c/div>\u003c/div>\"\"\")\n    return f\"\"\"{page_head(\"Standard language and objections\", \"Objections are placed in front of the answer. Standard language is added at the end.\")}\n\u003cform method=\"post\" action=\"/library/clauses\">{ENTER_SAVES}\n\u003csection class=\"panel\">\u003cdiv class=\"panel-body\">\u003cdiv class=\"rows\">{''.join(rows)}\u003c/div>\n\u003cdiv style=\"margin-top:12px\">\u003cbutton class=\"btn small\" name=\"action\" value=\"add\">Add another\u003c/button>\u003c/div>\u003c/div>\u003c/section>\n\u003cdiv class=\"save-bar\" style=\"justify-content:space-between\">\u003ca class=\"btn quiet\" href=\"/library\">Back to the library\u003c/a>\u003cspan class=\"row\">\u003cbutton class=\"btn quiet\" name=\"action\" value=\"restore\">Restore the original list\u003c/button>\u003cbutton class=\"btn primary\" name=\"action\" value=\"save\">Save\u003c/button>\u003c/span>\u003c/div>\n\u003c/form>\"\"\"\n\n\n# ---------------------------------------------------------------- firm settings\n\ndef settings_page(settings, in_browser=False):\n    def text(key, label, hint=\"\"):\n        h = f'\u003cspan class=\"hint\">{esc(hint)}\u003c/span>' if hint else \"\"\n        return (f'\u003cdiv class=\"field\">\u003clabel for=\"s-{key}\">{label}\u003c/label>'\n                f'\u003cinput type=\"text\" id=\"s-{key}\" name=\"{key}\" value=\"{esc(settings.get(key, \"\"))}\">{h}\u003c/div>')\n\n    def area(key, label, hint=\"\", rows=3, code=False):\n        h = f'\u003cspan class=\"hint\">{esc(hint)}\u003c/span>' if hint else \"\"\n        return (f'\u003cdiv class=\"field full\">\u003clabel for=\"s-{key}\">{label}\u003c/label>\u003ctextarea id=\"s-{key}\" name=\"{key}\" '\n                f'rows=\"{rows}\"{\" class=code\" if code else \"\"}>{esc(settings.get(key, \"\"))}\u003c/textarea>{h}\u003c/div>')\n\n    def choice(key, label, options):\n        opts = \"\".join(f'\u003coption value=\"{v}\"{\" selected\" if settings.get(key) == v else \"\"}>{esc(t)}\u003c/option>' for v, t in options)\n        return f'\u003cdiv class=\"field\">\u003clabel for=\"s-{key}\">{label}\u003c/label>\u003cselect id=\"s-{key}\" name=\"{key}\">{opts}\u003c/select>\u003c/div>'\n\n    return f\"\"\"{page_head(\"Firm settings\", \"Letterhead, reviewers, and the paragraphs that open and close every set of answers. These apply to all matters.\")}\n\u003cform method=\"post\" action=\"/settings\">{ENTER_SAVES}\n\u003csection class=\"panel\">\u003cheader>\u003ch2>Attorney identification block\u003c/h2>\u003cp class=\"note\">Printed at the top left of every paper, as R. 1:4-1(b) requires.\u003c/p>\u003c/header>\n\u003cdiv class=\"panel-body\">\u003cdiv class=\"fields\">{text(\"name\", \"Firm name\")}{text(\"attorney\", \"Signing attorney\", \"For example: Jane Smith, Esq.\")}{text(\"attorneyId\", \"Attorney ID number\")}{text(\"phone\", \"Telephone\")}{text(\"email\", \"Email\")}{area(\"address\", \"Office address\", \"One line per row\", 2)}\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"panel\">\u003cheader>\u003ch2>Review\u003c/h2>\u003c/header>\u003cdiv class=\"panel-body\">\u003cdiv class=\"fields\">{text(\"paralegal\", \"Paralegal who checks drafts\", \"Shown on the check button. Leave blank to show paralegal.\")}\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"panel\">\u003cheader>\u003ch2>Answer defaults\u003c/h2>\u003c/header>\u003cdiv class=\"panel-body\">\u003cdiv class=\"fields\">\n{choice(\"ssnMode\", \"Social Security number in Question 1\", [(\"last4\", \"Show the last four digits only\"), (\"separate\", \"Provide under separate confidential cover\")])}\n{choice(\"desig\", \"Source designation, R. 4:17-4(a)\", [(\"answer\", \"Add a source line under each answer\"), (\"off\", \"Do not add source lines\")])}\n{area(\"prelim\", \"Opening paragraph\", \"Template text. Uses the same codes as the Forms library.\", 4, True)}\n{area(\"cert\", \"Certification\", \"Form A certification as prescribed in Appendix II.\", 6)}\n\u003c/div>\u003c/div>\u003c/section>\n\u003cdiv class=\"save-bar\">\u003cbutton class=\"btn quiet\" name=\"action\" value=\"restore\">Restore the default paragraphs\u003c/button>\u003cbutton class=\"btn primary\" name=\"action\" value=\"save\">Save\u003c/button>\u003c/div>\n\u003c/form>\n{backup_panel(in_browser)}\"\"\"\n\n\ndef backup_panel(in_browser):\n    where = (\"This copy keeps its records in this browser only.\" if in_browser else\n             \"This copy keeps its records in the data folder next to the program.\")\n    return f\"\"\"\u003csection class=\"panel\" style=\"margin-top:28px\">\u003cheader>\u003ch2>Backup\u003c/h2>\n\u003cp class=\"note\">{where} A backup is one file holding every matter, these settings and any Forms library changes. It is also how records move from one copy of the program to another.\u003c/p>\u003c/header>\n\u003cdiv class=\"panel-body\">\u003ca class=\"btn\" href=\"/backup\">Download a backup\u003c/a>\n\u003cform method=\"post\" action=\"/restore\" enctype=\"multipart/form-data\" style=\"margin-top:16px\">\n\u003cdiv class=\"field\">\u003clabel for=\"backup-file\">Restore from a backup file\u003c/label>\n\u003cinput type=\"file\" id=\"backup-file\" name=\"backup\" accept=\".json,application/json\">\n\u003cspan class=\"hint\">Matters in the file replace matters with the same record here. Other matters here are kept.\u003c/span>\u003c/div>\n\u003cdiv class=\"row\" style=\"margin-top:10px\">\u003clabel class=\"row\">\u003cinput type=\"checkbox\" name=\"confirm\" value=\"yes\"> Yes, restore\u003c/label>\n\u003cbutton class=\"btn\">Restore\u003c/button>\u003c/div>\u003c/form>\u003c/div>\u003c/section>\"\"\"\n\n\ndef error_page(details):\n    return (page_head(\"Something went wrong\", \"The last step did not finish. Everything saved before it is safe. \"\n                      \"Go back and try again; if it happens again, send the details below to whoever looks after \"\n                      \"the program.\")\n            + f'\u003cdetails class=\"panel\" style=\"padding:12px 16px\">\u003csummary>Details\u003c/summary>'\n              f'\u003cpre class=\"code\" style=\"white-space:pre-wrap;overflow-wrap:anywhere\">{esc(details)}\u003c/pre>\u003c/details>'\n            + '\u003cp>\u003ca class=\"btn\" href=\"/\">Back to all matters\u003c/a>\u003c/p>')\n\n\ndef preview_block(source, text, missing):\n    fields = \"\"\n    if missing:\n        fields = ('\u003cp class=\"note\" style=\"margin-top:6px\">Blank in that matter: '\n                  + \", \".join(esc(m[\"label\"]) for m in missing) + \".\u003c/p>\")\n    return (f'\u003cdiv class=\"field\" style=\"margin-top:14px\">\u003cspan class=\"label\">Preview, drafted from {esc(source)}\u003c/span>'\n            f'\u003cdiv class=\"preview\">{marked(text)}\u003c/div>{fields}\u003c/div>')\n\n\ndef not_found_page():\n    return page_head(\"Not found\", \"That page or matter does not exist. It may have been deleted.\") + \\\n        '\u003ca class=\"btn\" href=\"/\">Back to all matters\u003c/a>'\n\n\ndef print_page(title, document_html, back):\n    return template(\"print.html\").substitute(title=esc(title), body=document_html, back=esc(back))\n\n\ndef document_preview(paper):\n    return to_html(paper)\n", "webapp.py": "\"\"\"What each address shows and what each button does.\n\nhandle() takes one request (method, path, query string, body) and returns a\nresponse as a small dict. app.py passes it requests from the browser on this\ncomputer. The web version (index.html) passes it the same requests from inside\nthe browser, so both versions behave the same way.\n\n    {\"status\": 200, \"type\": \"text/html; charset=utf-8\", \"body\": \"\u003c!doctype html>...\"}\n    {\"status\": 303, \"location\": \"/m/ab12cd34ef56/answers/7\"}\n    {\"status\": 200, \"type\": DOCX, \"body\": b\"PK...\", \"filename\": \"Form A Answers - Smith.docx\"}\n\nAddresses:\n    /                                   all matters\n    /new                                start a matter (POST)\n    /settings                           firm settings\n    /library ...                        forms library\n    /m/\u003cid>/\u003cscreen>                    matter, police, medical, client, attorney,\n                                        answers/\u003cn>, supplemental, finish,\n                                        questionnaire, motions, delete\n    /m/\u003cid>/download/\u003cfile>.docx        Word files\n    /m/\u003cid>/print/\u003cpaper>               print views\n\"\"\"\n\nimport json\nimport re\nimport traceback\nfrom datetime import datetime\nfrom urllib.parse import parse_qs, quote\n\nimport dates\nimport documents\nimport drafting\nimport form_a\nimport pages\nimport storage\nfrom intake import FIELD_INDEX, INTAKE_STEPS, SCREENS, STEPS, find_field, index_key\nfrom motions import MOTIONS, MOTIONS_BY_ID, deadline_rows, motion_extras, motion_values\n\nHTML = \"text/html; charset=utf-8\"\nDOCX = \"application/vnd.openxmlformats-officedocument.wordprocessingml.document\"\nSTEP_KEYS = [key for key, _, _ in STEPS]\nSTEP_TITLES = {key: title for key, title, _ in STEPS}\n\n\nclass Form:\n    \"\"\"The fields sent with a request (or the query string).\"\"\"\n\n    def __init__(self, raw=\"\", fields=None):\n        self.data = fields if fields is not None else parse_qs(raw or \"\", keep_blank_values=True)\n\n    def get(self, name, default=\"\"):\n        values = self.data.get(name)\n        return values[0] if values else default\n\n    def has(self, name):\n        return name in self.data\n\n    def text(self, name):\n        \"\"\"A text box value, trimmed, with Windows line endings evened out.\"\"\"\n        return self.get(name).replace(\"\\r\\n\", \"\\n\").replace(\"\\r\", \"\\n\").strip()\n\n\n# ---------------------------------------------------------------- responses\n\n# The message shown at the top of the next page, such as \"Saved.\" One person\n# uses the program at a time, so a single slot is enough.\n_flash = []\n\n\ndef flash(text, kind=\"green\"):\n    _flash[:] = [f\"{kind}:{text}\"]\n\n\ndef take_flash():\n    return _flash.pop() if _flash else \"\"\n\n\ndef page(title, main, matter=None, active=\"\", info=None, status=200):\n    return {\"status\": status, \"type\": HTML,\n            \"body\": pages.layout(title, main, matter, active, take_flash(), info)}\n\n\ndef redirect(location):\n    return {\"status\": 303, \"location\": location}\n\n\ndef download(data, filename):\n    return {\"status\": 200, \"type\": DOCX, \"body\": data, \"filename\": filename}\n\n\ndef not_found():\n    return page(\"Not found\", pages.not_found_page(), status=404)\n\n\ndef file_name(*parts):\n    name = \" - \".join(p for p in parts if p)\n    name = re.sub(r\"[^A-Za-z0-9 .,_()-]\", \"\", name).strip()\n    return (name or \"Document\") + \".docx\"\n\n\ndef safe_back(value):\n    \"\"\"Only allow a return address inside this program.\"\"\"\n    value = value or \"\"\n    if value.startswith(\"/m/\") and \"//\" not in value and \"\\n\" not in value:\n        return value\n    return \"\"\n\n\n# ---------------------------------------------------------------- entry point\n\ndef read_form(body, content_type):\n    \"\"\"Form fields from a request body. A file upload (the backup file) arrives as multipart data.\"\"\"\n    if content_type.startswith(\"multipart/form-data\"):\n        from email.parser import BytesParser\n        from email.policy import HTTP\n        message = BytesParser(policy=HTTP).parsebytes(\n            b\"Content-Type: \" + content_type.encode(\"latin-1\") + b\"\\r\\n\\r\\n\" + body)\n        fields = {}\n        for part in message.iter_parts():\n            name = part.get_param(\"name\", header=\"content-disposition\")\n            if name:\n                payload = part.get_payload(decode=True) or b\"\"\n                fields.setdefault(name, []).append(payload.decode(\"utf-8\", errors=\"replace\"))\n        return Form(fields=fields)\n    return Form(body.decode(\"utf-8\", errors=\"replace\"))\n\n\ndef handle(method, path, query=\"\", body=b\"\", content_type=\"\"):\n    if isinstance(body, str):\n        body = body.encode(\"utf-8\")\n    parts = [p for p in path.split(\"/\") if p]\n    try:\n        return route(method.upper(), parts, Form(query), read_form(body, content_type or \"\"))\n    except Exception:\n        details = traceback.format_exc()\n        print(details)\n        return page(\"Something went wrong\", pages.error_page(details), status=500)\n\n\ndef route(method, parts, q, form):\n    post = method == \"POST\"\n    if not parts:\n        return home()\n    head, rest = parts[0], parts[1:]\n    if head == \"new\" and post:\n        return start_matter(form)\n    if head == \"settings\":\n        return save_settings(form) if post else show_settings()\n    if head == \"library\":\n        return library_route(post, rest, form)\n    if head == \"backup\":\n        return backup()\n    if head == \"restore\" and post:\n        return restore(form)\n    if head == \"m\" and rest:\n        matter = storage.load_matter(rest[0])\n        if not matter:\n            return not_found()\n        return matter_route(post, matter, rest[1:], q, form)\n    return not_found()\n\n\ndef matter_route(post, matter, rest, q, form):\n    base = f\"/m/{matter['id']}\"\n    if not rest:\n        return redirect(f\"{base}/matter\")\n    screen = rest[0]\n    if screen in INTAKE_STEPS:\n        return save_intake(matter, screen, form) if post else show_intake(matter, screen, q)\n    if screen == \"answers\":\n        if len(rest) \u003c 2 or not rest[1].isdigit():\n            return redirect(f\"{base}/answers/1\")\n        n = int(rest[1])\n        return save_answer(matter, n, q, form) if post else show_answer(matter, n, q)\n    if screen == \"supplemental\":\n        return save_supplemental(matter, form) if post else show_supplemental(matter)\n    if screen == \"finish\":\n        return save_finish(matter, form) if post else show_finish(matter)\n    if screen == \"questionnaire\":\n        return show_questionnaire(matter, q)\n    if screen == \"motions\":\n        return save_motion(matter, q, form) if post else show_motion(matter, q)\n    if screen == \"delete\" and post:\n        return delete_matter(matter, form)\n    if screen == \"download\" and len(rest) == 2:\n        return download_file(matter, rest[1], q)\n    if screen == \"print\" and len(rest) == 2:\n        return print_view(matter, rest[1], q)\n    return not_found()\n\n\n# ---------------------------------------------------------------- shared work\n\ndef work_up(matter):\n    \"\"\"Everything most matter screens need: settings, wording, and the drafted answers.\"\"\"\n    settings = storage.load_settings()\n    lib = storage.library()\n    answers = drafting.draft_answers(matter, settings, lib)\n    items = drafting.draft_supplemental(matter, lib)\n    return settings, lib, answers, items\n\n\ndef sidebar_info(matter, settings, answers, items):\n    \"\"\"The small status lines under each step in the sidebar, and the due date in the top bar.\"\"\"\n    calc = drafting.worked_out(matter, settings)\n    needed_by_step = {}\n    for path in drafting.where_needed(answers, items):\n        step = (FIELD_INDEX.get(index_key(path)) or {}).get(\"step\")\n        needed_by_step[step] = needed_by_step.get(step, 0) + 1\n\n    sub = {}\n    for key in INTAKE_STEPS:\n        count = needed_by_step.get(key, 0)\n        sub[key] = f'\u003ci class=\"red\">{count} needed\u003c/i>' if count else \"\"\n    approved = sum(1 for a in answers if a[\"status\"] == \"approved\")\n    css = \"green\" if approved == len(answers) else \"\"\n    sub[\"answers\"] = f'\u003ci class=\"{css}\">{approved} of {len(answers)} approved\u003c/i>'\n    if items:\n        done = sum(1 for s in items if s[\"status\"] == \"approved\")\n        sub[\"supplemental\"] = f'\u003ci class=\"{\"green\" if done == len(items) else \"\"}\">{done} of {len(items)} approved\u003c/i>'\n    served = matter.get(\"served\", {}).get(\"date\")\n    if served:\n        sub[\"finish\"] = f'\u003ci class=\"green\">Served {dates.short_date(served)}\u003c/i>'\n    elif calc.get(\"due\"):\n        sub[\"finish\"] = f'\u003ci>Due {dates.short_date(calc[\"due\"])}\u003c/i>'\n    return {\"due\": calc.get(\"due\"), \"sub\": sub}\n\n\ndef matter_page(matter, title, main, active, settings, answers, items):\n    return page(title, main, matter, active, sidebar_info(matter, settings, answers, items))\n\n\ndef sign_off(record, action, text, settings):\n    \"\"\"The two-step sign-off. The wording signed off is kept, so any later change shows as Needs recheck.\"\"\"\n    now = datetime.now().isoformat(timespec=\"minutes\")\n    if action == \"check\":\n        record.update(paraOK=True, paraText=text, paraBy=settings.get(\"paralegal\") or \"paralegal\", paraAt=now)\n    elif action == \"approve\":\n        record.update(reviewed=True, reviewedText=text, reviewedBy=settings.get(\"attorney\") or \"attorney\",\n                      reviewedAt=now)\n    elif action == \"uncheck\":\n        record[\"paraOK\"] = False\n    elif action == \"unapprove\":\n        record[\"reviewed\"] = False\n\n\nSIGN_OFF_DONE = {\"check\": \"checked\", \"approve\": \"approved\", \"uncheck\": \"check undone\", \"unapprove\": \"approval undone\"}\n\n\n# ---------------------------------------------------------------- all matters\n\ndef home():\n    settings = storage.load_settings()\n    lib = storage.library()\n    matters = storage.all_matters()\n    summaries = {}\n    for m in matters:\n        everything = drafting.draft_answers(m, settings, lib) + drafting.draft_supplemental(m, lib)\n        summaries[m[\"id\"]] = {\n            \"due\": drafting.worked_out(m, settings).get(\"due\"),\n            \"approved\": sum(1 for x in everything if x[\"status\"] == \"approved\"),\n            \"total\": len(everything),\n        }\n    in_browser = isinstance(storage.store, storage.BrowserStore)\n    return page(\"Matters\", pages.home_page(matters, settings, summaries, in_browser), active=\"home\")\n\n\ndef start_matter(form):\n    matter = storage.new_matter()\n    matter[\"caption\"][\"plaintiff\"] = form.get(\"plaintiff\").strip()\n    storage.save_matter(matter)\n    flash(\"Matter started. Fill in the caption and the key dates.\")\n    return redirect(f\"/m/{matter['id']}/matter\")\n\n\ndef delete_matter(matter, form):\n    if form.get(\"confirm\") != \"yes\":\n        flash(\"Check the box first to confirm the delete.\", \"red\")\n        return redirect(f\"/m/{matter['id']}/matter\")\n    storage.delete_matter(matter[\"id\"])\n    flash(f\"{pages.matter_title(matter)} was deleted. The record was moved to the deleted folder.\")\n    return redirect(\"/\")\n\n\n# ---------------------------------------------------------------- intake screens\n\ndef show_intake(matter, step, q):\n    settings, lib, answers, items = work_up(matter)\n    needed = drafting.where_needed(answers, items)\n    main = pages.intake_page(matter, step, needed, safe_back(q.get(\"back\")))\n    return matter_page(matter, STEP_TITLES[step], main, step, settings, answers, items)\n\n\ndef screen_fields(matter, step):\n    \"\"\"The fields that were on the screen, as (path, field). Rows of a list are included.\"\"\"\n    is_auto = matter.get(\"caption\", {}).get(\"caseType\") == \"auto\"\n    for group in SCREENS[step]:\n        if group.get(\"auto\") and not is_auto:\n            continue\n        for f in group[\"fields\"]:\n            if f.get(\"auto\") and not is_auto:\n                continue\n            if f[\"t\"] == \"list\":\n                for i in range(len(drafting.get_path(matter, f[\"k\"]) or [])):\n                    for sub in f[\"fields\"]:\n                        yield f\"{f['k']}.{i}.{sub['k']}\", sub\n            else:\n                yield f[\"k\"], f\n\n\ndef save_intake(matter, step, form):\n    base = f\"/m/{matter['id']}\"\n    back = safe_back(form.get(\"back\"))\n\n    for path, f in list(screen_fields(matter, step)):\n        if f[\"t\"] == \"yn\" and not form.has(path):\n            continue  # yes/no buttons send nothing until one is chosen\n        drafting.set_path(matter, path, form.text(path))\n\n    action = form.get(\"action\", \"save\")\n    anchor = \"\"\n    if action.startswith(\"add:\") or action.startswith(\"remove:\"):\n        verb, _, target = action.partition(\":\")\n        if verb == \"remove\":\n            key, _, index = target.rpartition(\".\")\n        else:\n            key, index = target, \"\"\n        meta = FIELD_INDEX.get(key) or {}\n        if meta.get(\"t\") == \"list\" and meta.get(\"step\") == step:\n            rows = drafting.get_path(matter, key)\n            if not isinstance(rows, list):\n                rows = []\n                drafting.set_path(matter, key, rows)\n            if verb == \"add\":\n                rows.append({})\n                first = find_field(key)[\"fields\"][0][\"k\"]\n                anchor = \"#at-\" + pages.field_id(f\"{key}.{len(rows) - 1}.{first}\")\n            elif index.isdigit() and int(index) \u003c len(rows):\n                rows.pop(int(index))\n                anchor = \"#at-\" + pages.field_id(key)\n\n    refresh_standard_answers(matter, storage.load_settings(), storage.library())\n    drafting.fill_supplemental_markers(matter)\n    storage.save_matter(matter)\n\n    if action == \"return\" and back:\n        flash(\"Saved.\")\n        return redirect(back)\n    if action == \"next\":\n        flash(\"Saved.\")\n        return redirect(f\"{base}/{STEP_KEYS[STEP_KEYS.index(step) + 1]}\")\n    if not anchor:\n        flash(\"Saved.\")\n    keep = f\"?back={quote(back)}\" if back else \"\"\n    return redirect(f\"{base}/{step}{keep}{anchor}\")\n\n\n# ---------------------------------------------------------------- Form A answers\n\ndef show_answer(matter, n, q):\n    settings, lib, answers, items = work_up(matter)\n    current = next((a for a in answers if a[\"n\"] == n), None)\n    if not current:\n        return redirect(f\"/m/{matter['id']}/answers/1\")\n    show = q.get(\"show\") if q.get(\"show\") in dict(pages.FILTERS) else \"all\"\n    if q.get(\"jump\") == \"1\" and not pages.in_filter(current, show):\n        # a filter was just chosen: open the first answer that matches it\n        first = next((a for a in answers if pages.in_filter(a, show)), None)\n        if first:\n            return redirect(f\"/m/{matter['id']}/answers/{first['n']}?show={show}\")\n    main = pages.answers_page(matter, answers, current, show, settings, lib[\"clauses\"])\n    return matter_page(matter, f\"No. {n}\", main, \"answers\", settings, answers, items)\n\n\ndef save_answer(matter, n, q, form):\n    settings, lib, answers, items = work_up(matter)\n    answer = next((a for a in answers if a[\"n\"] == n), None)\n    if not answer:\n        return not_found()\n    show = q.get(\"show\") if q.get(\"show\") in dict(pages.FILTERS) else \"all\"\n    here = f\"/m/{matter['id']}/answers/{n}?show={show}\"\n    saved = matter.setdefault(\"answers\", {}).setdefault(str(n), {})\n    action = form.get(\"action\", \"save\")\n\n    if form.has(\"note\"):\n        saved[\"note\"] = form.text(\"note\")\n\n    if action == \"revert\":\n        saved.pop(\"text\", None)\n        saved.pop(\"base\", None)\n        flash(\"Returned to the automatic draft.\")\n    elif action == \"keep\":\n        saved[\"base\"] = answer[\"auto\"]\n        flash(\"Kept the edited wording.\")\n    else:\n        text = form.text(\"text\") if form.has(\"text\") else answer[\"final\"]\n        if action == \"insert\":\n            text = insert_clause(text, lib[\"clauses\"], form.get(\"clause\"))\n        if text != answer[\"final\"]:\n            if text == answer[\"auto\"]:\n                saved.pop(\"text\", None)\n                saved.pop(\"base\", None)\n            else:\n                saved[\"text\"] = text\n                saved[\"base\"] = answer[\"auto\"]\n\n    if action in SIGN_OFF_DONE:\n        fresh = next(a for a in drafting.draft_answers(matter, settings, lib) if a[\"n\"] == n)\n        if action in (\"check\", \"approve\") and fresh[\"missing_count\"]:\n            storage.save_matter(matter)\n            flash(\"Fill in the missing items before signing off.\", \"red\")\n            return redirect(here)\n        sign_off(saved, action, fresh[\"final\"], settings)\n        storage.save_matter(matter)\n        flash(f\"No. {n} {SIGN_OFF_DONE[action]}.\")\n        if action in (\"check\", \"approve\"):\n            _, next_n = pages.neighbours(answers, answer, show)\n            if next_n:\n                return redirect(f\"/m/{matter['id']}/answers/{next_n}?show={show}\")\n        return redirect(here)\n\n    storage.save_matter(matter)\n    if action in (\"save\", \"insert\"):\n        flash(\"Saved.\")\n    return redirect(here)\n\n\ndef insert_clause(text, clauses, choice):\n    \"\"\"Objections go in front of the answer. Standard language goes at the end.\"\"\"\n    if not choice.isdigit() or int(choice) >= len(clauses):\n        return text\n    clause = clauses[int(choice)]\n    if clause.get(\"kind\") == \"objection\":\n        return f\"{clause['text']}\\n\\n{text}\".strip()\n    return f\"{text}\\n\\n{clause['text']}\".strip()\n\n\n# ---------------------------------------------------------------- supplemental questions\n\ndef show_supplemental(matter):\n    settings, lib, answers, items = work_up(matter)\n    main = pages.supplemental_page(matter, items, settings, lib)\n    return matter_page(matter, \"Supplemental questions\", main, \"supplemental\", settings, answers, items)\n\n\ndef split_questions(text):\n    \"\"\"Splits pasted questions at lines that begin with a number, such as '3.' or '3)'.\n    Anything before the first number (a heading, for example) is left out.\"\"\"\n    text = text.strip()\n    starts = list(re.finditer(r\"(?m)^[ \\t]*\\d{1,2}[ \\t]*[.)][ \\t]+\", text))\n    if not starts:\n        return [text] if text else []\n    found = []\n    for k, m in enumerate(starts):\n        end = starts[k + 1].start() if k + 1 \u003c len(starts) else len(text)\n        piece = text[m.end():end].strip()\n        if piece:\n            found.append(piece)\n    return found\n\n\ndef save_supplemental(matter, form):\n    settings, lib, _, _ = work_up(matter)\n    base = f\"/m/{matter['id']}/supplemental\"\n    rows = matter.setdefault(\"supp\", {}).setdefault(\"items\", [])\n\n    for i, item in enumerate(rows):\n        if form.has(f\"q-{i}\"):\n            item[\"q\"] = form.text(f\"q-{i}\")\n        if form.has(f\"a-{i}\"):\n            item[\"a\"] = form.text(f\"a-{i}\")\n\n    action = form.get(\"action\", \"save\")\n    parts = action.split(\":\")\n    anchor = \"\"\n\n    if action == \"add_pasted\":\n        new = split_questions(form.text(\"paste\"))\n        if not new:\n            flash(\"Paste the questions into the box first.\", \"red\")\n            return redirect(base)\n        anchor = f\"#s-{len(rows)}\"\n        rows.extend({\"q\": q, \"a\": \"\"} for q in new)\n        flash(f\"Added {len(new)} question{'' if len(new) == 1 else 's'}.\")\n    elif action == \"add_blank\":\n        anchor = f\"#s-{len(rows)}\"\n        rows.append({\"q\": \"\", \"a\": \"\"})\n    elif parts[0].isdigit() and len(parts) == 2 and parts[1] in SIGN_OFF_DONE:\n        i, verb = int(parts[0]), parts[1]\n        anchor = f\"#s-{i}\"\n        fresh = drafting.draft_supplemental(matter, lib)\n        if i \u003c len(fresh):\n            if verb in (\"check\", \"approve\") and fresh[i][\"missing_count\"]:\n                flash(\"Write the answer and fill in any missing items before signing off.\", \"red\")\n            else:\n                sign_off(rows[i], verb, fresh[i][\"a\"], settings)\n                flash(f\"Supplemental No. {i + 1} {SIGN_OFF_DONE[verb]}.\")\n    elif len(parts) >= 2 and parts[1].isdigit() and int(parts[1]) \u003c len(rows):\n        verb, i = parts[0], int(parts[1])\n        item = rows[i]\n        anchor = f\"#s-{i}\"\n        if verb == \"remove\":\n            rows.pop(i)\n            anchor = f\"#s-{i - 1}\" if i else \"\"\n            flash(\"Question removed.\")\n        elif verb in (\"use\", \"pick\"):\n            choice = parts[2] if verb == \"use\" and len(parts) > 2 else form.get(f\"pick-{i}\")\n            if choice.isdigit() and int(choice) \u003c len(lib[\"supplemental\"]):\n                use_standard_answer(matter, item, int(choice), lib, settings)\n        elif verb == \"object\" and len(parts) > 2:\n            clause = next((c for c in lib[\"clauses\"] if c.get(\"id\") == parts[2]), None)\n            if clause:\n                item[\"a\"] = f\"{clause['text']}\\n\\n{item.get('a', '')}\".strip()\n            else:\n                flash(\"That objection is no longer in the Forms library.\", \"red\")\n        elif verb == \"objection\":\n            item[\"a\"] = insert_clause(item.get(\"a\", \"\"), lib[\"clauses\"], form.get(f\"objection-{i}\"))\n    else:\n        flash(\"Saved.\")\n\n    storage.save_matter(matter)\n    return redirect(base + anchor)\n\n\ndef use_standard_answer(matter, item, k, lib, settings):\n    \"\"\"Fills in standard answer number k. Anything blank on the Client screen is marked MISSING.\n\n    While the answer is made only of standard answers and nobody has retyped it, it is drafted\n    again each time the intake is saved, so facts entered later flow into it.\"\"\"\n    untouched = not item.get(\"a\") or item.get(\"a\") == item.get(\"stdText\")\n    text, missing = drafting.render(lib[\"supplemental\"][k][\"tpl\"], drafting.context_for(matter, settings))\n    item[\"a\"] = f\"{item.get('a', '')}\\n\\n{text}\".strip()\n    known = item.setdefault(\"miss\", [])\n    for m in missing:\n        if not any(x[\"label\"] == m[\"label\"] for x in known):\n            known.append(m)\n    if untouched:\n        item[\"std\"] = item.get(\"std\", []) + [k]\n        item[\"stdText\"] = item[\"a\"]\n    else:\n        item.pop(\"std\", None)\n        item.pop(\"stdText\", None)\n\n\ndef refresh_standard_answers(matter, settings, lib):\n    context = None\n    for item in matter.get(\"supp\", {}).get(\"items\", []):\n        used = [k for k in item.get(\"std\", []) if k \u003c len(lib[\"supplemental\"])]\n        if not used or item.get(\"a\") != item.get(\"stdText\"):\n            continue\n        context = context or drafting.context_for(matter, settings)\n        texts, missing = [], []\n        for k in used:\n            text, miss = drafting.render(lib[\"supplemental\"][k][\"tpl\"], context)\n            texts.append(text)\n            missing.extend(m for m in miss if not any(x[\"label\"] == m[\"label\"] for x in missing))\n        item[\"a\"] = item[\"stdText\"] = \"\\n\\n\".join(texts)\n        item[\"miss\"] = missing\n\n\n# ---------------------------------------------------------------- finish and serve\n\ndef show_finish(matter):\n    settings, lib, answers, items = work_up(matter)\n    context = drafting.context_for(matter, settings)\n    paper = documents.answers_paper(matter, settings, context, answers, items)\n    main = pages.finish_page(matter, settings, context[\"calc\"], answers, items, documents.to_html(paper))\n    return matter_page(matter, \"Finish and serve\", main, \"finish\", settings, answers, items)\n\n\ndef save_finish(matter, form):\n    settings = storage.load_settings()\n    calc = drafting.worked_out(matter, settings)\n    checklist = matter.setdefault(\"checklist\", {})\n    for key, _, _ in calc[\"attachments\"]:\n        checklist[\"att:\" + key] = form.has(\"att:\" + key)\n    for provider in calc[\"hipaa\"]:\n        checklist[\"hipaa:\" + provider[\"name\"]] = form.has(\"hipaa:\" + provider[\"name\"])\n    served = form.get(\"served\").strip()\n    if served:\n        matter.setdefault(\"served\", {})[\"date\"] = served\n    else:\n        matter.setdefault(\"served\", {}).pop(\"date\", None)\n    storage.save_matter(matter)\n    flash(\"Saved.\")\n    return redirect(f\"/m/{matter['id']}/finish\")\n\n\n# ---------------------------------------------------------------- client questionnaire\n\ndef questionnaire_version(q):\n    return \"prefilled\" if q.get(\"version\") == \"prefilled\" else \"blank\"\n\n\ndef show_questionnaire(matter, q):\n    settings, _, answers, items = work_up(matter)\n    version = questionnaire_version(q)\n    paper = documents.questionnaire_paper(matter, settings, version == \"prefilled\")\n    main = pages.questionnaire_page(matter, version, documents.to_html(paper))\n    return matter_page(matter, \"Client questionnaire\", main, \"questionnaire\", settings, answers, items)\n\n\n# ---------------------------------------------------------------- motion papers\n\ndef motion_papers(matter, q, settings):\n    motion = MOTIONS_BY_ID.get(q.get(\"type\")) or MOTIONS[0]\n    doc = q.get(\"doc\")\n    doc_index = int(doc) if doc.isdigit() and int(doc) \u003c len(motion[\"docs\"]) else 0\n    values = motion_values(matter, motion)\n    extras = motion_extras(motion, values)\n    rows, warnings = deadline_rows(matter, motion, values, extras)\n    context = drafting.context_for(matter, settings)\n    context[\"m\"] = values\n    context[\"calc\"].update(extras)\n    paper, missing = documents.motion_paper(matter, settings, context, motion, motion[\"docs\"][doc_index])\n    return motion, doc_index, values, rows, warnings, paper, missing\n\n\ndef show_motion(matter, q):\n    settings, _, answers, items = work_up(matter)\n    motion, doc_index, values, rows, warnings, paper, missing = motion_papers(matter, q, settings)\n    main = pages.motions_page(matter, motion, values, doc_index, rows, warnings, documents.to_html(paper), missing)\n    return matter_page(matter, \"Motion papers\", main, \"motions\", settings, answers, items)\n\n\ndef save_motion(matter, q, form):\n    motion = MOTIONS_BY_ID.get(q.get(\"type\")) or MOTIONS[0]\n    stored = matter.setdefault(\"motions\", {}).setdefault(motion[\"id\"], {})\n    defaults = motion[\"defaults\"](matter)\n    for f in motion[\"fields\"]:\n        name = \"m.\" + f[\"k\"]\n        if f.get(\"t\") == \"yn\" and not form.has(name):\n            continue\n        value = form.text(name)\n        # Only keep what staff changed, so a default (such as the served date) can still update itself.\n        if f[\"k\"] in stored or value != defaults.get(f[\"k\"], \"\"):\n            stored[f[\"k\"]] = value\n    stored[\"packet\"] = {str(n): True for n in range(len(motion[\"packet\"])) if form.has(f\"packet:{n}\")}\n    storage.save_matter(matter)\n    flash(\"Saved.\")\n    return redirect(f\"/m/{matter['id']}/motions?type={motion['id']}&doc={q.get('doc') or 0}\")\n\n\n# ---------------------------------------------------------------- Word files and print views\n\ndef build_paper(matter, which, q):\n    \"\"\"Returns (paper, file name, back address) for answers, questionnaire or motion.\"\"\"\n    settings, _, answers, items = work_up(matter)\n    plaintiff = matter.get(\"caption\", {}).get(\"plaintiff\") or \"Untitled\"\n    base = f\"/m/{matter['id']}\"\n    if which == \"answers\":\n        context = drafting.context_for(matter, settings)\n        paper = documents.answers_paper(matter, settings, context, answers, items)\n        return paper, file_name(\"Form A Answers\", plaintiff), f\"{base}/finish\"\n    if which == \"questionnaire\":\n        version = questionnaire_version(q)\n        paper = documents.questionnaire_paper(matter, settings, version == \"prefilled\")\n        return paper, file_name(\"Client Questionnaire\", plaintiff), f\"{base}/questionnaire?version={version}\"\n    if which == \"motion\":\n        motion, doc_index, _, _, _, paper, _ = motion_papers(matter, q, settings)\n        title = motion[\"docs\"][doc_index][\"title\"]\n        return paper, file_name(title, plaintiff), f\"{base}/motions?type={motion['id']}&doc={doc_index}\"\n    return None, \"\", \"\"\n\n\ndef download_file(matter, name, q):\n    which = name[:-5] if name.endswith(\".docx\") else \"\"\n    paper, filename, _ = build_paper(matter, which, q)\n    if not paper:\n        return not_found()\n    return download(documents.to_docx(paper), filename)\n\n\ndef print_view(matter, which, q):\n    paper, filename, back = build_paper(matter, which, q)\n    if not paper:\n        return not_found()\n    return {\"status\": 200, \"type\": HTML,\n            \"body\": pages.print_page(filename[:-5], documents.to_html(paper), back)}\n\n\n# ---------------------------------------------------------------- firm settings\n\nSETTING_KEYS = [\"name\", \"attorney\", \"attorneyId\", \"address\", \"phone\", \"email\", \"paralegal\", \"prelim\", \"cert\"]\n\n\ndef show_settings():\n    in_browser = isinstance(storage.store, storage.BrowserStore)\n    return page(\"Firm settings\", pages.settings_page(storage.load_settings(), in_browser), active=\"settings\")\n\n\ndef save_settings(form):\n    settings = storage.load_settings()\n    for key in SETTING_KEYS:\n        if form.has(key):\n            settings[key] = form.text(key)\n    if form.get(\"ssnMode\") in (\"last4\", \"separate\"):\n        settings[\"ssnMode\"] = form.get(\"ssnMode\")\n    if form.get(\"desig\") in (\"answer\", \"off\"):\n        settings[\"desig\"] = form.get(\"desig\")\n    if form.get(\"action\") == \"restore\":\n        settings[\"prelim\"] = storage.DEFAULT_SETTINGS[\"prelim\"]\n        settings[\"cert\"] = storage.DEFAULT_SETTINGS[\"cert\"]\n        flash(\"The opening paragraph and certification are back to the defaults.\")\n    else:\n        flash(\"Settings saved.\")\n    storage.save_settings(settings)\n    return redirect(\"/settings\")\n\n\n# ---------------------------------------------------------------- forms library\n\ndef library_route(post, rest, form):\n    if not rest:\n        return page(\"Forms library\", pages.library_page(storage.library()), active=\"library\")\n    if rest[0] == \"q\" and len(rest) == 2 and rest[1].isdigit():\n        return save_library_question(int(rest[1]), form) if post else show_library_question(int(rest[1]))\n    if rest[0] == \"standard\" and len(rest) == 2:\n        return save_standard(rest[1], form) if post else show_standard(rest[1])\n    if rest[0] == \"clauses\":\n        return save_clauses(form) if post else page(\n            \"Standard language\", pages.library_clauses_page(storage.library()[\"clauses\"]), active=\"library\")\n    return not_found()\n\n\ndef preview(template):\n    \"\"\"Drafts the template against the most recently updated matter, so the wording can be checked.\"\"\"\n    matters = storage.all_matters()\n    sample = matters[0] if matters else storage.new_matter()\n    text, missing = drafting.render(template, drafting.context_for(sample, storage.load_settings()))\n    source = f\"the most recent matter, {pages.matter_title(sample)}\" if matters else \"an empty matter\"\n    return pages.preview_block(source, text, missing)\n\n\ndef show_library_question(n):\n    q = next((x for x in storage.library()[\"questions\"] if x[\"n\"] == n), None)\n    if not q:\n        return not_found()\n    return page(f\"Question {n}\", pages.library_question_page(q, preview(q[\"tpl\"])), active=\"library\")\n\n\ndef save_library_question(n, form):\n    original = next((x for x in form_a.FORM_A if x[\"n\"] == n), None)\n    if not original:\n        return not_found()\n    changes = storage.load_library_changes()\n    edited = changes.setdefault(\"questions\", {})\n    text, tpl = form.text(\"text\"), form.text(\"tpl\")\n    if form.get(\"action\") == \"restore\" or (text == original[\"text\"] and tpl == original[\"tpl\"]):\n        edited.pop(str(n), None)\n        flash(\"Question restored to the original wording.\")\n    else:\n        edited[str(n)] = {\"text\": text, \"tpl\": tpl}\n        flash(\"Saved. The change applies to every matter.\")\n    storage.save_library_changes(changes)\n    return redirect(f\"/library/q/{n}\")\n\n\ndef show_standard(k):\n    entries = storage.library()[\"supplemental\"]\n    if k == \"new\":\n        entry = {\"name\": \"\", \"words\": [], \"tpl\": \"\"}\n    elif k.isdigit() and int(k) \u003c len(entries):\n        entry = entries[int(k)]\n    else:\n        return not_found()\n    shown = preview(entry[\"tpl\"]) if entry[\"tpl\"] else \"\"\n    return page(\"Standard answer\", pages.library_standard_page(k, entry, shown), active=\"library\")\n\n\ndef save_standard(k, form):\n    changes = storage.load_library_changes()\n    entries = storage.library()[\"supplemental\"]\n    entry = {\"name\": form.text(\"name\") or \"Untitled\",\n             \"words\": [w.strip() for w in form.text(\"words\").split(\",\") if w.strip()],\n             \"tpl\": form.text(\"tpl\")}\n    if k == \"new\":\n        entries.append(entry)\n        k = str(len(entries) - 1)\n        flash(\"Standard answer added.\")\n    elif k.isdigit() and int(k) \u003c len(entries):\n        if form.get(\"action\") == \"remove\":\n            entries.pop(int(k))\n            changes[\"supplemental\"] = entries\n            storage.save_library_changes(changes)\n            flash(\"Standard answer removed.\")\n            return redirect(\"/library\")\n        entries[int(k)] = entry\n        flash(\"Saved.\")\n    else:\n        return not_found()\n    changes[\"supplemental\"] = entries\n    storage.save_library_changes(changes)\n    return redirect(f\"/library/standard/{k}\")\n\n\ndef save_clauses(form):\n    changes = storage.load_library_changes()\n    clauses = storage.library()[\"clauses\"]\n    updated = []\n    for i in range(len(clauses)):\n        clause = {\"kind\": \"objection\" if form.get(f\"c-{i}-kind\

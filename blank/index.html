\\n\\n\"\n                    \"[ATTORNEY: In two or three paragraphs, state why genuine disputes of material fact preclude \"\n                    \"summary judgment.]\\n\\n\"\n                    \"## COUNTER-STATEMENT OF FACTS\\n\\n\"\n                    \"On {{police.date|date}}, plaintiff {{caption.plaintiff}} was involved in {{calc.incidentNoun}} at \"\n                    \"or near {{police.location}}, {{police.municipality}}, New Jersey.{{#if calc.isAuto}} Plaintiff \"\n                    \"was {{client.role}} a {{police.plaintiffVehicle}}. {{police.contactPoints}}{{/if}} The \"\n                    \"{{police.agency}} investigated{{#if police.defendantSummons}} and issued a summons to defendant \"\n                    \"for {{police.defendantSummons}}{{/if}}.\\n\\n\"\n                    \"Plaintiff's treating providers diagnosed the following injuries: {{medical.injuries}}\\n\\n\"\n                    \"{{#if medical.permanent}}Plaintiff's treating physician has identified the following permanent \"\n                    \"injury: {{medical.permanent}}{{/if}}\\n\\n\"\n                    \"[ATTORNEY: Add a citation to the motion record for each fact above.]\\n\\n\"\n                    \"## LEGAL ARGUMENT\\n\\n\"\n                    \"## POINT I\\n## THE SUMMARY JUDGMENT STANDARD\\n\\n\"\n                    \"{{clause.sj}}\\n\\n\"\n                    \"{{#if m.ground == threshold}}## POINT II\\n## PLAINTIFF HAS SUSTAINED A PERMANENT INJURY WITHIN \"\n                    \"THE MEANING OF N.J.S.A. 39:6A-8(a)\\n\\n{{clause.verbal}}\\n\\n\"\n                    \"[ATTORNEY: Apply the objective medical evidence in the record (imaging, diagnostic testing, the \"\n                    \"physician certification of permanency) to the statutory categories.]\"\n                    \"{{else}}{{#if m.ground == liability}}## POINT II\\n## GENUINE DISPUTES OF MATERIAL FACT EXIST AS \"\n                    \"TO LIABILITY\\n\\n[ATTORNEY: Identify each disputed fact and the record evidence that creates the \"\n                    \"dispute.]{{else}}## POINT II\\n\\n[ATTORNEY: Argument.]{{/if}}{{/if}}\\n\\n\"\n                    \"## CONCLUSION\\n\\n\"\n                    \"For the foregoing reasons, plaintiff respectfully requests that the Court deny defendant's motion \"\n                    \"for summary judgment.\"},\n            {\"id\": \"rsmf\", \"title\": \"Responding statement\",\n             \"heading\": \"PLAINTIFF'S RESPONDING STATEMENT OF MATERIAL FACTS PURSUANT TO R. 4:46-2(b)\", \"sig\": \"attorney\",\n             \"tpl\": \"Pursuant to R. 4:46-2(b), plaintiff {{caption.plaintiff}} responds to the Statement of Material \"\n                    \"Facts submitted by defendant {{m.movant}} as follows:\\n\\n\"\n                    \"{{#each calc.rsmf}}{{.}}. [ATTORNEY: Admitted, or denied with a citation to the motion record.]\"\n                    \"\\n\\n{{/each}}\"\n                    \"## PLAINTIFF'S SUPPLEMENTAL STATEMENT OF MATERIAL FACTS\\n\\n\"\n                    \"1. On {{police.date|date}}, plaintiff was involved in {{calc.incidentNoun}} at or near \"\n                    \"{{police.location}}, {{police.municipality}}, New Jersey. [ATTORNEY: Cite the police report \"\n                    \"exhibit.]\\n\\n\"\n                    \"2. Plaintiff was diagnosed with the following injuries: {{medical.injuries}} [ATTORNEY: Cite the \"\n                    \"medical records exhibits.]\\n\\n\"\n                    \"3. {{#if medical.permanent}}Plaintiff's treating physician has identified the following permanent \"\n                    \"injury: {{medical.permanent}}{{else}}[ATTORNEY: State the additional material fact.]{{/if}} \"\n                    \"[ATTORNEY: Cite the physician's report or certification.]\"},\n            SERVICE_CERT,\n        ],\n    },\n    {\n        \"id\": \"movExt\", \"title\": \"Motion to extend discovery\", \"rule\": \"R. 4:24-1(c)\",\n        \"ours\": True, \"file_days\": 16, \"file_rule\": \"R. 1:6-3(a)\", \"opp_days\": 8,\n        \"summary\": \"Builds the notice, certification and order from the discovery history you describe.\",\n        \"fields\": [\n            {\"k\": \"judge\", \"l\": \"Motion judge (last name)\"},\n            {\"k\": \"returnDate\", \"l\": \"Return date\", \"t\": \"date\"},\n            {\"k\": \"discoveryEnd\", \"l\": \"Current discovery end date\", \"t\": \"date\"},\n            {\"k\": \"days\", \"l\": \"Days of extension\", \"t\": \"number\"},\n            {\"k\": \"prior\", \"l\": \"Discovery previously extended?\", \"t\": \"yn\"},\n            {\"k\": \"arbitration\", \"l\": \"Arbitration or trial date already set?\", \"t\": \"yn\"},\n            {\"k\": \"completed\", \"l\": \"Discovery completed\", \"t\": \"area\", \"full\": True},\n            {\"k\": \"remaining\", \"l\": \"Discovery remaining\", \"t\": \"area\", \"full\": True},\n            {\"k\": \"reasons\", \"l\": \"Why it is not complete\", \"t\": \"area\", \"full\": True},\n            {\"k\": \"serviceDate\", \"l\": \"Date this motion is filed\", \"t\": \"date\"},\n        ],\n        \"defaults\": lambda m: {\"discoveryEnd\": m.get(\"caption\", {}).get(\"discoveryEnd\", \"\"), \"days\": \"60\"},\n        \"packet\": [\"Notice of motion\", \"Certification of counsel\", \"Proposed form of order\", \"Certification of service\"],\n        \"docs\": [\n            {\"id\": \"notice\", \"title\": \"Notice of motion\", \"heading\": \"NOTICE OF MOTION TO EXTEND DISCOVERY\",\n             \"sig\": \"attorney\",\n             \"tpl\": \"| TO: All counsel of record\\n\\n\"\n                    \"PLEASE TAKE NOTICE that on {{m.returnDate|date}}, at 9:00 a.m. or as soon thereafter as counsel \"\n                    \"may be heard, the undersigned, attorneys for plaintiff, shall move before the Honorable \"\n                    \"{{m.judge}}, J.S.C., Superior Court of New Jersey, Law Division, {{caption.county}} County, for an \"\n                    \"Order pursuant to R. 4:24-1(c) extending the time for discovery by {{m.days}} days, from \"\n                    \"{{m.discoveryEnd|date}} to {{calc.newEnd|date}}.\\n\\n\" + NOTICE_ENDING},\n            {\"id\": \"cert\", \"title\": \"Certification\",\n             \"heading\": \"CERTIFICATION OF COUNSEL IN SUPPORT OF MOTION TO EXTEND DISCOVERY\", \"sig\": \"cert\",\n             \"tpl\": \"{{firm.attorney}}, of full age, hereby certifies as follows:\\n\\n\"\n                    \"1. I am an attorney at law of the State of New Jersey and a member of {{firm.name}}, attorneys for \"\n                    \"plaintiff {{caption.plaintiff}}. I submit this certification in support of plaintiff's motion to \"\n                    \"extend discovery pursuant to R. 4:24-1(c).\\n\\n\"\n                    \"2. The current discovery end date is {{m.discoveryEnd|date}}.{{#if m.prior == yes}} Discovery has \"\n                    \"previously been extended.{{else}} Discovery has not previously been extended.{{/if}}\\n\\n\"\n                    \"3. The following discovery has been completed: {{m.completed}}\\n\\n\"\n                    \"4. The following discovery remains to be completed: {{m.remaining}}\\n\\n\"\n                    \"5. Discovery has not been completed within the time allowed for the following reasons: \"\n                    \"{{m.reasons}}\\n\\n\"\n                    \"6. {{#if m.arbitration == yes}}An arbitration or trial date has been fixed. Plaintiff submits \"\n                    \"that the circumstances described above are exceptional and warrant the extension under \"\n                    \"R. 4:24-1(c).{{else}}No arbitration or trial date has been fixed. Plaintiff submits that good \"\n                    \"cause exists for the extension under R. 4:24-1(c).{{/if}}\\n\\n\"\n                    \"7. Plaintiff respectfully requests that discovery be extended by {{m.days}} days, to \"\n                    \"{{calc.newEnd|date}}.\\n\\n\" + CERT_ENDING},\n            {\"id\": \"order\", \"title\": \"Proposed order\", \"heading\": \"ORDER EXTENDING DISCOVERY\", \"sig\": \"order\",\n             \"tpl\": \"THIS MATTER having been opened to the Court by {{firm.name}}, attorneys for plaintiff \"\n                    \"{{caption.plaintiff}}, on notice to all counsel of record, and the Court having considered the \"\n                    \"papers submitted, and for good cause shown;\\n\\n\"\n                    \"IT IS on this ______ day of ____________________, 20____, ORDERED that the time for discovery in \"\n                    \"this matter is extended to {{calc.newEnd|date}}; and\\n\\n\"\n                    \"IT IS FURTHER ORDERED that a copy of this Order shall be served upon all counsel of record within \"\n                    \"______ days of the date hereof.\"},\n            SERVICE_CERT,\n        ],\n    },\n]\n\nMOTIONS_BY_ID = {m[\"id\"]: m for m in MOTIONS}\n\n\ndef motion_values(matter, motion):\n    \"\"\"What staff entered for this motion, with sensible defaults for anything not entered yet.\"\"\"\n    stored = matter.setdefault(\"motions\", {}).get(motion[\"id\"], {})\n    values = dict(stored)\n    for key, value in motion[\"defaults\"](matter).items():\n        if key not in stored:\n            values[key] = value\n    return values\n\n\ndef motion_extras(motion, values):\n    \"\"\"Values the motion templates use that are worked out from the details.\"\"\"\n    extra = {}\n    if motion[\"id\"] == \"mov4235\" and values.get(\"defAnswerServed\"):\n        extra[\"formCDue\"] = dates.add_days(values[\"defAnswerServed\"], 60)\n    if motion[\"id\"] == \"movExt\" and values.get(\"discoveryEnd\"):\n        days = dates.to_number(values.get(\"days\")) or 60\n        extra[\"newEnd\"] = dates.add_days(values[\"discoveryEnd\"], int(days))\n    if motion[\"id\"] == \"opp4235\":\n        extra[\"pn\"] = 5 if values.get(\"withdrawRequest\") else 4\n    if motion[\"id\"] == \"oppSJ\":\n        count = int(dates.to_number(values.get(\"paraCount\")) or 1)\n        extra[\"rsmf\"] = list(range(1, max(1, min(80, count)) + 1))\n    return extra\n\n\ndef deadline_rows(matter, motion, values, extras):\n    \"\"\"Returns (rows, warnings). Each row is (label, note, iso_date).\"\"\"\n    rows, warnings = [], []\n    rd = values.get(\"returnDate\")\n    if not rd:\n        return rows, warnings\n    if motion[\"ours\"]:\n        rows.append((\"File and serve the motion\", f\"{motion['file_days']} days before, {motion['file_rule']}\",\n                     dates.add_days(rd, -motion[\"file_days\"])))\n        rows.append((\"Opposition due from defense\", f\"{motion['opp_days']} days before\",\n                     dates.add_days(rd, -motion[\"opp_days\"])))\n        rows.append((\"Reply papers\", \"4 days before, R. 1:6-3(a)\", dates.add_days(rd, -4)))\n    else:\n        rows.append((\"Opposition due\", f\"{motion['opp_days']} days before, {motion['opp_rule']}\",\n                     dates.add_days(rd, -motion[\"opp_days\"])))\n        rows.append((\"Movant reply due\", \"4 days before\", dates.add_days(rd, -4)))\n\n    if motion[\"id\"] == \"mov4235\":\n        due = extras.get(\"formCDue\")\n        if due and (dates.days_until(due) or 0) > 0:\n            warnings.append(f\"Defendant's Form C answers are not overdue until {dates.long_date(due)}. \"\n                            \"A motion filed earlier is premature.\")\n        if not matter.get(\"served\", {}).get(\"date\"):\n            warnings.append(\"Plaintiff's own Form A answers are not marked served. R. 4:23-5(a)(3) requires \"\n                            \"certifying that plaintiff is not in default.\")\n    if motion[\"id\"] == \"movExt\" and values.get(\"discoveryEnd\") and rd > values[\"discoveryEnd\"]:\n        warnings.append(\"The return date falls after the current discovery end date. Under R. 4:24-1(c) the motion \"\n                        \"should be returnable before discovery closes; check the rule and the return date.\")\n    if motion[\"id\"] == \"opp4235\" and not values.get(\"answersServed\"):\n        warnings.append(\"This opposition depends on serving the Form A answers first. Record the service date on the \"\n                        \"Finish screen or in the details.\")\n    return rows, warnings\n", "storage.py": "\"\"\"Where things are kept.\n\nThe office version keeps plain JSON files next to the program:\n\n    data/matters/\u003cid>.json   one file per matter\n    data/deleted/            matters moved here when deleted (never erased)\n    data/settings.json       firm letterhead and defaults\n    data/library.json        only the wording the office has changed\n\nSet the DRAFTER_DATA environment variable to keep the data folder somewhere\nelse, for example on the shared drive.\n\nThe web version (index.html) runs the same code inside the browser and keeps\nthe same records in the browser's own storage instead. See use_browser_storage().\n\"\"\"\n\nimport json\nimport os\nimport re\nimport shutil\nimport uuid\nfrom datetime import datetime\n\nimport form_a\nimport standard_text\n\nAPP_DIR = os.path.dirname(os.path.abspath(__file__))\nDATA_DIR = os.environ.get(\"DRAFTER_DATA\") or os.path.join(APP_DIR, \"data\")\n\n\nclass FileStore:\n    \"\"\"Each key is a JSON file under the data folder. 'matters/ab12' -> data/matters/ab12.json\"\"\"\n\n    def __init__(self, root):\n        self.root = root\n\n    def _path(self, key):\n        return os.path.join(self.root, *key.split(\"/\")) + \".json\"\n\n    def read(self, key, default=None):\n        try:\n            with open(self._path(key), encoding=\"utf-8\") as f:\n                return json.load(f)\n        except FileNotFoundError:\n            return default\n        except (ValueError, OSError):\n            # a damaged file should not stop the program; it is left in place so it can be repaired\n            return default\n\n    def write(self, key, data):\n        path = self._path(key)\n        os.makedirs(os.path.dirname(path), exist_ok=True)\n        temp = path + \".tmp\"\n        with open(temp, \"w\", encoding=\"utf-8\") as f:\n            json.dump(data, f, indent=2, ensure_ascii=False)\n        os.replace(temp, path)\n\n    def remove(self, key, keep_as):\n        path = self._path(key)\n        if os.path.exists(path):\n            target = self._path(keep_as)\n            os.makedirs(os.path.dirname(target), exist_ok=True)\n            shutil.move(path, target)\n\n    def keys(self, folder):\n        directory = os.path.join(self.root, folder)\n        if not os.path.isdir(directory):\n            return []\n        return [f\"{folder}/{name[:-5]}\" for name in os.listdir(directory) if name.endswith(\".json\")]\n\n\nclass BrowserStore:\n    \"\"\"Same interface, backed by the browser's localStorage. Only used by the web version.\"\"\"\n\n    PREFIX = \"drafter/\"\n\n    def __init__(self):\n        from js import localStorage  # available only when running in the browser\n        self.ls = localStorage\n\n    def read(self, key, default=None):\n        raw = self.ls.getItem(self.PREFIX + key)\n        if raw is None:\n            return default\n        try:\n            return json.loads(raw)\n        except ValueError:\n            return default\n\n    def write(self, key, data):\n        self.ls.setItem(self.PREFIX + key, json.dumps(data))\n\n    def remove(self, key, keep_as):\n        data = self.read(key)\n        if data is not None:\n            self.write(keep_as, data)\n            self.ls.removeItem(self.PREFIX + key)\n\n    def keys(self, folder):\n        start = f\"{self.PREFIX}{folder}/\"\n        found = []\n        for i in range(self.ls.length):\n            name = self.ls.key(i)\n            if name and name.startswith(start):\n                found.append(name[len(self.PREFIX):])\n        return found\n\n\nstore = FileStore(DATA_DIR)\n\n\ndef use_browser_storage():\n    global store\n    store = BrowserStore()\n\n\n# ---- matters ----\n\ndef new_matter():\n    return {\n        \"id\": uuid.uuid4().hex[:12],\n        \"caption\": {\"caseType\": \"auto\"},\n        \"police\": {\"witnesses\": []},\n        \"medical\": {\"providers\": [], \"tests\": [], \"priors\": []},\n        \"client\": {\"witnesses\": [], \"others\": [], \"photos\": []},\n        \"attorney\": {\"experts\": []},\n        \"answers\": {},\n        \"supp\": {\"items\": []},\n        \"served\": {},\n        \"checklist\": {},\n        \"motions\": {},\n    }\n\n\ndef valid_id(matter_id):\n    return bool(re.fullmatch(r\"[a-f0-9]{6,32}\", matter_id or \"\"))\n\n\ndef load_matter(matter_id):\n    if not valid_id(matter_id):\n        return None\n    matter = store.read(f\"matters/{matter_id}\")\n    if not isinstance(matter, dict):\n        return None\n    # records saved by an older version may be missing a section\n    for key, value in new_matter().items():\n        matter.setdefault(key, value)\n    matter[\"id\"] = matter_id\n    return matter\n\n\ndef save_matter(matter):\n    matter[\"updated\"] = datetime.now().isoformat(timespec=\"seconds\")\n    store.write(f\"matters/{matter['id']}\", matter)\n\n\ndef delete_matter(matter_id):\n    if valid_id(matter_id):\n        stamp = datetime.now().strftime(\"%Y%m%d-%H%M%S\")\n        store.remove(f\"matters/{matter_id}\", f\"deleted/{matter_id}-{stamp}\")\n\n\ndef all_matters():\n    found = []\n    for key in store.keys(\"matters\"):\n        matter = load_matter(key.split(\"/\", 1)[1])\n        if matter:\n            found.append(matter)\n    found.sort(key=lambda m: m.get(\"updated\", \"\"), reverse=True)\n    return found\n\n\n# ---- firm settings ----\n\nDEFAULT_SETTINGS = {\n    \"name\": \"\",\n    \"attorney\": \"\",\n    \"attorneyId\": \"\",\n    \"address\": \"\",\n    \"phone\": \"\",\n    \"email\": \"\",\n    \"paralegal\": \"\",\n    \"ssnMode\": \"last4\",\n    \"desig\": \"answer\",\n    \"prelim\": form_a.OPENING_PARAGRAPH,\n    \"cert\": form_a.CERTIFICATION,\n}\n\n\ndef load_settings():\n    settings = dict(DEFAULT_SETTINGS)\n    settings.update(store.read(\"settings\", {}) or {})\n    return settings\n\n\ndef save_settings(settings):\n    store.write(\"settings\", settings)\n\n\n# ---- forms library ----\n# Only what the office has changed is saved. Everything else comes from\n# form_a.py and standard_text.py, so a program update can still fix the defaults.\n\ndef load_library_changes():\n    return store.read(\"library\", {}) or {}\n\n\ndef save_library_changes(changes):\n    store.write(\"library\", changes)\n\n\ndef library():\n    changes = load_library_changes()\n    edited = changes.get(\"questions\", {})\n    questions = []\n    for q in form_a.FORM_A:\n        q = dict(q)\n        if str(q[\"n\"]) in edited:\n            q.update(edited[str(q[\"n\"])])\n            q[\"changed\"] = True\n        questions.append(q)\n    return {\n        \"questions\": questions,\n        \"clauses\": changes[\"clauses\"] if \"clauses\" in changes else [dict(c) for c in standard_text.CLAUSES],\n        \"supplemental\": (changes[\"supplemental\"] if \"supplemental\" in changes\n                         else [dict(s) for s in standard_text.SUPPLEMENTAL_ANSWERS]),\n    }\n", "drafting.py": "\"\"\"Turns the intake into draft answers.\n\nTemplate codes (used in form_a.py, standard_text.py and the Forms library):\n\n    {{client.fullName}}                  insert a value\n    {{police.date|date}}                 insert and format: date, time, money, lower, upper\n    {{#if client.employed == yes}} ... {{else}} ... {{/if}}\n    {{#if medical.tests}} ... {{/if}}    true when the value is filled in\n    {{#each calc.providers}}{{.name}}{{/each}}   repeat for each row; {{@a}} gives a, b, c\n    {{need medical.providers}}           always reports the value as missing\n\nA blank value prints [MISSING: label] and is added to the list of things staff\nstill have to fill in. A yes/no question left blank inside {{#if ... == yes}}\nis treated the same way, so nothing defaults to \"no\" by accident.\n\"\"\"\n\nimport re\n\nimport dates\nfrom form_a import SOURCE_LINES\nfrom intake import FIELD_INDEX, index_key\nfrom standard_text import MOTION_CLAUSES\n\nTAG = re.compile(r\"\\{\\{\\s*(#each|#if|/each|/if|else|need)?\\s*([^}]*?)\\s*\\}\\}\")\nMISSING_MARK = re.compile(r\"\\[MISSING: ([^\\]]+)\\]\")\n\n\n# ---- reading and writing dotted paths like \"medical.providers.2.billed\" ----\n\ndef get_path(data, path):\n    current = data\n    for part in path.split(\".\"):\n        if isinstance(current, dict):\n            current = current.get(part)\n        elif isinstance(current, list):\n            try:\n                current = current[int(part)]\n            except (ValueError, IndexError):\n                return None\n        else:\n            return None\n    return current\n\n\ndef set_path(data, path, value):\n    parts = path.split(\".\")\n    current = data\n    for i, part in enumerate(parts[:-1]):\n        nxt_is_index = parts[i + 1].isdigit()\n        if isinstance(current, list):\n            current = current[int(part)]\n            continue\n        if not isinstance(current.get(part), (dict, list)):\n            current[part] = [] if nxt_is_index else {}\n        current = current[part]\n    last = parts[-1]\n    if isinstance(current, list):\n        current[int(last)] = value\n    else:\n        current[last] = value\n\n\ndef is_blank(value):\n    if value is None:\n        return True\n    if isinstance(value, str):\n        return value.strip() == \"\"\n    if isinstance(value, (list, dict)):\n        return len(value) == 0\n    return False\n\n\n# ---- missing information ----\n\ndef describe_missing(path):\n    \"\"\"Label and screen for a value that is missing, e.g. 'Provider 2: Amount billed' on the medical screen.\"\"\"\n    meta = FIELD_INDEX.get(index_key(path))\n    if meta and \"jump\" in meta:\n        jump = meta[\"jump\"]\n        path = path.rsplit(\".\", 1)[0] + jump if jump.startswith(\".\") else jump\n        meta = FIELD_INDEX.get(index_key(path))\n    label = meta[\"label\"] if meta else path\n    row = re.match(r\"^(.*)\\.(\\d+)\\.[^.]+$\", path)\n    if row:\n        parent = FIELD_INDEX.get(index_key(row.group(1)))\n        if parent and parent.get(\"item\"):\n            label = f\"{parent['item']} {int(row.group(2)) + 1}: {label}\"\n    elif meta and meta.get(\"t\") == \"list\":\n        label = f\"{label} (add at least one)\"\n    return {\"path\": path, \"label\": label, \"step\": meta.get(\"step\") if meta else None}\n\n\n# ---- the template engine ----\n\ndef parse(template):\n    root = {\"kids\": []}\n    stack = [root]\n\n    def target():\n        node = stack[-1]\n        return node[\"alt\"] if node.get(\"in_else\") else node[\"kids\"]\n\n    pos = 0\n    for m in TAG.finditer(template):\n        if m.start() > pos:\n            target().append((\"text\", template[pos:m.start()]))\n        keyword, arg = m.group(1), m.group(2)\n        if keyword in (\"#each\", \"#if\"):\n            node = {\"kind\": keyword[1:], \"arg\": arg, \"kids\": [], \"alt\": [], \"in_else\": False}\n            target().append((\"block\", node))\n            stack.append(node)\n        elif keyword == \"else\":\n            if len(stack) > 1:\n                stack[-1][\"in_else\"] = True\n        elif keyword in (\"/each\", \"/if\"):\n            if len(stack) > 1:\n                stack.pop()\n        elif keyword == \"need\":\n            target().append((\"need\", arg))\n        else:\n            target().append((\"value\", arg))\n        pos = m.end()\n    if pos \u003c len(template):\n        target().append((\"text\", template[pos:]))\n    return root[\"kids\"]\n\n\nFILTERS = {\n    \"date\": lambda v: dates.long_date(str(v)),\n    \"time\": lambda v: dates.clock(str(v)),\n    \"money\": dates.money,\n    \"lower\": lambda v: str(v).lower(),\n    \"upper\": lambda v: str(v).upper(),\n}\n\n\ndef _format_number(value):\n    if isinstance(value, float) and value.is_integer():\n        return str(int(value))\n    return str(value)\n\n\nclass _Scope:\n    def __init__(self, root, item=None, index=-1, item_path=\"\"):\n        self.root, self.item, self.index, self.item_path = root, item, index, item_path\n\n    def lookup(self, path):\n        if path == \".\":\n            return self.item, self.item_path\n        if path == \"@n\":\n            return self.index + 1, None\n        if path == \"@a\":\n            return \"abcdefghijklmnopqrstuvwxyz\"[self.index % 26], None\n        if path.startswith(\".\"):\n            key = path[1:]\n            value = get_path(self.item, key) if isinstance(self.item, (dict, list)) else None\n            return value, f\"{self.item_path}.{key}\"\n        return get_path(self.root, path), path\n\n\ndef _run(nodes, scope, missing):\n    out = []\n\n    def flag(path):\n        record = describe_missing(path or \"\")\n        if not any(m[\"label\"] == record[\"label\"] for m in missing):\n            missing.append(record)\n        return f\"[MISSING: {record['label']}]\"\n\n    for kind, arg in nodes:\n        if kind == \"text\":\n            out.append(arg)\n        elif kind == \"value\":\n            name, *filters = [p.strip() for p in arg.split(\"|\")]\n            value, path = scope.lookup(name)\n            if is_blank(value):\n                out.append(flag(path))\n                continue\n            for f in filters:\n                if f in FILTERS:\n                    value = FILTERS[f](value)\n            out.append(_format_number(value) if isinstance(value, (int, float)) else str(value))\n        elif kind == \"need\":\n            _, path = scope.lookup(arg.strip())\n            out.append(flag(path))\n        elif kind == \"block\":\n            node = arg\n            if node[\"kind\"] == \"if\":\n                compare = re.match(r\"^(\\S+)\\s*(==|!=)\\s*(\\S+)$\", node[\"arg\"].strip())\n                if compare:\n                    value, path = scope.lookup(compare.group(1))\n                    if is_blank(value):\n                        out.append(flag(path))\n                        continue\n                    equal = str(value) == compare.group(3)\n                    chosen = node[\"kids\"] if equal == (compare.group(2) == \"==\") else node[\"alt\"]\n                else:\n                    value, _ = scope.lookup(node[\"arg\"].strip())\n                    truthy = not is_blank(value) and value is not False and value != \"no\"\n                    chosen = node[\"kids\"] if truthy else node[\"alt\"]\n                out.append(_run(chosen, scope, missing))\n            else:\n                rows, path = scope.lookup(node[\"arg\"].strip())\n                for i, row in enumerate(rows if isinstance(rows, list) else []):\n                    row_path = row.get(\"__path\") if isinstance(row, dict) and row.get(\"__path\") else f\"{path}.{i}\"\n                    out.append(_run(node[\"kids\"], _Scope(scope.root, row, i, row_path), missing))\n    return \"\".join(out)\n\n\ndef tidy(text):\n    text = re.sub(r\"[ \\t]+\\n\", \"\\n\", text)\n    text = re.sub(r\"\\n{3,}\", \"\\n\\n\", text)\n    text = re.sub(r\" {2,}\", \" \", text)\n    return text.strip()\n\n\ndef render(template, context):\n    \"\"\"Returns (text, missing) where missing is a list of {path, label, step}.\"\"\"\n    missing = []\n    try:\n        text = tidy(_run(parse(template or \"\"), _Scope(context), missing))\n    except Exception:  # a bad template should show up on screen, not crash the program\n        text = \"[TEMPLATE ERROR: check this template in the Forms library]\"\n    return text, missing\n\n\n# ---- values worked out from the intake ----\n\ndef worked_out(matter, settings):\n    caption = matter.get(\"caption\", {})\n    client = matter.get(\"client\", {})\n    medical = matter.get(\"medical\", {})\n    police = matter.get(\"police\", {})\n    attorney = matter.get(\"attorney\", {})\n    is_auto = caption.get(\"caseType\") == \"auto\"\n    c = {\n        \"isAuto\": is_auto,\n        \"hasSupp\": bool(matter.get(\"supp\", {}).get(\"items\")),\n        \"incidentNoun\": \"a motor vehicle collision\" if is_auto else \"an incident\",\n    }\n\n    last4 = re.sub(r\"\\D\", \"\", client.get(\"ssnLast4\") or \"\")\n    if settings.get(\"ssnMode\") == \"separate\":\n        c[\"ssnText\"] = \"Provided to counsel for defendants under separate confidential cover.\"\n    else:\n        c[\"ssnText\"] = f\"XXX-XX-{last4}\" if len(last4) == 4 else \"\"\n\n    providers = []\n    for i, p in enumerate(medical.get(\"providers\", [])):\n        billed, paid = dates.to_number(p.get(\"billed\")), dates.to_number(p.get(\"paid\"))\n        row = dict(p)\n        row[\"__path\"] = f\"medical.providers.{i}\"\n        row[\"owed\"] = \"\" if billed is None else billed - (paid or 0)\n        if paid is None:\n            row[\"paidText\"] = \"none recorded to date\"\n        else:\n            row[\"paidText\"] = dates.money(paid) + (f\" by {p['payer']}\" if p.get(\"payer\") else \"\")\n        providers.append(row)\n    providers.sort(key=lambda r: r.get(\"first\") or \"9999\")\n    c[\"providers\"] = providers\n    c[\"admissions\"] = [p for p in providers if p.get(\"kind\") == \"Hospital admission\"]\n    c[\"er\"] = [p for p in providers if p.get(\"kind\") == \"Emergency department\"]\n    c[\"current\"] = [p for p in providers if p.get(\"ongoing\") == \"yes\"]\n    billed_amounts = [dates.to_number(p.get(\"billed\")) for p in providers]\n    billed_amounts = [b for b in billed_amounts if b is not None]\n    c[\"totalBilled\"] = sum(billed_amounts) if billed_amounts else \"\"\n\n    # eyewitnesses from the police report and from the client, without repeats\n    seen, witnesses = set(), []\n    for source, rows in ((\"police.witnesses\", police.get(\"witnesses\", [])),\n                         (\"client.witnesses\", client.get(\"witnesses\", []))):\n        for i, w in enumerate(rows):\n            key = (w.get(\"name\") or \"\").strip().lower()\n            if key and key in seen:\n                continue\n            if key:\n                seen.add(key)\n            row = dict(w)\n            row[\"__path\"] = f\"{source}.{i}\"\n            row[\"relationship\"] = w.get(\"relationship\") or \"None\"\n            row[\"interest\"] = w.get(\"interest\") or \"None known\"\n            witnesses.append(row)\n    c[\"eyewitnesses\"] = witnesses\n\n    docs = []\n    if police.get(\"reportNo\"):\n        docs.append(f\"{police.get('agency') or 'Police'} Crash Investigation Report No. {police['reportNo']}\")\n    if providers:\n        docs.append(\"Records, reports and bills of the health care providers identified in the answer to Interrogatory No. 7\")\n    if medical.get(\"tests\"):\n        docs.append(\"Diagnostic test results identified in the answer to Interrogatory No. 6\")\n    if client.get(\"photos\"):\n        docs.append(\"Photographs identified in the answer to Interrogatory No. 18\")\n    if client.get(\"employed\") == \"yes\":\n        docs.append(\"Employment and wage records (to be supplied)\")\n    if is_auto and client.get(\"pip\") == \"yes\":\n        docs.append(\"Automobile insurance declaration sheet\")\n        docs.append(\"PIP payout ledger (to be supplied upon receipt)\")\n    if client.get(\"medicare\") == \"yes\":\n        docs.append(\"Copy of plaintiff's Medicare card\")\n    docs.extend(line.strip() for line in (attorney.get(\"documentsExtra\") or \"\").split(\"\\n\") if line.strip())\n    c[\"documents\"] = docs\n\n    attach = []\n    if client.get(\"medicare\") == \"yes\":\n        attach.append((\"medicare\", \"Copy of Medicare card\", \"Question 1\"))\n    if medical.get(\"tests\"):\n        attach.append((\"tests\", \"Diagnostic test results\", \"Question 6\"))\n    if any(p.get(\"report\") == \"yes\" for p in providers):\n        attach.append((\"reports\", \"Written reports of treating providers who may testify\", \"Question 7\"))\n    if docs:\n        attach.append((\"docs\", \"Documents identified\", \"Question 15\"))\n    if client.get(\"photos\"):\n        attach.append((\"photos\", \"Copies of photographs\", \"Question 18\"))\n    if attorney.get(\"statementsYN\") == \"yes\":\n        attach.append((\"stmts\", \"Written non-party statements\", \"Question 21\"))\n    if attorney.get(\"experts\"):\n        attach.append((\"experts\", \"Expert resumes and reports\", \"Question 23\"))\n    if is_auto and client.get(\"malfunction\") == \"yes\":\n        attach.append((\"repair\", \"Repair bills\", \"Question 28\"))\n    if is_auto and client.get(\"pip\") == \"yes\":\n        attach.append((\"dec\", \"Insurance declaration sheet\", \"Question 37\"))\n    attach.append((\"cert\", \"Certification signed and dated by plaintiff\", \"Certification\"))\n    c[\"attachments\"] = attach\n    c[\"hipaa\"] = [p for p in providers if p.get(\"name\")]\n\n    served = caption.get(\"answerServed\")\n    if served:\n        c[\"dueRaw\"] = dates.add_days(served, 30)              # R. 4:17-1(b)(2)\n        c[\"due\"] = dates.next_business_day(c[\"dueRaw\"])       # R. 1:3-1\n        c[\"thresholdDue\"] = dates.next_business_day(dates.add_days(served, 60))  # N.J.S.A. 39:6A-8(a)\n    if caption.get(\"discoveryEnd\"):\n        c[\"amendBy\"] = dates.add_days(caption[\"discoveryEnd\"], -20)  # R. 4:17-7\n    return c\n\n\ndef context_for(matter, settings):\n    ctx = dict(matter)\n    ctx[\"firm\"] = settings\n    ctx[\"clause\"] = {c[\"id\"]: c[\"text\"] for c in MOTION_CLAUSES}\n    ctx[\"calc\"] = worked_out(matter, settings)\n    return ctx\n\n\n# ---- Form A answers ----\n\ndef active_questions(matter, lib):\n    is_auto = matter.get(\"caption\", {}).get(\"caseType\") == \"auto\"\n    return [q for q in lib[\"questions\"] if is_auto or q[\"n\"] \u003c= 24]\n\n\ndef status_of(missing_count, para_ok, atty_ok, edited, was_signed=False):\n    \"\"\"missing > approved > checked > recheck > edited > draft.\n    'recheck' means someone signed off and the wording has changed since.\"\"\"\n    if missing_count:\n        return \"missing\"\n    if atty_ok:\n        return \"approved\"\n    if para_ok:\n        return \"checked\"\n    if was_signed:\n        return \"recheck\"\n    return \"edited\" if edited else \"draft\"\n\n\ndef draft_answers(matter, settings, lib):\n    ctx = context_for(matter, settings)\n    answers = []\n    for q in active_questions(matter, lib):\n        auto_text, auto_missing = render(q[\"tpl\"], ctx)\n        saved = matter.get(\"answers\", {}).get(str(q[\"n\"]), {})\n        edited = isinstance(saved.get(\"text\"), str)\n        final = saved[\"text\"] if edited else auto_text\n        if edited:\n            missing = [m for m in auto_missing if f\"[MISSING: {m['label']}]\" in final]\n        else:\n            missing = list(auto_missing)\n\n        source_line = \"\"\n        if settings.get(\"desig\") == \"answer\":\n            parts = []\n            for src in q[\"src\"]:\n                if src in SOURCE_LINES:\n                    text, extra_missing = render(SOURCE_LINES[src], ctx)\n                    parts.append(text)\n                    for m in extra_missing:\n                        if not any(x[\"label\"] == m[\"label\"] for x in missing):\n                            missing.append(m)\n            source_line = \" \".join(parts)\n\n        missing_count = max(len(missing), len(MISSING_MARK.findall(final)))\n        para_ok = bool(saved.get(\"paraOK\")) and saved.get(\"paraText\") == final\n        atty_ok = bool(saved.get(\"reviewed\")) and saved.get(\"reviewedText\") == final\n        answers.append({\n            \"q\": q, \"n\": q[\"n\"], \"auto\": auto_text, \"saved\": saved, \"edited\": edited, \"final\": final,\n            \"missing\": missing, \"missing_count\": missing_count, \"source_line\": source_line,\n            \"para_ok\": para_ok, \"atty_ok\": atty_ok,\n            \"status\": status_of(missing_count, para_ok, atty_ok, edited,\n                                bool(saved.get(\"paraOK\") or saved.get(\"reviewed\"))),\n            \"stale\": edited and saved.get(\"base\") is not None and saved.get(\"base\") != auto_text,\n        })\n    return answers\n\n\n# ---- supplemental questions ----\n\ndef suggestions_for(question, lib):\n    text = (question or \"\").lower()\n    scored = []\n    for k, entry in enumerate(lib[\"supplemental\"]):\n        hits = sum(1 for word in entry.get(\"words\", []) if word and word.lower() in text)\n        if hits:\n            scored.append((hits, k, entry[\"name\"]))\n    scored.sort(key=lambda s: (-s[0], s[1]))\n    return [{\"k\": k, \"name\": name} for _, k, name in scored[:3]]\n\n\ndef has_subparts(question):\n    return len(re.findall(r\"\\(\\s*(?:[a-h]|i{1,3}|iv|v)\\s*\\)\", question or \"\", re.I)) >= 2\n\n\ndef draft_supplemental(matter, lib):\n    items = []\n    for i, item in enumerate(matter.get(\"supp\", {}).get(\"items\", [])):\n        question, answer = item.get(\"q\", \"\"), item.get(\"a\", \"\")\n        missing = [m for m in item.get(\"miss\", []) if f\"[MISSING: {m['label']}]\" in answer]\n        empty = not answer.strip()\n        missing_count = max(len(missing), len(MISSING_MARK.findall(answer))) + (1 if empty else 0)\n        para_ok = bool(item.get(\"paraOK\")) and item.get(\"paraText\") == answer\n        atty_ok = bool(item.get(\"reviewed\")) and item.get(\"reviewedText\") == answer\n        if empty:\n            status = \"blank\"\n        else:\n            status = status_of(missing_count, para_ok, atty_ok, False,\n                               bool(item.get(\"paraOK\") or item.get(\"reviewed\")))\n        items.append({\n            \"i\": i, \"n\": i + 1, \"q\": question, \"a\": answer, \"missing\": missing, \"missing_count\": missing_count,\n            \"too_many\": i >= 10, \"subparts\": has_subparts(question), \"suggestions\": suggestions_for(question, lib),\n            \"para_ok\": para_ok, \"atty_ok\": atty_ok, \"status\": status,\n        })\n    return items\n\n\ndef fill_supplemental_markers(matter):\n    \"\"\"Once staff fill in a field, swap the [MISSING] mark in a supplemental answer for the value.\n    Yes/no and list fields are skipped; for those the standard answer has to be inserted again.\"\"\"\n    changed = False\n    for item in matter.get(\"supp\", {}).get(\"items\", []):\n        for m in item.get(\"miss\", []):\n            mark = f\"[MISSING: {m['label']}]\"\n            if mark not in item.get(\"a\", \"\"):\n                continue\n            meta = FIELD_INDEX.get(index_key(m[\"path\"])) or {}\n            kind = meta.get(\"t\", \"text\")\n            if kind in (\"yn\", \"list\", \"select\"):\n                continue\n            value = get_path(matter, m[\"path\"])\n            if is_blank(value):\n                continue\n            if kind == \"date\":\n                value = dates.long_date(value)\n            elif kind == \"money\":\n                value = dates.money(value)\n            item[\"a\"] = item[\"a\"].replace(mark, str(value))\n            changed = True\n    return changed\n\n\ndef where_needed(answers, supplemental):\n    \"\"\"Field path -> list of places that need it, for highlighting on the intake screens.\"\"\"\n    needed = {}\n    for a in answers:\n        for m in a[\"missing\"]:\n            needed.setdefault(m[\"path\"], [])\n            tag = f\"No. {a['n']}\"\n            if tag not in needed[m[\"path\"]]:\n                needed[m[\"path\"]].append(tag)\n    for s in supplemental:\n        for m in s[\"missing\"]:\n            needed.setdefault(m[\"path\"], [])\n            needed[m[\"path\"]].append(f\"Supplemental No. {s['n']}\")\n    return needed\n", "documents.py": "\"\"\"Builds the served papers once, then writes them two ways:\nas HTML for the preview on screen, and as a Word .docx file.\n\nA .docx is a zip of XML files, so it is written here with the standard\nlibrary (zipfile) instead of an outside package. Formatting is kept to what\npleadings need: Times New Roman 12, the caption box, indents, bold, italics,\nand grey shading on anything still marked [MISSING] or [ATTORNEY].\n\"\"\"\n\nimport html\nimport io\nimport re\nimport zipfile\n\nimport dates\nfrom drafting import render\n\nMARKS = re.compile(r\"(\\[MISSING: [^\\]]+\\]|\\[ATTORNEY: [^\\]]+\\])\")\n\n\nclass Paper:\n    \"\"\"A list of blocks. Each block is a paragraph, the caption, or a signature line.\"\"\"\n\n    def __init__(self, title):\n        self.title = title\n        self.blocks = []\n\n    def para(self, text, bold=False, italic=False, align=\"left\", indent=0.0, first_line=0.0,\n             before=0, after=8, line=1.5, size=12, lead=None):\n        \"\"\"text may contain line breaks and [MISSING]/[ATTORNEY] marks.\n        lead is an optional bold run in front, such as a question number.\"\"\"\n        self.blocks.append({\"type\": \"para\", \"text\": text, \"bold\": bold, \"italic\": italic, \"align\": align,\n                            \"indent\": indent, \"first_line\": first_line, \"before\": before, \"after\": after,\n                            \"line\": line, \"size\": size, \"lead\": lead})\n\n    def paragraphs(self, text, indent=0.0, **kw):\n        for chunk in re.split(r\"\\n{2,}\", text.strip()):\n            if chunk.strip():\n                self.para(chunk, indent=indent, **kw)\n\n    def caption(self, matter, settings, title):\n        self.blocks.append({\"type\": \"caption\", \"matter\": matter, \"settings\": settings, \"title\": title})\n\n    def signature(self, left, right_lines):\n        self.blocks.append({\"type\": \"signature\", \"left\": left, \"right\": right_lines})\n\n\ndef _runs(text):\n    \"\"\"Splits text into (piece, style) where style is '', 'missing' or 'attorney'.\"\"\"\n    out = []\n    for piece in MARKS.split(text or \"\"):\n        if not piece:\n            continue\n        if piece.startswith(\"[MISSING:\"):\n            out.append((piece, \"missing\"))\n        elif piece.startswith(\"[ATTORNEY:\"):\n            out.append((piece, \"attorney\"))\n        else:\n            out.append((piece, \"\"))\n    return out\n\n\ndef _caption_lines(matter, settings):\n    cap = matter.get(\"caption\", {})\n    defendants = [s.strip() for s in (cap.get(\"defendants\") or \"\").split(\"\\n\") if s.strip()] or [\"[DEFENDANTS]\"]\n    block = [f\"{settings.get('attorney') or '[ATTORNEY NAME]'}\"\n             + (f\" (Attorney ID No. {settings['attorneyId']})\" if settings.get(\"attorneyId\") else \"\"),\n             settings.get(\"name\") or \"[FIRM NAME]\"]\n    block += [line for line in (settings.get(\"address\") or \"\").split(\"\\n\") if line.strip()]\n    if settings.get(\"phone\"):\n        block.append(settings[\"phone\"])\n    if settings.get(\"email\"):\n        block.append(settings[\"email\"])\n    block.append(f\"Attorneys for Plaintiff, {cap.get('plaintiff') or ''}\")\n    return {\n        \"attorney_block\": block,\n        \"plaintiff\": (cap.get(\"plaintiff\") or \"[PLAINTIFF]\").upper(),\n        \"defendants\": [d.upper() for d in defendants],\n        \"plural\": len(defendants) > 1,\n        \"county\": (cap.get(\"county\") or \"[COUNTY]\").upper(),\n        \"docket\": cap.get(\"docket\") or \"[DOCKET]\",\n    }\n\n\n# ---------------------------------------------------------------- HTML\n\ndef _html_text(text):\n    parts = []\n    for piece, style in _runs(text):\n        safe = html.escape(piece).replace(\"\\n\", \"\u003cbr>\")\n        if style == \"missing\":\n            parts.append(f'\u003cspan style=\"background:#D0D0D0;font-weight:bold\">{safe}\u003c/span>')\n        elif style == \"attorney\":\n            parts.append(f'\u003cspan style=\"background:#EBEBEB;font-style:italic\">{safe}\u003c/span>')\n        else:\n            parts.append(safe)\n    return \"\".join(parts)\n\n\ndef to_html(paper):\n    out = ['\u003cdiv style=\"font-family:\\'Times New Roman\\',Times,serif;font-size:12pt;color:#000\">']\n    for b in paper.blocks:\n        if b[\"type\"] == \"para\":\n            style = [f\"margin:{b['before']}pt 0 {b['after']}pt {b['indent']}in\",\n                     f\"line-height:{b['line']}\", f\"text-align:{b['align']}\"]\n            if b[\"first_line\"]:\n                style.append(f\"text-indent:{b['first_line']}in\")\n            if b[\"bold\"]:\n                style.append(\"font-weight:bold\")\n            if b[\"italic\"]:\n                style.append(\"font-style:italic\")\n            if b[\"size\"] != 12:\n                style.append(f\"font-size:{b['size']}pt\")\n            lead = f\"\u003cb>{html.escape(b['lead'])}\u003c/b>&nbsp;&nbsp;\" if b[\"lead\"] else \"\"\n            out.append(f'\u003cp style=\"{\";\".join(style)}\">{lead}{_html_text(b[\"text\"])}\u003c/p>')\n        elif b[\"type\"] == \"caption\":\n            c = _caption_lines(b[\"matter\"], b[\"settings\"])\n            out.append('\u003cp style=\"margin:0 0 16pt;font-size:11pt;line-height:1.3\">'\n                       + \"\u003cbr>\".join(html.escape(x) for x in c[\"attorney_block\"]) + \"\u003c/p>\")\n            td = \"vertical-align:top;font-size:12pt;line-height:1.35;\"\n            left = (f\"{html.escape(c['plaintiff'])},\"\n                    f'\u003cp style=\"margin:6pt 0 6pt 1.4in\">Plaintiff,\u003c/p>\u003cp style=\"margin:0 0 6pt\">v.\u003c/p>'\n                    + \";\u003cbr>\".join(html.escape(d) for d in c[\"defendants\"])\n                    + f',\u003cp style=\"margin:6pt 0 0 1.4in\">Defendant{\"s\" if c[\"plural\"] else \"\"}.\u003c/p>')\n            right = (f\"SUPERIOR COURT OF NEW JERSEY\u003cbr>LAW DIVISION: {html.escape(c['county'])} COUNTY\u003cbr>\u003cbr>\"\n                     f\"DOCKET NO.: {html.escape(c['docket'])}\u003cbr>\u003cbr>Civil Action\u003cbr>\u003cbr>\"\n                     f\"\u003cb>{html.escape(b['title'])}\u003c/b>\")\n            out.append('\u003ctable style=\"width:100%;border-collapse:collapse;margin:0 0 18pt\">\u003ctr>'\n                       f'\u003ctd style=\"{td}width:50%;border-right:1px solid #000;border-bottom:1px solid #000;'\n                       f'padding:4pt 12pt 12pt 0\">{left}\u003c/td>'\n                       f'\u003ctd style=\"{td}padding:4pt 0 12pt 14pt\">{right}\u003c/td>\u003c/tr>\u003c/table>')\n        elif b[\"type\"] == \"signature\":\n            right = \"\u003cbr>\".join(html.escape(x) for x in b[\"right\"])\n            out.append('\u003ctable style=\"width:100%;margin-top:28pt;border-collapse:collapse\">\u003ctr>'\n                       f'\u003ctd style=\"width:45%;vertical-align:bottom;font-size:12pt\">{html.escape(b[\"left\"])}\u003c/td>'\n                       f'\u003ctd style=\"vertical-align:bottom;font-size:12pt;line-height:1.4\">{right}\u003c/td>\u003c/tr>\u003c/table>')\n    out.append(\"\u003c/div>\")\n    return \"\\n\".join(out)\n\n\n# ---------------------------------------------------------------- Word (.docx)\n\ndef _x(text):\n    return (text.replace(\"&\", \"&amp;\").replace(\"\u003c\", \"&lt;\").replace(\">\", \"&gt;\"))\n\n\ndef _w_runs(text, bold=False, italic=False, size=12):\n    xml = []\n    for piece, style in _runs(text):\n        # Word expects run properties in schema order: b, i, sz, shd\n        props = []\n        if bold or style == \"missing\":\n            props.append(\"\u003cw:b/>\")\n        if italic or style == \"attorney\":\n            props.append(\"\u003cw:i/>\")\n        if size != 12:\n            props.append(f'\u003cw:sz w:val=\"{size * 2}\"/>\u003cw:szCs w:val=\"{size * 2}\"/>')\n        if style:\n            fill = \"D0D0D0\" if style == \"missing\" else \"EBEBEB\"\n            props.append(f'\u003cw:shd w:val=\"clear\" w:color=\"auto\" w:fill=\"{fill}\"/>')\n        rpr = f\"\u003cw:rPr>{''.join(props)}\u003c/w:rPr>\" if props else \"\"\n        lines = piece.split(\"\\n\")\n        body = \"\u003cw:br/>\".join(f'\u003cw:t xml:space=\"preserve\">{_x(line)}\u003c/w:t>' for line in lines)\n        xml.append(f\"\u003cw:r>{rpr}{body}\u003c/w:r>\")\n    return \"\".join(xml)\n\n\ndef _w_para(text, bold=False, italic=False, align=\"left\", indent=0.0, first_line=0.0, before=0, after=8,\n            line=1.5, size=12, lead=None):\n    jc = {\"left\": \"left\", \"center\": \"center\", \"right\": \"right\", \"justify\": \"both\"}.get(align, \"left\")\n    ind = \"\"\n    if indent or first_line:\n        ind = f'\u003cw:ind w:left=\"{int(indent * 1440)}\" w:firstLine=\"{int(first_line * 1440)}\"/>'\n    ppr = (f'\u003cw:pPr>\u003cw:spacing w:before=\"{before * 20}\" w:after=\"{after * 20}\" w:line=\"{int(line * 240)}\" '\n           f'w:lineRule=\"auto\"/>{ind}\u003cw:jc w:val=\"{jc}\"/>\u003c/w:pPr>')\n    lead_xml = _w_runs(lead + \"  \", bold=True, size=size) if lead else \"\"\n    return f\"\u003cw:p>{ppr}{lead_xml}{_w_runs(text, bold, italic, size)}\u003c/w:p>\"\n\n\ndef _w_cell(width, paragraphs, borders=\"\"):\n    return (f'\u003cw:tc>\u003cw:tcPr>\u003cw:tcW w:w=\"{width}\" w:type=\"dxa\"/>{borders}\u003c/w:tcPr>'\n            f'{\"\".join(paragraphs) or \"\u003cw:p/>\"}\u003c/w:tc>')\n\n\ndef _w_table(cells_xml, widths):\n    grid = \"\".join(f'\u003cw:gridCol w:w=\"{w}\"/>' for w in widths)\n    return ('\u003cw:tbl>\u003cw:tblPr>\u003cw:tblW w:w=\"9360\" w:type=\"dxa\"/>\u003cw:tblLayout w:type=\"fixed\"/>'\n            '\u003cw:tblCellMar>\u003cw:left w:w=\"0\" w:type=\"dxa\"/>\u003cw:right w:w=\"160\" w:type=\"dxa\"/>\u003c/w:tblCellMar>'\n            f'\u003c/w:tblPr>\u003cw:tblGrid>{grid}\u003c/w:tblGrid>\u003cw:tr>{\"\".join(cells_xml)}\u003c/w:tr>\u003c/w:tbl>')\n\n\ndef _w_caption(block):\n    c = _caption_lines(block[\"matter\"], block[\"settings\"])\n    tight = dict(before=0, after=0, line=1.0)\n    out = [_w_para(\"\\n\".join(c[\"attorney_block\"]), size=11, before=0, after=16, line=1.0)]\n    left = [_w_para(c[\"plaintiff\"] + \",\", **tight),\n            _w_para(\"Plaintiff,\", indent=1.4, before=6, after=6, line=1.0),\n            _w_para(\"v.\", **tight),\n            _w_para(\";\\n\".join(c[\"defendants\"]) + \",\", before=6, after=0, line=1.0),\n            _w_para(\"Defendants.\" if c[\"plural\"] else \"Defendant.\", indent=1.4, before=6, after=8, line=1.0)]\n    pad = 0.2  # keeps the court heading off the caption line\n    right = [_w_para(\"SUPERIOR COURT OF NEW JERSEY\\nLAW DIVISION: \" + c[\"county\"] + \" COUNTY\", indent=pad,\n                     before=0, after=0, line=1.0),\n             _w_para(\"DOCKET NO.: \" + c[\"docket\"], indent=pad, before=12, after=0, line=1.0),\n             _w_para(\"Civil Action\", indent=pad, before=12, after=0, line=1.0),\n             _w_para(block[\"title\"], bold=True, indent=pad, before=12, after=8, line=1.0)]\n    borders = ('\u003cw:tcBorders>\u003cw:right w:val=\"single\" w:sz=\"8\" w:space=\"0\" w:color=\"000000\"/>'\n               '\u003cw:bottom w:val=\"single\" w:sz=\"8\" w:space=\"0\" w:color=\"000000\"/>\u003c/w:tcBorders>')\n    out.append(_w_table([_w_cell(4680, left, borders), _w_cell(4680, right)], [4680, 4680]))\n    out.append(_w_para(\"\", after=10))\n    return \"\".join(out)\n\n\ndef _w_signature(block):\n    left = [_w_para(block[\"left\"], line=1.0, after=0)]\n    right = [_w_para(\"\\n\".join(block[\"right\"]), line=1.0, after=0)]\n    return _w_para(\"\", before=18, after=0) + _w_table([_w_cell(4200, left), _w_cell(5160, right)], [4200, 5160])\n\n\nCONTENT_TYPES = \"\"\"\u003c?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\n\u003cTypes xmlns=\"http://schemas.openxmlformats.org/package/2006/content-types\">\n\u003cDefault Extension=\"rels\" ContentType=\"application/vnd.openxmlformats-package.relationships+xml\"/>\n\u003cDefault Extension=\"xml\" ContentType=\"application/xml\"/>\n\u003cOverride PartName=\"/word/document.xml\" ContentType=\"application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml\"/>\n\u003cOverride PartName=\"/word/styles.xml\" ContentType=\"application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml\"/>\n\u003cOverride PartName=\"/docProps/core.xml\" ContentType=\"application/vnd.openxmlformats-package.core-properties+xml\"/>\n\u003c/Types>\"\"\"\n\nPACKAGE_RELS = \"\"\"\u003c?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\n\u003cRelationships xmlns=\"http://schemas.openxmlformats.org/package/2006/relationships\">\n\u003cRelationship Id=\"rId1\" Type=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument\" Target=\"word/document.xml\"/>\n\u003cRelationship Id=\"rId2\" Type=\"http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties\" Target=\"docProps/core.xml\"/>\n\u003c/Relationships>\"\"\"\n\nDOCUMENT_RELS = \"\"\"\u003c?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\n\u003cRelationships xmlns=\"http://schemas.openxmlformats.org/package/2006/relationships\">\n\u003cRelationship Id=\"rId1\" Type=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles\" Target=\"styles.xml\"/>\n\u003c/Relationships>\"\"\"\n\nSTYLES = \"\"\"\u003c?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\n\u003cw:styles xmlns:w=\"http://schemas.openxmlformats.org/wordprocessingml/2006/main\">\n\u003cw:docDefaults>\n\u003cw:rPrDefault>\u003cw:rPr>\u003cw:rFonts w:ascii=\"Times New Roman\" w:hAnsi=\"Times New Roman\" w:eastAsia=\"Times New Roman\" w:cs=\"Times New Roman\"/>\u003cw:sz w:val=\"24\"/>\u003cw:szCs w:val=\"24\"/>\u003cw:lang w:val=\"en-US\"/>\u003c/w:rPr>\u003c/w:rPrDefault>\n\u003cw:pPrDefault>\u003cw:pPr>\u003cw:spacing w:after=\"0\" w:line=\"240\" w:lineRule=\"auto\"/>\u003c/w:pPr>\u003c/w:pPrDefault>\n\u003c/w:docDefaults>\n\u003cw:style w:type=\"paragraph\" w:default=\"1\" w:styleId=\"Normal\">\u003cw:name w:val=\"Normal\"/>\u003cw:qFormat/>\u003c/w:style>\n\u003cw:style w:type=\"table\" w:default=\"1\" w:styleId=\"TableNormal\">\u003cw:name w:val=\"Normal Table\"/>\u003cw:tblPr>\u003cw:tblInd w:w=\"0\" w:type=\"dxa\"/>\u003cw:tblCellMar>\u003cw:top w:w=\"0\" w:type=\"dxa\"/>\u003cw:left w:w=\"108\" w:type=\"dxa\"/>\u003cw:bottom w:w=\"0\" w:type=\"dxa\"/>\u003cw:right w:w=\"108\" w:type=\"dxa\"/>\u003c/w:tblCellMar>\u003c/w:tblPr>\u003c/w:style>\n\u003c/w:styles>\"\"\"\n\n\ndef to_docx(paper):\n    body = []\n    for b in paper.blocks:\n        if b[\"type\"] == \"para\":\n            body.append(_w_para(b[\"text\"], b[\"bold\"], b[\"italic\"], b[\"align\"], b[\"indent\"], b[\"first_line\"],\n                                b[\"before\"], b[\"after\"], b[\"line\"], b[\"size\"], b[\"lead\"]))\n        elif b[\"type\"] == \"caption\":\n            body.append(_w_caption(b))\n        elif b[\"type\"] == \"signature\":\n            body.append(_w_signature(b))\n    section = ('\u003cw:sectPr>\u003cw:pgSz w:w=\"12240\" w:h=\"15840\"/>'\n               '\u003cw:pgMar w:top=\"1440\" w:right=\"1440\" w:bottom=\"1440\" w:left=\"1440\" w:header=\"720\" w:footer=\"720\" '\n               'w:gutter=\"0\"/>\u003c/w:sectPr>')\n    document = ('\u003c?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>'\n                '\u003cw:document xmlns:w=\"http://schemas.openxmlformats.org/wordprocessingml/2006/main\">'\n                f'\u003cw:body>{\"\".join(body)}{section}\u003c/w:body>\u003c/w:document>')\n    core = ('\u003c?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>'\n            '\u003ccp:coreProperties xmlns:cp=\"http://schemas.openxmlformats.org/package/2006/metadata/core-properties\" '\n            'xmlns:dc=\"http://purl.org/dc/elements/1.1/\">'\n            f'\u003cdc:title>{_x(paper.title)}\u003c/dc:title>\u003c/cp:coreProperties>')\n    buffer = io.BytesIO()\n    with zipfile.ZipFile(buffer, \"w\", zipfile.ZIP_DEFLATED) as z:\n        z.writestr(\"[Content_Types].xml\", CONTENT_TYPES)\n        z.writestr(\"_rels/.rels\", PACKAGE_RELS)\n        z.writestr(\"word/_rels/document.xml.rels\", DOCUMENT_RELS)\n        z.writestr(\"word/document.xml\", document)\n        z.writestr(\"word/styles.xml\", STYLES)\n        z.writestr(\"docProps/core.xml\", core)\n    return buffer.getvalue()\n\n\n# ---------------------------------------------------------------- the papers\n\ndef answers_title(supplemental):\n    if supplemental:\n        return \"PLAINTIFF'S ANSWERS TO FORM A UNIFORM INTERROGATORIES AND SUPPLEMENTAL INTERROGATORIES\"\n    return \"PLAINTIFF'S ANSWERS TO FORM A UNIFORM INTERROGATORIES\"\n\n\ndef answers_paper(matter, settings, context, answers, supplemental):\n    paper = Paper(\"Interrogatory Answers\")\n    paper.caption(matter, settings, answers_title(supplemental))\n    opening, _ = render(settings.get(\"prelim\") or \"\", context)\n    paper.paragraphs(opening)\n    for a in answers:\n        if a[\"n\"] == 25:\n            paper.para(\"TO BE ANSWERED ONLY IN AUTOMOBILE ACCIDENT CASES\", bold=True, align=\"center\", before=18, after=6)\n        paper.para(a[\"q\"][\"text\"], lead=f\"{a['n']}.\", before=14, after=6, line=1.4)\n        paper.para(\"ANSWER:\", bold=True, indent=0.5, after=4)\n        paper.paragraphs(a[\"final\"], indent=0.5)\n        if a[\"source_line\"]:\n            paper.para(a[\"source_line\"], italic=True, indent=0.5, size=11)\n    if supplemental:\n        paper.para(\"ANSWERS TO SUPPLEMENTAL INTERROGATORIES\", bold=True, align=\"center\", before=22, after=6)\n        for s in supplemental:\n            paper.para(s[\"q\"], lead=f\"Supplemental Interrogatory No. {s['n']}.\", before=14, after=6, line=1.4)\n            paper.para(\"ANSWER:\", bold=True, indent=0.5, after=4)\n            paper.paragraphs(s[\"a\"] if s[\"a\"].strip() else \"[MISSING: Answer not written]\", indent=0.5)\n    paper.para(\"CERTIFICATION\", bold=True, align=\"center\", before=26, after=8)\n    paper.paragraphs(settings.get(\"cert\") or \"\")\n    name = matter.get(\"client\", {}).get(\"fullName\") or matter.get(\"caption\", {}).get(\"plaintiff\") or \"\"\n    paper.signature(\"Dated: ____________________\", [\"______________________________\", name])\n    return paper\n\n\ndef questionnaire_paper(matter, settings, prefilled):\n    from intake import SCREENS, find_field\n    is_auto = matter.get(\"caption\", {}).get(\"caseType\") == \"auto\"\n    paper = Paper(\"Client Questionnaire\")\n    paper.para(\"CLIENT INFORMATION QUESTIONNAIRE\", bold=True, align=\"center\", size=13, after=4)\n    firm_line = \", \".join(x for x in (settings.get(\"name\"), settings.get(\"phone\")) if x)\n    if firm_line:\n        paper.para(firm_line, align=\"center\", after=14)\n    cap = matter.get(\"caption\", {})\n    title = cap.get(\"plaintiff\") or \"your case\"\n    docket = f\", Docket No. {cap['docket']}\" if cap.get(\"docket\") else \"\"\n    paper.para(f\"Re: {title}{docket}\", after=6)\n    if prefilled:\n        intro = (\"We filled in what we already know. Please read each answer, correct anything that is wrong, \"\n                 \"and fill in anything left blank.\")\n    else:\n        intro = (\"The court requires written answers to a standard set of questions in your case, called \"\n                 \"interrogatories. Please answer as completely as you can.\")\n    paper.para(intro + \" If you do not know an answer, write \\\"I don't know.\\\" Call our office with any questions.\",\n               after=12)\n\n    def shown(path):\n        value = matter\n        for part in path.split(\".\"):\n            value = value.get(part) if isinstance(value, dict) else None\n        f = find_field(path) or {}\n        if isinstance(value, list):\n            rows = [\", \".join(str(v) for v in row.values() if isinstance(v, str) and v) for row in value]\n            return \"\\n\".join(r for r in rows if r)\n        if value in (\"yes\", \"no\"):\n            return value.capitalize()\n        if not value:\n            return \"\"\n        if f.get(\"t\") == \"date\":\n            return dates.long_date(value)\n        if f.get(\"t\") == \"money\":\n            return dates.money(value)\n        for option in f.get(\"o\", []):\n            if isinstance(option, (tuple, list)) and option[0] == value:\n                return option[1]\n        return str(value)\n\n    blank_line = \"_\" * 78\n    number = 0\n    for group in SCREENS[\"client\"]:\n        if group.get(\"auto\") and not is_auto:\n            continue\n        asks = [f for f in group[\"fields\"] if f.get(\"ask\") and (is_auto or not f.get(\"auto\"))]\n        if not asks:\n            continue\n        heading = group[\"title\"].replace(\"in the client's words\", \"in your words\")\n        heading = heading.replace(\"Background the defense often asks about\", \"Background\")\n        paper.para(heading, bold=True, before=14, after=4)\n        for f in asks:\n            number += 1\n            paper.para(f[\"ask\"], lead=f\"{number}.\", before=6, after=4, line=1.2)\n            if prefilled:\n                values = \"\\n\".join(v for v in (shown(p) for p in [f[\"k\"]] + f.get(\"ask_with\", [])) if v)\n                if values:\n                    paper.para(values, indent=0.4, after=2, line=1.2)\n                    paper.para(\"Correct? ____ Yes ____ No. Changes: ______________________________\", indent=0.4,\n                               size=11, after=4, line=1.2)\n                    continue\n            lines = 4 if (f[\"t\"] in (\"area\", \"list\") or f.get(\"ask_with\")) else 1\n            paper.para(\"\\n\".join([blank_line] * lines), indent=0.4, after=4, line=1.6, size=10)\n    paper.signature(\"Date: ______________\", [\"Signature: ______________________________\"])\n    return paper\n\n\ndef motion_paper(matter, settings, context, motion, doc):\n    text, missing = render(doc[\"tpl\"], context)\n    paper = Paper(doc[\"title\"])\n    paper.caption(matter, settings, doc[\"heading\"])\n    for block in re.split(r\"\\n{2,}\", text):\n        lines = block.split(\"\\n\")\n        if all(l.startswith(\"## \") for l in lines):\n            paper.para(\"\\n\".join(l[3:] for l in lines), bold=True, align=\"center\", before=12, after=8, line=1.3)\n        elif all(l.startswith(\"| \") for l in lines):\n            paper.para(\"\\n\".join(l[2:] for l in lines), after=12, line=1.3)\n        elif block.strip():\n            paper.para(block, first_line=0.5, align=\"justify\", after=10, line=1.7)\n    values = context[\"m\"]\n    dated = dates.long_date(values.get(\"serviceDate\")) if values.get(\"serviceDate\") else \"____________________\"\n    attorney = settings.get(\"attorney\") or \"[ATTORNEY NAME]\"\n    if doc[\"sig\"] == \"order\":\n        paper.para(f\"______________________________\\nHon. {values.get('judge') or '____________'}, J.S.C.\",\n                   indent=3.2, before=30, line=1.3)\n        paper.para(\"______ Opposed\\n______ Unopposed\", before=18, line=1.5)\n    elif doc[\"sig\"] == \"cert\":\n        paper.signature(f\"Dated: {dated}\", [\"______________________________\", attorney])\n    else:\n        paper.signature(f\"Dated: {dated}\", [settings.get(\"name\") or \"[FIRM NAME]\", \"Attorneys for Plaintiff\", \"\",\n                                            \"By: ___________________________\", \"      \" + attorney])\n    return paper, missing\n", "pages.py": "\"\"\"HTML for each screen. Plain functions that return strings; webapp.py decides which one to show.\"\"\"\n\nimport html\nimport os\nfrom string import Template\nfrom urllib.parse import quote\n\nimport dates\nimport storage\nfrom documents import to_html\nfrom drafting import get_path\nfrom intake import INTAKE_STEPS, SCREENS, STEPS\nfrom motions import MOTIONS\nfrom standard_text import MOTION_CLAUSES\n\nTEMPLATE_DIR = os.path.join(os.path.dirname(os.path.abspath(__file__)), \"templates\")\n_cache = {}\n\nSTATUS = {\n    \"missing\": \"Needs information\", \"blank\": \"Not answered\", \"draft\": \"Draft\", \"edited\": \"Edited\",\n    \"recheck\": \"Needs recheck\", \"checked\": \"Checked by paralegal\", \"approved\": \"Approved by attorney\",\n}\nSTATUS_SHORT = {\n    \"missing\": \"Needs info\", \"blank\": \"Not answered\", \"draft\": \"Draft\", \"edited\": \"Edited\",\n    \"recheck\": \"Recheck\", \"checked\": \"Checked\", \"approved\": \"Approved\",\n}\nSOURCES = {\"police\": \"Police report\", \"medical\": \"Medical records\", \"client\": \"Client\",\n           \"attorney\": \"Attorney\", \"file\": \"Case file\"}\nSTEP_TITLES = {key: title for key, title, _ in STEPS}\n\n# An invisible first button, so pressing Enter in a field saves instead of pressing the first visible button.\nENTER_SAVES = ('\u003cbutton type=\"submit\" name=\"action\" value=\"save\" tabindex=\"-1\" aria-hidden=\"true\" '\n               'style=\"position:absolute;left:-9999px;width:1px;height:1px\">\u003c/button>')\n\n\ndef template(name):\n    if name not in _cache:\n        with open(os.path.join(TEMPLATE_DIR, name), encoding=\"utf-8\") as f:\n            _cache[name] = Template(f.read())\n    return _cache[name]\n\n\ndef esc(value):\n    return html.escape(\"\" if value is None else str(value))\n\n\ndef pill(status, short=False):\n    return f'\u003cspan class=\"st st-{status}\">{(STATUS_SHORT if short else STATUS)[status]}\u003c/span>'\n\n\ndef marked(text):\n    \"\"\"Escapes text and shades [MISSING] and [ATTORNEY] marks.\"\"\"\n    out = esc(text)\n    out = _replace_marks(out, \"[MISSING: \", '\u003cmark class=\"miss\">Missing: ', \"\u003c/mark>\")\n    out = _replace_marks(out, \"[ATTORNEY: \", '\u003cmark class=\"atty\">Attorney: ', \"\u003c/mark>\")\n    return out\n\n\ndef _replace_marks(text, start, open_tag, close_tag):\n    while start in text:\n        i = text.index(start)\n        j = text.find(\"]\", i)\n        if j \u003c 0:\n            break\n        text = text[:i] + open_tag + text[i + len(start):j] + close_tag + text[j + 1:]\n    return text\n\n\ndef field_id(path):\n    return \"f-\" + path.replace(\".\", \"-\")\n\n\ndef matter_title(matter):\n    cap = matter.get(\"caption\", {})\n    defendants = [s.strip() for s in (cap.get(\"defendants\") or \"\").split(\"\\n\") if s.strip()]\n    if not cap.get(\"plaintiff\"):\n        return \"Untitled matter\"\n    first = defendants[0] if defendants else \"Defendant\"\n    return f\"{cap['plaintiff']} v. {first}{', et al.' if len(defendants) > 1 else ''}\"\n\n\n# ---------------------------------------------------------------- frame\n\ndef layout(title, main, matter=None, active=\"\", flash=\"\", info=None):\n    topbar = '\u003ca class=\"app-name\" href=\"/\">Interrogatory &amp; Motion Drafter\u003c/a>'\n    if isinstance(storage.store, storage.BrowserStore):\n        topbar += '\u003cspan class=\"demo-tag\">Demo\u003c/span>'\n    if matter:\n        cap = matter.get(\"caption\", {})\n        extra = \", \".join(x for x in (cap.get(\"docket\"), f\"{cap['county']} County\" if cap.get(\"county\") else \"\") if x)\n        topbar += f'\u003cspan class=\"matter-name\">\u003cb>{esc(matter_title(matter))}\u003c/b>{\"  \" + esc(extra) if extra else \"\"}\u003c/span>'\n        topbar += due_pill(matter, info or {})\n    else:\n        topbar += '\u003cspan class=\"matter-name\">\u003c/span>'\n    flash_html = \"\"\n    if flash:\n        kind, _, text = flash.partition(\":\")\n        flash_html = f'\u003cdiv class=\"flash{\" red\" if kind == \"red\" else \"\"}\" role=\"status\">{esc(text)}\u003c/div>'\n    return template(\"base.html\").substitute(\n        title=esc(title), topbar=topbar, nav=sidebar(matter, active, info or {}), flash=flash_html, main=main)\n\n\ndef due_pill(matter, info):\n    served = matter.get(\"served\", {}).get(\"date\")\n    if served:\n        return f'\u003cspan class=\"due ok\">Answers served {dates.short_date(served)}\u003c/span>'\n    due = info.get(\"due\")\n    if not due:\n        return \"\"\n    left = dates.days_until(due)\n    if left \u003c 0:\n        return f'\u003cspan class=\"due late\">Answers overdue since {dates.long_date(due)}\u003c/span>'\n    if left == 0:\n        return '\u003cspan class=\"due late\">Answers due today\u003c/span>'\n    kind = \"soon\" if left \u003c= 7 else \"\"\n    return f'\u003cspan class=\"due {kind}\">Answers due {dates.with_weekday(due)} ({left} day{\"\" if left == 1 else \"s\"})\u003c/span>'\n\n\ndef sidebar(matter, active, info):\n    links = []\n    if matter:\n        base = f\"/m/{matter['id']}\"\n        links.append(\"\u003ch4>This matter\u003c/h4>\")\n        for i, (key, title, _) in enumerate(STEPS, start=1):\n            sub = info.get(\"sub\", {}).get(key, \"\")\n            links.append(f'\u003ca class=\"nav{\" on\" if active == key else \"\"}\" href=\"{base}/{key}\">'\n                         f'\u003cspan class=\"num\">{i}\u003c/span>\u003cspan class=\"t\">\u003cb>{esc(title)}\u003c/b>{sub}\u003c/span>\u003c/a>')\n        links.append(\"\u003ch4>Tools\u003c/h4>\")\n        for key, title in ((\"questionnaire\", \"Client questionnaire\"), (\"motions\", \"Motion papers\")):\n            links.append(f'\u003ca class=\"nav{\" on\" if active == key else \"\"}\" href=\"{base}/{key}\">'\n                         f'\u003cspan class=\"num\">\u003c/span>\u003cspan class=\"t\">\u003cb>{title}\u003c/b>\u003c/span>\u003c/a>')\n    links.append(\"\u003ch4>Office\u003c/h4>\")\n    for key, href, title in ((\"home\", \"/\", \"All matters\"), (\"library\", \"/library\", \"Forms library\"),\n                             (\"settings\", \"/settings\", \"Firm settings\")):\n        links.append(f'\u003ca class=\"nav{\" on\" if active == key else \"\"}\" href=\"{href}\">'\n                     f'\u003cspan class=\"num\">\u003c/span>\u003cspan class=\"t\">\u003cb>{title}\u003c/b>\u003c/span>\u003c/a>')\n    return \"\\n\".join(links)\n\n\ndef page_head(title, blurb=\"\", step=None, actions=\"\"):\n    step_html = f'\u003cspan class=\"step\">Step {step} of 8\u003c/span>' if step else \"\"\n    blurb_html = f\"\u003cp>{esc(blurb)}\u003c/p>\" if blurb else \"\"\n    return (f'\u003cdiv class=\"page-head\">\u003cdiv>{step_html}\u003ch1>{esc(title)}\u003c/h1>{blurb_html}\u003c/div>'\n            f'\u003cdiv class=\"row\">{actions}\u003c/div>\u003c/div>')\n\n\ndef back_banner(back):\n    if not back:\n        return \"\"\n    label = \"Back to the answer\"\n    if \"/supplemental\" in back:\n        label = \"Back to supplemental questions\"\n    elif \"/answers/\" in back:\n        label = f\"Back to No. {back.split('/answers/')[1].split('?')[0]}\"\n    return (f'\u003cdiv class=\"back-link\">\u003cspan>Fill in the highlighted field, then choose Save and go back.\u003c/span>'\n            f'\u003ca href=\"{esc(back)}\">{esc(label)}\u003c/a>\u003c/div>')\n\n\n# ---------------------------------------------------------------- fields\n\ndef control(f, name, value):\n    fid = field_id(name)\n    value = \"\" if value is None else value\n    kind = f.get(\"t\", \"text\")\n    if kind == \"area\":\n        return f'\u003ctextarea id=\"{fid}\" name=\"{esc(name)}\" rows=\"{f.get(\"rows\", 3)}\">{esc(value)}\u003c/textarea>'\n    if kind == \"select\":\n        options = ['\u003coption value=\"\">Choose\u003c/option>']\n        for o in f[\"o\"]:\n            val, label = (o if isinstance(o, (list, tuple)) else (o, o))\n            options.append(f'\u003coption value=\"{esc(val)}\"{\" selected\" if str(value) == str(val) else \"\"}>{esc(label)}\u003c/option>')\n        return f'\u003cselect id=\"{fid}\" name=\"{esc(name)}\">{\"\".join(options)}\u003c/select>'\n    if kind == \"yn\":\n        boxes = \"\".join(\n            f'\u003clabel>\u003cinput type=\"radio\" name=\"{esc(name)}\" value=\"{v}\"{\" checked\" if value == v else \"\"}> {label}\u003c/label>'\n            for v, label in ((\"yes\", \"Yes\"), (\"no\", \"No\")))\n        return f'\u003cdiv class=\"yn\" id=\"{fid}\" role=\"radiogroup\" aria-labelledby=\"{fid}-label\">{boxes}\u003c/div>'\n    input_type = {\"date\": \"date\", \"time\": \"time\", \"number\": \"number\"}.get(kind, \"text\")\n    extra = ' inputmode=\"decimal\" placeholder=\"$0.00\"' if kind == \"money\" else \"\"\n    return f'\u003cinput type=\"{input_type}\" id=\"{fid}\" name=\"{esc(name)}\" value=\"{esc(value)}\"{extra} autocomplete=\"off\">'\n\n\ndef needed_note(tags):\n    return f'\u003cspan class=\"needed\">Needed for {\", \".join(tags)}\u003c/span>' if tags else \"\"\n\n\ndef field_block(f, matter, prefix=\"\", needed=None):\n    path = f\"{prefix}.{f['k']}\" if prefix else f[\"k\"]\n    tags = (needed or {}).get(path)\n    fid = field_id(path)\n    if f.get(\"t\") == \"yn\":\n        label = f'\u003cspan class=\"label\" id=\"{fid}-label\">{esc(f[\"l\"])}\u003c/span>'\n    else:\n        label = f'\u003clabel for=\"{fid}\">{esc(f[\"l\"])}\u003c/label>'\n    hint = f'\u003cspan class=\"hint\">{esc(f[\"h\"])}\u003c/span>' if f.get(\"h\") else \"\"\n    classes = \"field\" + (\" full\" if f.get(\"full\") else \"\") + (\" need\" if tags else \"\")\n    return (f'\u003cdiv class=\"{classes}\" id=\"at-{fid}\">{label}{control(f, path, get_path(matter, path))}'\n            f'{hint}{needed_note(tags)}\u003c/div>')\n\n\ndef list_block(f, matter, needed=None):\n    rows = get_path(matter, f[\"k\"]) or []\n    tags = (needed or {}).get(f[\"k\"])\n    fid = field_id(f[\"k\"])\n    parts = []\n    for i, row in enumerate(rows):\n        inner = \"\".join(field_block(sub, matter, f\"{f['k']}.{i}\", needed) for sub in f[\"fields\"])\n        parts.append(f'\u003cdiv class=\"list-row\">\u003cheader>\u003cb>{esc(f[\"item\"])} {i + 1}\u003c/b>'\n                     f'\u003cbutton class=\"btn small quiet danger\" name=\"action\" value=\"remove:{esc(f[\"k\"])}.{i}\">Remove\u003c/button>'\n                     f'\u003c/header>\u003cdiv class=\"fields\">{inner}\u003c/div>\u003c/div>')\n    body = \"\".join(parts) or '\u003cp class=\"empty\">None entered.\u003c/p>'\n    hint = f'\u003cspan class=\"hint\">{esc(f[\"h\"])}\u003c/span>' if f.get(\"h\") else \"\"\n    return (f'\u003cdiv class=\"field full{\" need\" if tags else \"\"}\" id=\"at-{fid}\">\u003cspan class=\"label\">{esc(f[\"l\"])}\u003c/span>{hint}'\n            f'\u003cdiv class=\"rows\">{body}\u003c/div>\u003cdiv>\u003cbutton class=\"btn small\" name=\"action\" value=\"add:{esc(f[\"k\"])}\" '\n            f'id=\"{fid}\">Add {esc(f[\"item\"].lower())}\u003c/button>\u003c/div>{needed_note(tags)}\u003c/div>')\n\n\ndef group_panel(group, matter, needed):\n    is_auto = matter.get(\"caption\", {}).get(\"caseType\") == \"auto\"\n    if group.get(\"auto\") and not is_auto:\n        return \"\"\n    fields = [f for f in group[\"fields\"] if is_auto or not f.get(\"auto\")]\n    inner = \"\".join(list_block(f, matter, needed) if f[\"t\"] == \"list\" else field_block(f, matter, \"\", needed)\n                    for f in fields)\n    note = f'\u003cp class=\"note\">{esc(group[\"note\"])}\u003c/p>' if group.get(\"note\") else \"\"\n    return (f'\u003csection class=\"panel\">\u003cheader>\u003ch2>{esc(group[\"title\"])}\u003c/h2>{note}\u003c/header>'\n            f'\u003cdiv class=\"panel-body\">\u003cdiv class=\"fields\">{inner}\u003c/div>\u003c/div>\u003c/section>')\n\n\n# ---------------------------------------------------------------- home\n\ndef home_page(matters, settings, summaries, in_browser=False):\n    rows = []\n    for m in matters:\n        s = summaries.get(m[\"id\"], {})\n        due = s.get(\"due\")\n        due_text = '\u003cspan class=\"muted\">Enter dates\u003c/span>'\n        if due:\n            left = dates.days_until(due)\n            css = \"red-text\" if left \u003c 0 else (\"amber-text\" if left \u003c= 7 else \"\")\n            due_text = f'\u003cspan class=\"{css}\">{dates.with_weekday(due)}{\" (overdue)\" if left \u003c 0 else \"\"}\u003c/span>'\n        if m.get(\"served\", {}).get(\"date\"):\n            due_text = f'\u003cspan class=\"green-text\">Served {dates.long_date(m[\"served\"][\"date\"])}\u003c/span>'\n        rows.append(f'\u003ctr>\u003ctd>\u003ca href=\"/m/{m[\"id\"]}/answers\">{esc(matter_title(m))}\u003c/a>\u003c/td>'\n                    f'\u003ctd>{esc(m.get(\"caption\", {}).get(\"docket\") or \"\")}\u003c/td>\u003ctd>{due_text}\u003c/td>'\n                    f'\u003ctd>{s.get(\"approved\", 0)} of {s.get(\"total\", 0)} approved\u003c/td>'\n                    f'\u003ctd class=\"muted\">{esc((m.get(\"updated\") or \"\")[:10])}\u003c/td>\u003c/tr>')\n    table = \"\"\n    if rows:\n        table = ('\u003csection class=\"panel\">\u003cdiv class=\"panel-body scroll-x\">\u003ctable class=\"table\">\u003cthead>\u003ctr>'\n                 '\u003cth>Matter\u003c/th>\u003cth>Docket\u003c/th>\u003cth>Answers due\u003c/th>\u003cth>Progress\u003c/th>\u003cth>Updated\u003c/th>\u003c/tr>\u003c/thead>'\n                 f'\u003ctbody>{\"\".join(rows)}\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>')\n    else:\n        table = ('\u003csection class=\"panel\">\u003cdiv class=\"panel-body\">\u003cp class=\"empty\">No matters yet. '\n                 'Start one below.\u003c/p>\u003c/div>\u003c/section>')\n    setup = \"\"\n    if not (settings.get(\"name\") and settings.get(\"attorney\")):\n        setup = ('\u003cdiv class=\"callout amber\">Before printing anything, add the firm\\'s name, attorney, and address '\n                 'under \u003ca href=\"/settings\">Firm settings\u003c/a>. They go on every caption.\u003c/div>')\n    new_form = ('\u003csection class=\"panel\">\u003cheader>\u003ch2>Start a new matter\u003c/h2>'\n                '\u003cp class=\"note\">You can fill in the rest of the caption on the next screen.\u003c/p>\u003c/header>'\n                '\u003cdiv class=\"panel-body\">\u003cform method=\"post\" action=\"/new\" class=\"row\">'\n                '\u003cdiv class=\"field\" style=\"flex:1;min-width:240px\">\u003clabel for=\"new-plaintiff\">Plaintiff\u003c/label>'\n                '\u003cinput type=\"text\" id=\"new-plaintiff\" name=\"plaintiff\" autocomplete=\"off\">\u003c/div>'\n                '\u003cbutton class=\"btn primary\" style=\"align-self:flex-end\">Start matter\u003c/button>\u003c/form>\u003c/div>\u003c/section>')\n    where = \"\"\n    if in_browser:\n        where = ('\u003cdiv class=\"callout blue\">\u003cb>Demonstration.\u003c/b> '\n                 'What you enter stays in this browser on this computer. It can be lost if the browsing data is '\n                 'cleared, so download a backup from \u003ca href=\"/settings\">Firm settings\u003c/a> to keep it.\u003c/div>')\n    return (page_head(\"Matters\", \"Open a matter to work on its answers, or start a new one.\")\n            + where + setup + table + new_form)\n\n\n# ---------------------------------------------------------------- intake screens\n\ndef intake_page(matter, step, needed, back):\n    number = [s[0] for s in STEPS].index(step) + 1\n    _, title, blurb = STEPS[number - 1]\n    out = [page_head(title, blurb, number), back_banner(back)]\n    if step == \"client\":\n        out.append(f'\u003cdiv class=\"callout row between\">\u003cspan>Collect these facts with the client questionnaire, '\n                   f'blank or filled in for the client to confirm.\u003c/span>'\n                   f'\u003ca class=\"btn small\" href=\"/m/{matter[\"id\"]}/questionnaire\">Client questionnaire\u003c/a>\u003c/div>')\n    out.append(f'\u003cform method=\"post\" action=\"/m/{matter[\"id\"]}/{step}\">{ENTER_SAVES}')\n    out.append(f'\u003cinput type=\"hidden\" name=\"back\" value=\"{esc(back or \"\")}\">')\n    for group in SCREENS[step]:\n        out.append(group_panel(group, matter, needed))\n    next_step = STEPS[number][0] if number \u003c len(STEPS) else None\n    if back:\n        buttons = ('\u003cbutton class=\"btn\" name=\"action\" value=\"save\">Save\u003c/button>'\n                   '\u003cbutton class=\"btn primary\" name=\"action\" value=\"return\">Save and go back\u003c/button>')\n    else:\n        buttons = '\u003cbutton class=\"btn primary\" name=\"action\" value=\"save\">Save\u003c/b

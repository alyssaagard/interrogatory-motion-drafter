") == \"objection\" else \"answer\",\n                  \"name\": form.text(f\"c-{i}-name\"), \"text\": form.text(f\"c-{i}-text\")}\n        if form.get(f\"c-{i}-id\"):\n            clause[\"id\"] = form.get(f\"c-{i}-id\")\n        updated.append(clause)\n\n    action = form.get(\"action\", \"save\")\n    if action == \"restore\":\n        changes.pop(\"clauses\", None)\n        storage.save_library_changes(changes)\n        flash(\"The original list is back.\")\n        return redirect(\"/library/clauses\")\n    if action == \"add\":\n        updated.append({\"kind\": \"answer\", \"name\": \"\", \"text\": \"\"})\n    elif action.startswith(\"remove:\") and action[7:].isdigit() and int(action[7:]) \u003c len(updated):\n        updated.pop(int(action[7:]))\n    flash(\"Saved.\")\n    changes[\"clauses\"] = updated\n    storage.save_library_changes(changes)\n    return redirect(\"/library/clauses\")\n\n\n# ---------------------------------------------------------------- backup and restore\n# One file holding every matter, the firm settings and the library changes. Also the way to\n# move records from one copy of the program to another.\n\nBACKUP_FORMAT = \"interrogatory-drafter-backup-1\"\n\n\ndef backup():\n    records = {}\n    for key in [\"settings\", \"library\"] + sorted(storage.store.keys(\"matters\")):\n        value = storage.store.read(key)\n        if value is not None:\n            records[key] = value\n    data = {\"format\": BACKUP_FORMAT, \"saved\": datetime.now().isoformat(timespec=\"seconds\"), \"records\": records}\n    stamp = datetime.now().strftime(\"%Y-%m-%d\")\n    return {\"status\": 200, \"type\": \"application/json\", \"filename\": f\"Drafter backup {stamp}.json\",\n            \"body\": json.dumps(data, indent=1, ensure_ascii=False).encode(\"utf-8\")}\n\n\ndef restore(form):\n    if form.get(\"confirm\") != \"yes\":\n        flash(\"Check the box to confirm the restore.\", \"red\")\n        return redirect(\"/settings\")\n    try:\n        data = json.loads(form.get(\"backup\") or \"\")\n        records = data[\"records\"] if data.get(\"format\") == BACKUP_FORMAT else None\n    except (ValueError, TypeError, KeyError, AttributeError):\n        records = None\n    if not isinstance(records, dict):\n        flash(\"That file is not a backup from this program.\", \"red\")\n        return redirect(\"/settings\")\n    count = 0\n    for key, value in records.items():\n        is_matter = key.startswith(\"matters/\") and storage.valid_id(key[8:])\n        if (key in (\"settings\", \"library\") or is_matter) and isinstance(value, dict):\n            storage.store.write(key, value)\n            count += 1 if is_matter else 0\n    flash(f\"Restored {count} matter{'' if count == 1 else 's'} and the saved settings.\")\n    return redirect(\"/\")\n", "templates/base.html": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>$title\u003c/title>\n\u003cstyle>\n/* Black and white with greys, Times New Roman throughout.\n   Color is used only for status: green approved, blue checked, amber recheck, red missing. */\n:root {\n  color-scheme: light;\n  --ink: #141414;\n  --muted: #6B6B6B;\n  --faint: #9B9B9B;\n  --line: #E7E7E7;\n  --line-strong: #D3D3D3;\n  --bg: #F6F6F6;\n  --surface: #FFFFFF;\n  --hover: #F3F3F3;\n  --selected: #EDEDED;\n  --black: #111111;\n  --serif: \"Times New Roman\", Times, \"Liberation Serif\", serif;\n  --mono: Consolas, Menlo, \"Courier New\", monospace;\n  --radius: 6px;\n\n  --green: #1E7F4F;  --green-bg: #E6F4EC;  --green-line: #A9D8BE;\n  --blue: #2557B5;   --blue-bg: #E9EFFA;   --blue-line: #B9CBEE;\n  --amber: #9A5A00;  --amber-bg: #FDF2DA;  --amber-line: #EDCB86;\n  --red: #B42318;    --red-bg: #FCECEB;    --red-line: #F0B7B2;\n  --grey-bg: #F0F0F0;\n}\n* { box-sizing: border-box; }\nhtml { -webkit-text-size-adjust: 100%; }\nbody { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--serif); }\nbutton, input, select, textarea { font: inherit; color: inherit; }\na { color: var(--ink); text-underline-offset: 2px; text-decoration-color: var(--line-strong); }\na:hover { text-decoration-color: var(--ink); }\n:focus-visible { outline: 2px solid var(--black); outline-offset: 2px; }\n.muted { color: var(--muted); }\n.small { font-size: 14px; }\n.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }\n.between { justify-content: space-between; }\n\n/* application frame */\n.topbar { position: sticky; top: 0; z-index: 20; height: 52px; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 22px; padding: 0 20px; }\n.app-name { font-weight: bold; font-size: 18px; text-decoration: none; white-space: nowrap; }\n.demo-tag { margin-left: -12px; font-size: 12.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line-strong); border-radius: 999px; padding: 0 9px; white-space: nowrap; }\n.matter-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); font-size: 15px; }\n.matter-name b { color: var(--ink); font-weight: normal; }\n.due { font-size: 14px; padding: 3px 11px; border-radius: 999px; background: var(--grey-bg); color: var(--muted); white-space: nowrap; }\n.due.ok { background: var(--green-bg); color: var(--green); }\n.due.soon { background: var(--amber-bg); color: var(--amber); font-weight: bold; }\n.due.late { background: var(--red-bg); color: var(--red); font-weight: bold; }\n.layout { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: calc(100vh - 52px); }\n.sidebar { background: var(--surface); border-right: 1px solid var(--line); padding: 14px 10px 40px; position: sticky; top: 52px; height: calc(100vh - 52px); overflow-y: auto; }\n.sidebar h4 { font-size: 12.5px; font-weight: normal; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); margin: 16px 10px 6px; }\n.sidebar h4:first-child { margin-top: 2px; }\n.nav { display: flex; gap: 10px; align-items: baseline; padding: 6px 10px; border-radius: var(--radius); color: var(--ink); text-decoration: none; }\n.nav:hover { background: var(--hover); }\n.nav.on { background: var(--selected); }\n.nav.on b { font-weight: bold; }\n.nav .num { min-width: 1.1em; color: var(--faint); font-variant-numeric: tabular-nums; }\n.nav .t { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }\n.nav b { font-weight: normal; font-size: 15.5px; }\n.nav i { font-style: normal; font-size: 13.5px; color: var(--muted); }\n.nav i.red { color: var(--red); }\n.nav i.green { color: var(--green); }\n.content { padding: 26px 32px 120px; min-width: 0; max-width: 1240px; }\n@media (max-width: 900px) {\n  .topbar { height: auto; flex-wrap: wrap; gap: 4px 16px; padding: 10px 16px; position: static; }\n  .matter-name { flex-basis: 100%; white-space: normal; }\n  .layout { grid-template-columns: minmax(0, 1fr); }\n  .sidebar { position: static; height: auto; display: flex; overflow-x: auto; padding: 6px 10px; border-right: 0; border-bottom: 1px solid var(--line); }\n  .sidebar h4, .nav i { display: none; }\n  .nav { flex: none; }\n  .content { padding: 18px 16px 80px; }\n}\n\n.flash { margin-bottom: 18px; padding: 9px 14px; border-radius: var(--radius); background: var(--green-bg); color: var(--green); }\n.flash.red { background: var(--red-bg); color: var(--red); }\n\n/* page heading */\n.page-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 10px 20px; margin-bottom: 22px; }\n.page-head h1 { margin: 0; font-size: 27px; line-height: 1.2; font-weight: bold; }\n.page-head .step { display: block; font-size: 13.5px; color: var(--faint); letter-spacing: .04em; margin-bottom: 2px; }\n.page-head p { margin: 6px 0 0; color: var(--muted); max-width: 70ch; }\n\n/* panels and fields */\n.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 18px; min-width: 0; }\n.panel > header { padding: 14px 18px 0; }\n.panel h2 { margin: 0; font-size: 18px; }\n.panel h3 { margin: 0; font-size: 16px; }\n.note { margin: 3px 0 0; color: var(--muted); font-size: 14.5px; max-width: 76ch; }\n.panel-body { padding: 14px 18px 18px; }\n.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 14px 20px; }\n.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }\n.field.full { grid-column: 1 / -1; }\n[id^=\"at-\"], .panel[id] { scroll-margin-top: 80px; }\n.field > label, .field .label { font-size: 15px; font-weight: bold; }\n.hint { font-size: 13.5px; color: var(--faint); }\n.needed { font-size: 13.5px; color: var(--red); }\n.field.need > input, .field.need > select, .field.need > textarea { border-color: var(--red-line); background: #FFFCFB; }\n.field:target > input, .field:target > textarea, .field:target > select, .field.is-target > input, .field.is-target > textarea, .field.is-target > select { box-shadow: 0 0 0 3px var(--amber-line); }\ninput[type=text], input[type=date], input[type=time], input[type=number], select, textarea {\n  width: 100%; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 4px; padding: 6px 9px; min-height: 36px; font-size: 16px; }\ntextarea { min-height: 72px; resize: vertical; line-height: 1.45; }\ninput:focus, select:focus, textarea:focus { outline: none; border-color: var(--black); box-shadow: 0 0 0 3px rgba(0,0,0,.07); }\ninput[type=radio], input[type=checkbox] { accent-color: var(--black); width: 16px; height: 16px; margin: 0; flex: none; }\n.yn { display: flex; gap: 22px; padding: 6px 2px; }\n.yn label { display: inline-flex; gap: 7px; align-items: center; }\n.rows { display: flex; flex-direction: column; gap: 12px; }\n.list-row { border: 1px solid var(--line); border-radius: var(--radius); background: #FCFCFC; }\n.list-row > header { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 12px 0; }\n.list-row > header b { font-size: 14.5px; color: var(--muted); font-weight: normal; }\n.list-row > .fields { padding: 10px 12px 14px; }\n.empty { color: var(--faint); margin: 0; }\n.save-bar { position: sticky; bottom: 0; z-index: 5; margin-top: 10px; padding: 12px 0; background: linear-gradient(rgba(246,246,246,0), var(--bg) 35%); display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }\n\n/* buttons */\n.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 4px; padding: 6px 14px; font-size: 15px; cursor: pointer; min-height: 36px; color: var(--ink); text-decoration: none; }\n.btn:hover { background: var(--hover); }\n.btn.primary { background: var(--black); border-color: var(--black); color: #FFFFFF; }\n.btn.primary:hover { background: #333333; }\n.btn.approve { background: var(--green); border-color: var(--green); color: #FFFFFF; }\n.btn.approve:hover { background: #17673F; }\n.btn.check { background: var(--blue); border-color: var(--blue); color: #FFFFFF; }\n.btn.check:hover { background: #1D4794; }\n.btn.quiet { border-color: transparent; background: transparent; color: var(--muted); }\n.btn.quiet:hover { background: var(--hover); color: var(--ink); }\n.btn.danger { color: var(--red); }\n.btn.small { padding: 3px 10px; min-height: 30px; font-size: 14px; }\n.btn[disabled] { opacity: .4; cursor: not-allowed; }\n\n/* status */\n.st { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; line-height: 1.5; padding: 1px 9px; border-radius: 999px; background: var(--grey-bg); color: var(--muted); white-space: nowrap; }\n.st::before { content: \"\"; width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }\n.st-approved { background: var(--green-bg); color: var(--green); }\n.st-checked { background: var(--blue-bg); color: var(--blue); }\n.st-recheck { background: var(--amber-bg); color: var(--amber); }\n.st-missing, .st-blank { background: var(--red-bg); color: var(--red); }\n.st-edited { background: var(--grey-bg); color: var(--ink); }\n\n.callout { border-radius: var(--radius); padding: 10px 14px; margin-bottom: 14px; background: var(--grey-bg); }\n.callout.red { background: var(--red-bg); color: #7E1A12; }\n.callout.amber { background: var(--amber-bg); color: #6B4000; }\n.callout.green { background: var(--green-bg); color: #145A37; }\n.callout.blue { background: var(--blue-bg); color: #1B3F84; }\n\n/* Form A answers */\n.review { display: grid; grid-template-columns: minmax(270px, 330px) minmax(0, 1fr); gap: 18px; align-items: start; }\n@media (max-width: 1100px) { .review { grid-template-columns: minmax(0, 1fr); } }\n.index { position: sticky; top: 70px; margin: 0; }\n.counts { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; padding: 14px 16px 10px; font-size: 14.5px; }\n.counts b { font-variant-numeric: tabular-nums; }\n.count-green b { color: var(--green); }\n.count-blue b { color: var(--blue); }\n.count-amber b { color: var(--amber); }\n.count-red b { color: var(--red); }\n.filters { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 12px 10px; }\n.filters a { font-size: 14px; padding: 2px 10px; border-radius: 999px; text-decoration: none; color: var(--muted); }\n.filters a:hover { background: var(--hover); }\n.filters a.on { background: var(--black); color: #FFFFFF; }\n.qlist { max-height: calc(100vh - 290px); overflow: auto; border-top: 1px solid var(--line); }\n.qtable { width: 100%; border-collapse: collapse; font-size: 15px; }\n.qtable td { padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }\n.qtable td:first-child { text-align: right; width: 2.6em; color: var(--faint); font-variant-numeric: tabular-nums; }\n.qtable tr:hover td { background: var(--hover); }\n.qtable nt-size: 15px; }\n.table th, .table td { border-bottom: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }\n.table thead th { font-weight: normal; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--faint); }\n.table tbody th { font-weight: normal; width: 56%; }\n.table small { display: block; color: var(--muted); font-size: 13.5px; }\n.table tr:last-child th, .table tr:last-child td { border-bottom: 0; }\n.scroll-x { overflow-x: auto; }\n.two-up { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 18px; margin-bottom: 18px; }\n.two-up > .panel, .stack > .panel { margin: 0; }\n.stack { display: flex; flex-direction: column; gap: 18px; min-width: 0; }\n.checks { margin: 0; padding: 0; list-style: none; }\n.checks li { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; border-top: 1px solid var(--line); }\n.checks li:first-child { border-top: 0; }\n.checks input { margin-top: 4px; }\n.checks small { display: block; color: var(--muted); font-size: 13.5px; }\n.green-text { color: var(--green); }\n.amber-text { color: var(--amber); }\n.red-text { color: var(--red); }\n\n/* documents */\n.doc-bar { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; margin: 6px 0 12px; }\n.doc-bar h2 { margin: 0; font-size: 19px; }\n.desk { overflow-x: auto; background: #ECECEC; border-radius: var(--radius); padding: 22px; }\n.sheet { background: #FFFFFF; color: #000000; box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 6px 24px rgba(0,0,0,.06); width: 8.5in; min-height: 11in; margin: 0 auto; padding: 1in; }\n@media (max-width: 980px) { .sheet { width: 100%; min-height: 0; padding: 26px 20px; } .desk { padding: 10px; } }\n.tabs { display: flex; flex-wrap: wrap; gap: 20px; border-bottom: 1px solid var(--line); }\n.tabs a { padding: 6px 0; margin-bottom: -1px; border-bottom: 2px solid transparent; color: var(--muted); text-decoration: none; }\n.tabs a.on { border-color: var(--black); color: var(--ink); font-weight: bold; }\n.motion-list { list-style: none; margin: 0; padding: 6px; }\n.motion-list a { display: block; padding: 9px 12px; border-radius: var(--radius); text-decoration: none; }\n.motion-list a:hover { background: var(--hover); }\n.motion-list li.on a { background: var(--selected); }\n.motion-list small { display: block; color: var(--muted); font-size: 14px; }\n.code { font-family: var(--mono) !important; font-size: 13.5px !important; }\n.preview { white-space: pre-wrap; border-radius: var(--radius); padding: 10px 12px; background: #FAFAFA; border: 1px solid var(--line); overflow-wrap: anywhere; }\n.back-link { margin-bottom: 18px; padding: 9px 14px; border-radius: var(--radius); background: var(--blue-bg); color: #1B3F84; display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; }\n.back-link a { color: #1B3F84; font-weight: bold; }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader class=\"topbar\">$topbar\u003c/header>\n\u003cdiv class=\"layout\">\n\u003cnav class=\"sidebar\" aria-label=\"Sections\">$nav\u003c/nav>\n\u003cmain class=\"content\">$flash$main\u003c/main>\n\u003c/div>\n\u003c/body>\n\u003c/html>\n", "templates/print.html": "\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003ctitle>$title\u003c/title>\n\u003cstyle>\n  @page { size: 8.5in 11in; margin: 1in; }\n  body { margin: 0; background: #FFFFFF; }\n  .tip { font: 15px \"Times New Roman\", Times, serif; padding: 10px 1in; border-bottom: 1px solid #B5B5B5; }\n  .page { max-width: 8.5in; padding: 0.5in 1in; }\n  @media print { .tip { display: none; } .page { padding: 0; max-width: none; } }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"tip\">Use your browser's Print command (Ctrl+P, or Cmd+P on a Mac). This line does not print. \u003ca href=\"$back\">Back\u003c/a>\u003c/div>\n\u003cdiv class=\"page\">$body\u003c/div>\n\u003c/body>\n\u003c/html>\n"}</script>

<!-- Pyodide runs Python inside the browser. It is downloaded once from this address, then cached. -->
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>

<script>
// This short script is only the bridge between the browser and the Python program.
// It starts Python, hands each click and form to webapp.handle(), and shows the page that comes back.
// Records are kept in this browser's storage (see storage.py, BrowserStore). Nothing is sent anywhere.

var request = null;
var current = "/";
var shownHash = "";

function splitUrl(url) {
  var anchor = "";
  var hash = url.indexOf("#");
  if (hash >= 0) { anchor = url.slice(hash + 1); url = url.slice(0, hash); }
  var question = url.indexOf("?");
  var path = question >= 0 ? url.slice(0, question) : url;
  var query = question >= 0 ? url.slice(question + 1) : "";
  return { url: url, path: path || "/", query: query, anchor: anchor };
}

function go(url, method, body) {
  method = method || "GET";
  body = body || "";
  try {
    for (var hops = 0; hops < 5; hops++) {
      var parts = splitUrl(url);
      var result = JSON.parse(request(method, parts.path, parts.query, body));
      if (result.location) {
        url = result.location; method = "GET"; body = "";
        continue;
      }
      if (result.filename) {
        saveFile(result);
        return;
      }
      show(result.body, parts.url, parts.anchor);
      return;
    }
  } catch (err) {
    alertBox("Something went wrong: " + err);
  }
}

function show(html, url, anchor) {
  var page = new DOMParser().parseFromString(html, "text/html");
  document.title = page.title;
  var old = document.querySelectorAll("style");
  for (var i = 0; i < old.length; i++) old[i].remove();
  var styles = page.querySelectorAll("style");
  for (var j = 0; j < styles.length; j++) {
    var style = document.createElement("style");
    style.textContent = styles[j].textContent;
    document.head.appendChild(style);
  }
  document.body.innerHTML = page.body.innerHTML;
  current = url;
  try {
    // the address bar shows where you are, so Back, Forward and Reload work
    if (location.hash !== "#" + url) location.hash = url;
    shownHash = location.hash;
  } catch (err) { /* some viewers do not allow changing the address; the program still works */ }

  var target = anchor ? document.getElementById(anchor) : null;
  if (target) {
    target.classList.add("is-target");
    target.scrollIntoView({ block: "start" });
    var input = target.querySelector("input, select, textarea, button");
    if (input) input.focus({ preventScroll: true });
  } else {
    window.scrollTo(0, 0);
  }
}

function saveFile(result) {
  var raw = atob(result.body);
  var bytes = new Uint8Array(raw.length);
  for (var i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
  var link = document.createElement("a");
  link.href = URL.createObjectURL(new Blob([bytes], { type: result.type }));
  link.download = result.filename;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(function () { URL.revokeObjectURL(link.href); }, 5000);
}

function alertBox(text) {
  var box = document.createElement("div");
  box.style.cssText = "position:fixed;left:16px;right:16px;bottom:16px;padding:12px 16px;background:#FCECEB;" +
                      "color:#7E1A12;border-radius:6px;font:15px 'Times New Roman',serif;z-index:99";
  box.textContent = text;
  document.body.appendChild(box);
}

// Links inside the program are handled here instead of loading a new page.
document.addEventListener("click", function (event) {
  var link = event.target.closest("a[href]");
  if (!link || !request) return;
  var href = link.getAttribute("href");
  if (href.charAt(0) !== "/") return;  // links to other websites open normally
  event.preventDefault();
  go(href);
});

// Forms are sent to the program the same way a browser would send them to a server.
document.addEventListener("submit", async function (event) {
  if (!request) return;
  event.preventDefault();
  var form = event.target;
  var data;
  try { data = new FormData(form, event.submitter); } catch (err) { data = new FormData(form); }
  if (event.submitter && event.submitter.name && !data.has(event.submitter.name)) {
    data.append(event.submitter.name, event.submitter.value);
  }
  var fields = new URLSearchParams();
  for (var pair of data.entries()) {
    var value = pair[1];
    if (typeof value !== "string") value = value.size ? await value.text() : "";  // a chosen file is read as text
    fields.append(pair[0], value);
  }
  var method = (form.getAttribute("method") || "get").toUpperCase();
  var action = form.getAttribute("action") || current;
  if (method === "GET") go(action.split("?")[0] + "?" + fields.toString());
  else go(action, "POST", fields.toString());
});

// The browser's Back and Forward buttons.
window.addEventListener("hashchange", function () {
  if (request && location.hash !== shownHash) go(location.hash.slice(1) || "/");
});

async function start() {
  var files = JSON.parse(document.getElementById("program").textContent);
  var pyodide = await loadPyodide();
  pyodide.FS.mkdirTree("/app/templates");
  for (var name in files) pyodide.FS.writeFile("/app/" + name, files[name]);
  pyodide.runPython([
    "import sys, json, base64",
    "sys.path.insert(0, '/app')",
    "import storage",
    "storage.use_browser_storage()",
    "import webapp",
    "def browser_request(method, path, query, body):",
    "    result = dict(webapp.handle(method, path, query, body))",
    "    if isinstance(result.get('body'), bytes):",
    "        result['body'] = base64.b64encode(result['body']).decode('ascii')",
    "    return json.dumps(result)",
  ].join("\n"));
  request = pyodide.globals.get("browser_request");
  var first = location.hash.slice(1);
  go(first.charAt(0) === "/" ? first : "/");
}

start().catch(function (err) {
  document.getElementById("loading-text").textContent =
    "The program could not start. Check the internet connection and reload the page. Details: " + err;
});
</script>
